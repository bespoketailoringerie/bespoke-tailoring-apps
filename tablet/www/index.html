          return `<div class="line"><div class="what"><b>${esc(l.name)}</b>
              <div class="opts">${kind}${l.qty > 1 && l.price ? ` · ${m(l.price)} each` : ""}${l.disc && l.disc.value ? ` · <span class="pill plain">${esc(discLabel(l.disc))}</span>` : ""}${l.tagId && !l.price && !l.paid ? ` · <span class="pill bad">Price needed</span>` : ""}</div></div>
            <div class="amt">${l.tagId ? `<button class="price-btn" data-act="line-price" data-i="${i}" aria-label="Set the price for ${esc(l.name)}">${off ? `<s>${m(gross)}</s>` : ""}${l.price || l.paid ? m(gross - off) : "Set price"}</button>` : `${off ? `<s>${m(gross)}</s>` : ""}${m(gross - off)}`}</div>
            <div class="ctl"><span class="qty"><button data-act="line-dec" data-i="${i}" aria-label="One fewer">−</button><span>${l.qty}</span><button data-act="line-inc" data-i="${i}" aria-label="One more">+</button></span>
              <button class="btn small ghost" data-act="line-disc" data-i="${i}">Discount</button>
              <button class="btn small ghost" data-act="line-del" data-i="${i}" style="margin-left:auto">Remove</button></div></div>`;
        }).join("") : `<div class="empty" style="margin:16px 18px">Tap a service tag, or Custom amount, to start a sale.</div>`}
      </div>
      <div class="sums">
        <div class="sum"><span>Subtotal</span><span>${m(t.subtotal)}</span></div>
        ${t.discount ? `<div class="sum"><span>Discounts${UI.cartDisc && UI.cartDisc.value ? " · " + esc(discLabel(UI.cartDisc)) + " on sale" : ""}</span><span>${m(-t.discount)}</span></div>` : ""}
        <div class="sum total"><span>Total</span><span>${m(t.total)}</span></div>
        ${unpriced() ? `<p class="small" style="margin:6px 0 0;color:var(--red)">Tap <b>Set price</b> on each alteration before taking payment.</p>` : ""}
        <button class="btn primary big" data-act="charge" ${UI.cart.length && !unpriced() ? "" : "disabled"}>${UI.cart.length && t.total === 0 ? "Finish sale" : `Take payment · ${m(t.total)}`}</button>
      </div>`;
  }

  function customersView() {
    return `<div class="people">
      <section class="roster" aria-label="Customer list">${rosterHtml()}</section>
      <section class="detail" id="cust-detail" aria-label="Customer">${custDetailHtml()}</section>
    </div>`;
  }
  // Tags tab: every open tag, soonest due first, grouped by when it's due.
  // ---------- Settings ----------
  // One tab for now: Prices. Each alteration on the tag can be given the shop's own price; an empty
  // box means the printed price menu (and, for a range like Fix Beading, a price set at the register).
  function settingsView() {
    const changed = Object.keys(settings.tagPrices || {}).filter((k) => TAG_ROW[k] && settings.tagPrices[k]).length;
    return `<div class="page"><div class="wrap">
      <div><span class="label">Settings</span><h2>Settings</h2></div>
      <div class="seg" role="tablist" aria-label="Settings sections"><button role="tab" data-act="set-tab" data-t="prices" aria-pressed="true" aria-selected="true">Prices</button></div>
      <div class="setpanel">
        <p class="muted" style="margin:0">The price each alteration rings up at when a tag is closed. Changes save as soon as you leave a box. Leave a box empty to use the price menu.</p>
        <p class="muted" style="margin:0">To change the order lines appear on the tag, press and drag the <span class="draghint" aria-hidden="true">⠿</span> handle on a line. Lines stay in their own section.</p>
        ${TAG.map((sec) => `<div class="pricesec"><h3>${esc(sec.title)}</h3>
          <div class="pricelist" data-s="${sec.id}">${rowsOf(sec).map(([k, label]) => priceRowHtml(k, label)).join("")}</div></div>`).join("")}
        <div class="row"><span class="muted small" id="prices-changed">${changed ? `${changed} price${changed === 1 ? "" : "s"} changed from the menu.` : "Every price matches the menu."}</span>
          ${changed ? `<button class="btn small ghost" data-act="prices-reset">Put every price back to the menu</button>` : ""}</div>
        <div class="row" id="order-row" ${Object.keys(settings.tagOrder || {}).length ? "" : "hidden"}><span class="muted small">The tag's lines are in your own order.</span>
          <button class="btn small ghost" data-act="order-reset">Put the lines back in the paper tag's order</button></div>
      </div></div></div>`;
  }
  function priceRowHtml(k, label) {
    const r = TAG_ROW[k]; const own = settings.tagPrices[k];
    const menu = r.price == null ? "Not on the menu" : Array.isArray(r.price) ? `Menu $${r.price[0]}–${r.price[1]}, set at the register` : `Menu $${r.price}`;
    return `<div class="pricerow ${own ? "changed" : ""}" id="pr-${k}" data-k="${k}">
      <button type="button" class="drag" aria-label="Drag to move ${esc(label)}" title="Drag to move">⠿</button>
      <label for="pi-${k}"><span>${esc(label)}</span><small>${esc(menu)}${r.note ? " · " + esc(r.note) : ""}</small></label>
      <span class="tpricebox"><span aria-hidden="true">$</span><input type="text" id="pi-${k}" inputmode="decimal" autocomplete="off" data-in="price" data-k="${k}"
        value="${own ? (own / 100).toFixed(2).replace(/\.00$/, "") : ""}" placeholder="${typeof r.price === "number" ? r.price : ""}"></span>
    </div>`;
  }
  async function savePrice(input) {
    const k = input.dataset.k; const raw = String(input.value || "").trim();
    const before = settings.tagPrices[k] || 0;
    let next = 0;
    if (raw) {
      next = toCents(raw);
      if (!(next > 0) || next > 1000000) { toast("Enter a price like 25 or 32.50, or leave the box empty for the menu price.", true); input.value = before ? (before / 100).toFixed(2).replace(/\.00$/, "") : ""; return; }
    }
    // Typing the menu price is the same as using the menu.
    if (next && next === listPrice(k)) next = 0;
    if (next === before) { input.value = next ? (next / 100).toFixed(2).replace(/\.00$/, "") : ""; return; }
    if (next) settings.tagPrices[k] = next; else delete settings.tagPrices[k];
    input.value = next ? (next / 100).toFixed(2).replace(/\.00$/, "") : "";
    const rowEl = document.getElementById("pr-" + k); if (rowEl) rowEl.classList.toggle("changed", !!next);
    await saveSettings();
    const r = TAG_ROW[k];
    toast(`${itemName(k)} now rings up at ${next ? m(next) : Array.isArray(r.price) ? "a price set at the register" : listPrice(k) ? m(listPrice(k)) + " (the menu price)" : "a price set at the register"}.`);
    const n = Object.keys(settings.tagPrices).filter((x) => TAG_ROW[x] && settings.tagPrices[x]).length;
    const c = document.getElementById("prices-changed"); if (c) c.textContent = n ? `${n} price${n === 1 ? "" : "s"} changed from the menu.` : "Every price matches the menu.";
  }

  // A search box with an X that clears it.
  const searchBox = (id, kind, value, placeholder) => `<div class="searchbox">
      <input type="text" id="${id}" placeholder="${esc(placeholder)}" value="${esc(value)}" data-in="${kind}" autocomplete="off" aria-label="${esc(placeholder)}">
      <button type="button" class="clear" data-act="search-clear" data-for="${id}" aria-label="Clear search" ${value ? "" : "hidden"}>✕</button></div>`;

  // Tags tab: every open tag, soonest due first, grouped by when it's due. The search matches the
  // customer's name or phone, the tag number, or anything written on the tag.
  function tagMatches(t, q) {
    if (!q) return true;
    const c = customers.find((x) => x.id === t.customerId) || {};
    const hay = [custName(c), c.phone, c.email, "#" + t.no, String(t.no), t.notes, ...tagLines(t).map((l) => l.name + " " + l.measure)].join(" ").toLowerCase();
    const qd = phoneDigits(q);
    return q.toLowerCase().split(/\s+/).filter(Boolean).every((w) => hay.includes(w)) || (qd.length >= 3 && phoneDigits(c.phone).includes(qd));
  }
  function tagsView() {
    const open = tags.filter((t) => t.status !== "closed");
    const late = open.filter(isLate).length;
    return `<div class="page"><div class="wrap">
      <div style="display:flex;gap:12px;align-items:end;flex-wrap:wrap"><div><span class="label">Tags</span><h2>Open tags</h2></div>
        <span class="muted" style="margin-left:auto">${open.length} open${late ? ` · <b style="color:var(--red)">${late} overdue</b>` : ""}</span></div>
      ${open.length ? searchBox("tag-q", "tagq", UI.tagQ || "", "Find a tag by name, phone, tag number or alteration") : ""}
      <div class="board" id="board">${boardHtml()}</div></div></div>`;
  }
  function boardHtml() {
    const open = tags.filter((t) => t.status !== "closed");
    if (!open.length) return `<div class="frame"><div class="in">
        <svg class="glyph" viewBox="0 0 72 72" aria-hidden="true"><rect x="22" y="8" width="28" height="56" fill="none" stroke="var(--red)" stroke-width="2"/><circle cx="36" cy="18" r="4" fill="none" stroke="var(--red)" stroke-width="2"/><path d="M28 32h16M28 40h16M28 48h10" stroke="var(--gold)" stroke-width="2"/></svg>
        <h3 style="font-size:24px">No open tags</h3>
        <p class="muted" style="margin:0;max-width:46ch">Open a tag from a customer on the Customers tab. Open tags show here, soonest due first.</p></div></div>`;
    const q = String(UI.tagQ || "").trim();
    const shown = open.filter((t) => tagMatches(t, q));
    if (!shown.length) return `<div class="empty">No open tags match “${esc(q)}”.</div>`;
    const key = (t) => t.due || "9999-99-99";
    const sorted = shown.sort((a, b) => key(a) < key(b) ? -1 : key(a) > key(b) ? 1 : (a.no || 0) - (b.no || 0));
    const t0 = today(), t1 = dayPlus(1), t7 = dayPlus(7);
    const groups = [
      ["late", "Overdue", (t) => t.due && t.due < t0],
      ["", "Due today", (t) => t.due === t0],
      ["", "Due tomorrow", (t) => t.due === t1],
      ["", "This week", (t) => t.due && t.due > t1 && t.due <= t7],
      ["", "Later", (t) => t.due && t.due > t7],
      ["", "No due date", (t) => !t.due],
    ];
    return groups.map(([cls, title, test]) => {
      const list = sorted.filter(test);
      return list.length ? `<div class="grp ${cls}"><span class="label">${title} <span class="n">${list.length}</span></span>
        <div class="tagcards">${list.map((t) => tagCardHtml(t, true)).join("")}</div></div>` : "";
    }).join("");
  }

  function custMatches() {
    const q = UI.custQ.trim().toLowerCase(), qd = phoneDigits(q);
    return customers.filter((c) => !q || `${c.name} ${c.email} ${c.phone}`.toLowerCase().includes(q) || (qd.length >= 3 && phoneDigits(c.phone).includes(qd)))
      .sort((a, b) => custName(a).toLowerCase() < custName(b).toLowerCase() ? -1 : 1);
  }
  const openCount = (c) => tags.filter((t) => t.customerId === c.id && t.status !== "closed").length;
  function rosterHtml() {
    return `<div class="find">
        ${searchBox("cust-q", "custq", UI.custQ, "Find a customer by name or phone")}
        <button class="btn primary" data-act="cust-new">+ New customer</button></div>
      <div class="who-list" id="who-list">${whoListHtml()}</div>`;
  }
  function whoListHtml() {
    const list = custMatches();
    if (!customers.length) return `<div class="empty" style="margin:16px">No customers yet. Tap <b>New customer</b> to add the first one.</div>`;
    if (!list.length) return `<div class="empty" style="margin:16px">No one matches “${esc(UI.custQ)}”.</div>`;
    return list.map((c) => { const n = openCount(c); return `<button data-act="cust-pick" data-id="${esc(c.id)}" aria-current="${UI.custSel === c.id}">
        <b>${esc(custName(c))}</b><span class="sub">${esc([c.phone, c.email].filter(Boolean).join(" · "))}</span>
        ${n ? `<span><span class="pill open">${n} open tag${n === 1 ? "" : "s"}</span></span>` : ""}</button>`; }).join("");
  }
  function custDetailHtml() {
    const c = customers.find((x) => x.id === UI.custSel);
    if (!c) return `<div class="frame"><div class="in">
        <svg class="glyph" viewBox="0 0 72 72" aria-hidden="true"><rect x="22" y="8" width="28" height="56" fill="none" stroke="var(--red)" stroke-width="2"/><circle cx="36" cy="18" r="4" fill="none" stroke="var(--red)" stroke-width="2"/><path d="M28 32h16M28 40h16M28 48h10" stroke="var(--gold)" stroke-width="2"/></svg>
        <h3 style="font-size:24px">${customers.length ? "Choose a customer" : "Add your first customer"}</h3>
        <p class="muted" style="margin:0;max-width:46ch">${customers.length ? "Pick someone from the list to see their tags or open a new one." : "Add a customer with a phone number, an email, or both. You can open their first tag straight away."}</p>
      </div></div>`;
    const mine = tags.filter((t) => t.customerId === c.id).sort((a, b) => (a.status === "closed") - (b.status === "closed") || (a.opened < b.opened ? 1 : -1));
    const lv = lastVisit(c);
    return `<div class="who-head"><div><span class="label">Customer</span><h2>${esc(custName(c))}</h2>
          <span class="muted">${esc([c.phone, c.email].filter(Boolean).join(" · "))}</span>
          <span class="lastvisit">${lv ? `Last visit <b>${esc(new Date(lv + "T12:00").toLocaleDateString([], { weekday: "short", month: "short", day: "numeric", year: "numeric" }))}</b> · ${esc(agoText(lv))}` : "No visits yet"}</span>
          ${c.spent ? `<div class="spentrow"><span>Spent <b>${m(Math.round(c.spent.total * 100))}</b></span>${["pos", "tablet", "staff"].filter((k) => c.spent[k]).map((k) => `<span>${{ pos: "POS", tablet: "Tablet", staff: "Added by hand" }[k]} ${m(Math.round(c.spent[k] * 100))}</span>`).join("")}${c.visits ? `<span>${c.visits} visit${c.visits === 1 ? "" : "s"}</span>` : ""}</div>` : ""}</div>
        <button class="btn ghost" data-act="cust-edit">Edit details</button>
        <button class="btn primary big" style="width:auto" data-act="tag-new">Open tag</button></div>
      <div class="tagcards">${mine.length ? mine.map(tagCardHtml).join("") : `<div class="empty">No tags yet. Tap <b>Open tag</b> to write up the alterations.</div>`}</div>`;
  }
  // The customer's last visit (a calendar day): the latest of a fitting booked through the website
  // that has happened, a purchase at either register, and a tag paid on this tablet. Opening a tag
  // doesn't count.
  function lastVisit(c) {
    const days = [];
    if (c.lastBooked) days.push(dayOf(c.lastBooked));
    if (c.lastBought) days.push(String(c.lastBought).slice(0, 10));
    for (const t of tags) if (t.customerId === c.id && t.status === "closed" && t.closedAt) days.push(dayOf(t.closedAt));
    for (const s of sales) if (s.customer && s.customer.id === c.id && !s.voided) days.push(dayOf(s.date));
    const t0 = today();
    return days.filter((d) => /^\d{4}-\d{2}-\d{2}$/.test(d) && d <= t0).sort().pop() || null;
  }
  function agoText(day) {
    const n = Math.round((new Date(today() + "T12:00") - new Date(day + "T12:00")) / 864e5);
    if (n <= 0) return "today";
    if (n === 1) return "yesterday";
    if (n < 14) return `${n} days ago`;
    if (n < 60) return `${Math.round(n / 7)} weeks ago`;
    if (n < 730) return `${Math.round(n / 30.4)} months ago`;
    return `${Math.round(n / 365)} years ago`;
  }

  function tagCardHtml(t, showWho) {
    const lines = tagLines(t); const [cls, label] = tagStatus(t);
    const c = showWho && customers.find((x) => x.id === t.customerId);
    const fmt = (iso) => new Date(iso).toLocaleDateString([], { month: "short", day: "numeric", year: "numeric" });
    const hard = t.hard && t.due && t.status !== "closed";
    return `<div class="tagcard ${t.status === "closed" ? "closed" : ""} ${isLate(t) ? "late" : ""} ${hard ? "hard" : ""}"><div class="in">
        ${hard ? `<div class="hardbar"><span>⚑ Hard date</span><b>${esc(new Date(t.due + "T12:00").toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" }))}</b><span>Can't be missed</span></div>` : ""}
        ${showWho ? `<button class="whom" data-act="tag-who" data-id="${esc(t.customerId)}">${esc(custName(c))}</button>` : ""}
        <div class="top"><b>Tag ${tagNo(t)}</b><span class="pill ${cls}">${label}</span>
          ${t.status !== "closed" ? `<span class="due-tag ${isLate(t) ? "late" : ""}">${esc(dueText(t))}${t.rush ? " · RUSH" : ""}</span>` : ""}
          <span class="muted small">Opened ${fmt(t.opened)}${t.status === "closed" && t.closedAt ? ` · paid ${fmt(t.closedAt)}` : ""}</span>
          ${t.paid && t.status !== "closed" ? `<span class="pill done">Paid</span>` : ""}<span class="money" style="margin-left:auto;font-weight:700">${t.status === "closed" ? m(t.total || 0) : m(tagTotal(t).sum) + (tagTotal(t).unset.length ? "+" : "")}</span></div>
        <div class="items">${lines.length ? lines.map((l) => esc(`${l.qty > 1 ? l.qty + " × " : ""}${l.name}${l.measure ? " " + l.measure : ""}`)).join(" · ") : '<span class="muted">Nothing ticked yet</span>'}</div>
        ${t.notes ? `<div class="small muted" style="white-space:pre-wrap">${esc(t.notes)}</div>` : ""}
        <div class="row">${t.status === "closed"
          ? `<button class="btn small" data-act="tag-view" data-id="${esc(t.id)}">View tag</button>${t.saleId ? `<button class="btn small ghost" data-act="sale-open" data-id="${esc(t.saleId)}">Receipt T-${esc(t.receiptNo)}</button>` : ""}`
          : t.status === "register"
          ? `<button class="btn small primary" data-act="nav" data-v="register">Go to the register</button>`
          : `<button class="btn small" data-act="tag-edit" data-id="${esc(t.id)}">Edit tag</button><button class="btn small primary" data-act="tag-close" data-id="${esc(t.id)}">${t.paid ? "Close tag (paid)" : "Take payment &amp; close tag"}</button>`}</div>
      </div></div>`;
  }

  // ---------- receipts ----------
  function receiptBody(rec) {
    const row = (a, b, cls = "") => `<div class="rc-r ${cls}"><span>${a}</span><span>${b}</span></div>`;
    let b = `<div class="rc-c"><div class="rc-shop">${esc(SHOP.name)}</div><div>${esc(SHOP.address)}</div><div>${esc(SHOP.phone)}</div></div><div class="rc-hr"></div>`;
    b += row(`Receipt ${recNo(rec)}`, "", "rc-b") + row(dateLong(rec.date), "");
    if (rec.customer) b += row(esc(custName(rec.customer)), "");
    if (rec.tagNos && rec.tagNos.length) b += row(`Tag ${rec.tagNos.map((n) => "#" + n).join(", ")}`, "");
    if (rec.voided) b += `<div class="rc-c rc-b">*** VOIDED ***</div>`;
    b += `<div class="rc-hr"></div>`;
    for (const l of rec.lines) {
      b += row(`${l.qty} × ${esc(l.name)}`, m(l.price * l.qty));
      if (l.measure) b += `<div class="rc-o">${esc(l.measure)}</div>`;
      if (l.disc && l.disc.value) b += row(`&nbsp;&nbsp;${esc(discLabel(l.disc))}`, m(-discountOf(l.price * l.qty, l.disc)), "rc-o");
    }
    b += `<div class="rc-hr"></div>` + row("Subtotal", m(rec.subtotal));
    if (rec.discount) b += row(`Discounts${rec.cartDisc && rec.cartDisc.value ? " (incl. " + esc(discLabel(rec.cartDisc)) + ")" : ""}`, m(-rec.discount));
    b += row("TOTAL", m(rec.total), "rc-b rc-big") + `<div class="rc-hr"></div>`;
    for (const p of rec.payments) b += row(esc(p.method) + (p.ref ? ` (${esc(p.ref)})` : ""), m(p.amount));
    if (rec.change) b += row("Change", m(rec.change));
    b += `<div class="rc-hr"></div><div class="rc-c">${esc(SHOP.footer)}</div>`;
    return `<div class="rc">${b}</div>`;
  }
  function receiptText(rec) {
    const W = 36, r = (a, b) => a + " ".repeat(Math.max(1, W - a.length - b.length)) + b, hr = "-".repeat(W);
    const out = [SHOP.name, SHOP.address, SHOP.phone, hr, `Receipt ${recNo(rec)}`, dateLong(rec.date)];
    if (rec.customer) out.push(custName(rec.customer));
    if (rec.tagNos && rec.tagNos.length) out.push(`Tag ${rec.tagNos.map((n) => "#" + n).join(", ")}`);
    if (rec.voided) out.push("*** VOIDED ***");
    out.push(hr);
    for (const l of rec.lines) { out.push(r(`${l.qty} x ${l.name}`, m(l.price * l.qty))); if (l.measure) out.push("  " + l.measure); if (l.disc && l.disc.value) out.push(r(`  ${discLabel(l.disc)}`, m(-discountOf(l.price * l.qty, l.disc)))); }
    out.push(hr, r("Subtotal", m(rec.subtotal)));
    if (rec.discount) out.push(r("Discounts", m(-rec.discount)));
    out.push(r("TOTAL", m(rec.total)), hr);
    for (const p of rec.payments) out.push(r(p.method + (p.ref ? ` (${p.ref})` : ""), m(p.amount)));
    if (rec.change) out.push(r("Change", m(rec.change)));
    out.push(hr, SHOP.footer);
    return out.join("\n");
  }

  // ---------- dialogs ----------
  function keypad() {
    return `<div class="keypad">${["1", "2", "3", "4", "5", "6", "7", "8", "9", "00", "0", "⌫"].map((k) => `<button data-act="key" data-k="${k}" ${k === "⌫" ? 'aria-label="Delete last digit"' : ""}>${k}</button>`).join("")}</div>`;
  }
  const padCents = (d) => Number(d.digits || "0");

  function dialogHtml() {
    const d = UI.dialog;
    if (!d) return "";
    const wrap = (inner, wide) => `<div class="scrim" data-act="scrim"><div class="dialog ${wide ? "wide" : ""}" role="dialog" aria-modal="true"><div class="in">${inner}</div></div></div>`;

    if (d.type === "custom") {
      return wrap(`<h2>Custom amount</h2>
        <div class="pad-wrap">
          <div style="display:grid;gap:14px">
            <label class="f"><span>Description</span><input type="text" id="cu-name" value="${esc(d.name)}" data-in="dlg" data-k="name" placeholder="e.g. Hem trousers" autocomplete="off"></label>
            <div style="display:grid;gap:6px"><span class="label">Price</span><div class="amtbox" id="amtbox">${m(padCents(d))}</div></div>
            <p class="muted small" style="margin:0">Type the price on the keypad. 1 5 0 0 rings up $15.00.</p>
          </div>
          ${keypad()}
        </div>
        <div class="foot"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="custom-add">Add to sale</button></div>`, true);
    }
    if (d.type === "disc") {
      const base = d.target === "cart" ? null : UI.cart[d.target];
      return wrap(`<h2>${d.target === "cart" ? "Discount the whole sale" : "Discount " + esc(base.name)}</h2>
        <div class="row"><div class="seg"><button data-act="disc-type" data-t="%" aria-pressed="${d.dtype === "%"}">Percent</button><button data-act="disc-type" data-t="$" aria-pressed="${d.dtype === "$"}">Dollars</button></div>
          <input type="text" id="disc-v" inputmode="decimal" style="max-width:150px" value="${esc(d.value)}" data-in="dlg" data-k="value" placeholder="${d.dtype === "%" ? "10" : "5.00"}"></div>
        <div class="chips">${(d.dtype === "%" ? ["10", "15", "20", "25", "50"] : ["5", "10", "20", "25"]).map((v) => `<button class="chip" data-act="disc-quick" data-v="${v}">${d.dtype === "%" ? v + "%" : "$" + v}</button>`).join("")}</div>
        <div class="foot"><button class="btn ghost left" data-act="disc-clear">Remove discount</button><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="disc-apply">Apply</button></div>`);
    }
    if (d.type === "edit-svc") {
      return wrap(`<h2>Service buttons</h2>
        <p class="muted small" style="margin:0">These are the tags on the Register. Tick Made to measure for set-price garments like a custom shirt.</p>
        <div style="display:grid;gap:10px">${d.rows.length ? d.rows.map((r, i) => `<div class="edit-row">
            <input type="text" id="sv-n-${i}" value="${esc(r.name)}" data-in="svc" data-i="${i}" data-k="name" placeholder="Name" aria-label="Button name" autocomplete="off">
            <input type="text" id="sv-p-${i}" value="${esc(r.price)}" data-in="svc" data-i="${i}" data-k="price" inputmode="decimal" placeholder="0.00" aria-label="Price" class="money">
            <button class="btn small ghost" data-act="svc-del" data-i="${i}">Remove</button>
            <label class="row small" style="grid-column:1/-1;gap:8px"><input type="checkbox" id="sv-f-${i}" data-in="svc" data-i="${i}" data-k="fixed" ${r.fixed ? "checked" : ""} style="width:22px;height:22px;accent-color:var(--red)"> Made to measure</label>
          </div>`).join("") : `<div class="empty">No buttons yet.</div>`}</div>
        <div class="foot"><button class="btn left" data-act="svc-add">+ Add a button</button><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="svc-save">Save buttons</button></div>`, true);
    }
    if (d.type === "cust") {
      return wrap(`<h2>${d.id ? "Edit customer" : "New customer"}</h2>
        <label class="f"><span>Name</span><input type="text" id="cs-name" value="${esc(d.name)}" data-in="dlg" data-k="name" autocomplete="off" autocapitalize="words"></label>
        <label class="f"><span>Phone</span><input type="text" id="cs-phone" inputmode="tel" value="${esc(d.phone)}" data-in="dlg" data-k="phone" autocomplete="off"></label>
        <label class="f"><span>Email</span><input type="text" id="cs-email" inputmode="email" value="${esc(d.email)}" data-in="dlg" data-k="email" autocomplete="off" autocapitalize="none"></label>
        <p class="muted small" style="margin:0">Give a phone number, an email, or both.</p>
        <div class="foot"><button class="btn left" data-act="close">Cancel</button>
          <button class="btn ${d.id ? "primary" : ""}" data-act="cust-save">Save</button>
          ${d.id ? "" : `<button class="btn primary" data-act="cust-save-tag">Save and open tag</button>`}</div>`);
    }
    if (d.type === "tag") return `<div class="scrim" data-act="scrim"><div class="dialog tagsheet" role="dialog" aria-modal="true" aria-label="Alteration tag"><div class="in">${tagSheetHtml(d)}</div></div></div>`;
    if (d.type === "price") {
      const l = UI.cart[d.i];
      return wrap(`<h2>Price for ${esc(l.name)}</h2>
        <div class="pad-wrap">
          <div style="display:grid;gap:14px">
            <div style="display:grid;gap:6px"><span class="label">Price each</span><div class="amtbox" id="amtbox">${m(padCents(d))}</div></div>
            ${l.range ? `<p class="small" style="margin:0">Price menu: <b>${esc(l.range)}</b>${l.note ? `, ${esc(l.note)}` : ""}.</p>` : l.note ? `<p class="small" style="margin:0">${esc(l.note)}</p>` : ""}
            ${l.qty > 1 ? `<p class="muted small" style="margin:0">${l.qty} pieces on this tag, so the line comes to <b id="price-x">${m(padCents(d) * l.qty)}</b>.</p>` : ""}
            ${l.tagKey ? `<label class="row small" style="gap:10px"><input type="checkbox" id="pr-keep" data-in="dlg" data-k="keep" ${d.keep ? "checked" : ""} style="width:22px;height:22px;accent-color:var(--red)"> Use this price every time for ${esc(l.name)}</label>` : ""}
          </div>
          ${keypad()}
        </div>
        <div class="foot"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="price-set">Set price</button></div>`, true);
    }
    if (d.type === "pay") return wrap(payHtml(d));
    if (d.type === "receipt") {
      const rec = sales.find((x) => x.id === d.id);
      if (!rec) return "";
      return wrap(`<div class="receipt-view"><div class="slip">${receiptBody(rec)}</div>
        <div style="display:grid;gap:14px;align-content:start">
          <div><span class="label">${d.fresh ? "Sale complete" : dateLong(rec.date)}</span><h2>Receipt ${recNo(rec)}</h2>
            ${rec.voided ? '<span class="pill bad">Voided</span>' : ""}
            ${d.fresh && rec.change ? `<p class="due change-due"><span>Change due</span><span class="money">${m(rec.change)}</span></p>` : ""}</div>
          <button class="btn" data-act="rc-copy">Copy receipt text</button>
          <p class="muted small" style="margin:0">Paste it into a text or email to send the customer their receipt.</p>
          ${!d.fresh && !rec.voided ? `<button class="btn ghost" data-act="rc-void" style="justify-self:start">Void this sale</button>` : ""}
          <div class="foot">${d.fresh ? `<button class="btn primary" data-act="close">Start next sale</button>` : `<button class="btn" data-act="close">Close</button>`}</div>
        </div></div>`, true);
    }
    if (d.type === "link") {
      const st = sync ? sync.status : { state: "off" };
      const when = st.lastOk ? new Date(st.lastOk).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "";
      const line = !link.key ? "Not connected yet." : st.state === "ok" ? `Connected. Last synced at ${when}.` : st.state === "syncing" ? "Syncing now…" : st.state === "badkey" ? st.error : st.state === "offline" ? st.error : "Connected.";
      return wrap(`<h2>Customer list</h2>
        <p class="muted" style="margin:0">Connects this tablet to the website's customer list, so customers and their spending are shared with the shop computer and the staff page.</p>
        <p style="margin:0"><b>${esc(line)}</b>${sync && sync.pending() ? ` ${sync.pending()} change${sync.pending() === 1 ? "" : "s"} waiting to send.` : ""}</p>
        <label class="f"><span>Tablet key</span><input type="text" id="lk-key" value="${esc(d.key)}" data-in="dlg" data-k="key" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="TABLET_APP_KEY from Netlify"></label>
        <label class="f"><span>Website address</span><input type="text" id="lk-base" value="${esc(d.base)}" data-in="dlg" data-k="base" autocomplete="off" autocapitalize="none" spellcheck="false"></label>
        <div class="foot">${link.key ? `<button class="btn ghost left" data-act="link-off">Disconnect</button>` : ""}<button class="btn" data-act="close">Close</button>
          ${link.key ? `<button class="btn" data-act="link-sync">Sync now</button>` : ""}<button class="btn primary" data-act="link-save">${link.key ? "Save" : "Connect"}</button></div>`);
    }
    if (d.type === "confirm") {
      return wrap(`<h2>${esc(d.title)}</h2><p style="margin:0">${d.text}</p>
        <div class="foot"><button class="btn" data-act="close">Keep it</button><button class="btn primary" data-act="confirm-yes">${esc(d.yes)}</button></div>`);
    }
    return "";
  }

  function tagSheetHtml(d) {
    const t = d.tag; const c = customers.find((x) => x.id === t.customerId);
    const ro = d.readOnly;
    const row = (k, label) => {
      const r = t.items[k] || {}; const on = !!r.on; const pt = shownPrice(k);
      return `<div class="trow ${on ? "on" : ""}" id="tr-${k}">
        <button class="tick" data-act="tag-tick" data-k="${k}" aria-pressed="${on}" ${ro ? "disabled" : ""}><i></i><span>${esc(label)}${pt ? ` <small class="tprice">${pt}</small>` : ""}</span></button>
        <span class="tpricebox ${r.price ? "own" : ""}" title="Price for this tag only"><span aria-hidden="true">$</span><input type="text" id="tp-${k}" value="${r.price ? (r.price / 100).toFixed(2).replace(/\.00$/, "") : ""}" data-in="tagp" data-k="${k}" placeholder="${esc(pt.replace(/^\$/, "") || "Price")}" aria-label="${esc(label)} price on this tag" inputmode="decimal" autocomplete="off" ${ro ? "readonly" : ""}></span>
        <span class="qty" aria-label="How many"><button data-act="tag-qty" data-k="${k}" data-d="-1" aria-label="One fewer" ${ro ? "disabled" : ""}>−</button><span id="tq-${k}">×${Math.max(1, r.qty || 1)}</span><button data-act="tag-qty" data-k="${k}" data-d="1" aria-label="One more" ${ro ? "disabled" : ""}>+</button></span>
      </div>`;
    };
    const others = (t.others || []).map((o, i) => `<div class="trow other on">
        <input type="text" id="to-l-${i}" value="${esc(o.label)}" data-in="tago" data-i="${i}" data-k="label" placeholder="Alteration" aria-label="Alteration" autocomplete="off" ${ro ? "readonly" : ""}>
        <span class="tpricebox"><span aria-hidden="true">$</span><input type="text" id="to-p-${i}" value="${o.price ? (o.price / 100).toFixed(2).replace(/\.00$/, "") : ""}" data-in="tago" data-i="${i}" data-k="price" placeholder="Price" aria-label="Price" inputmode="decimal" autocomplete="off" ${ro ? "readonly" : ""}></span>
        <span class="qty"><button data-act="tago-qty" data-i="${i}" data-d="-1" aria-label="One fewer" ${ro ? "disabled" : ""}>−</button><span id="toq-${i}">×${Math.max(1, o.qty || 1)}</span><button data-act="tago-qty" data-i="${i}" data-d="1" aria-label="One more" ${ro ? "disabled" : ""}>+</button></span>
        ${ro ? "" : `<button class="btn small ghost" data-act="tago-del" data-i="${i}" aria-label="Remove this line">✕</button>`}
      </div>`).join("");
    return `<div class="thead"><h2>${esc(custName(c))}</h2><span class="num">${t.no ? "Tag " + tagNo(t) : "New tag"}</span>
        <span class="muted small">Opened ${new Date(t.opened).toLocaleDateString([], { month: "short", day: "numeric", year: "numeric" })}</span></div>
      <div class="tdue" id="tdue">${dueHtml(d)}</div>
      ${TAG.map((sec) => {
        const used = sec.rows.filter(([k]) => t.items[k] && t.items[k].on).length;
        const open = sec.paper || used || (d.open && d.open[sec.id]);
        if (ro && !sec.paper && !used) return "";
        return `<div class="tsec">${sec.paper
          ? `<h3>${sec.title}</h3>`
          : `<button class="tsec-toggle" data-act="tsec" data-s="${sec.id}" aria-expanded="${!!open}"><h3>${sec.title}${used ? ` <span class="tused">${used}</span>` : ""}</h3><span aria-hidden="true">${open ? "−" : "+"}</span></button>`}
          ${open ? `<div class="trows">${rowsOf(sec).map(([k, l]) => row(k, l)).join("")}</div>` : ""}</div>`;
      }).join("")}
      <div class="tsec"><h3>Other</h3><div style="display:grid">${others || (ro ? `<p class="muted small" style="margin:8px 0">None</p>` : "")}</div>
        ${ro ? "" : `<button class="btn small" data-act="tago-add" style="justify-self:start;margin-top:8px">+ Add another alteration</button>`}</div>
      <label class="f"><span style="color:var(--ink)">Notes</span><textarea class="tnotes" id="tag-notes" data-in="tagn" ${ro ? "readonly" : ""} placeholder="Fabric, fit notes, pickup date…">${esc(t.notes || "")}</textarea></label>
      <div class="ttotal" id="ttotal">${tagTotalHtml(t)}</div>
      <div class="foot">${ro
        ? `<button class="btn primary" data-act="close">Close</button>`
        : `${d.isNew ? `<button class="btn ghost left" data-act="tag-discard">Discard tag</button>` : `<button class="btn ghost left" data-act="tag-delete">Delete tag</button>`}
           <button class="btn" data-act="tag-save-close" id="tsc">${t.paid ? "Close tag (paid)" : "Close tag &amp; take payment"}</button><button class="btn primary" data-act="tag-save">Save tag</button>`}</div>`;
  }

  function dueHtml(d) {
    const t = d.tag;
    if (d.readOnly) return `<span class="label" style="color:var(--ink)">Due</span><span>${esc(t.due ? new Date(t.due + "T12:00").toLocaleDateString([], { weekday: "long", month: "long", day: "numeric", year: "numeric" }) : "No due date")}${t.hard && t.due ? " · HARD DATE" : ""}${t.rush ? " · Rush, " + esc(rushOf(t)[1]) : ""}</span>`;
    const quick = [["Tomorrow", 1], ["In 3 days", 3], ["In 1 week", 7], ["In 2 weeks", 14], ["In 3 weeks", 21]];
    return `<span class="label" style="color:var(--ink)">Due date</span>
      <div class="row"><input type="date" id="tag-due" value="${esc(t.due || "")}" data-in="tagdue" aria-label="Due date">
        <button class="hardbox" data-act="hard-date" aria-pressed="${!!(t.hard && t.due)}"><i></i><span>Hard date</span></button>
        ${quick.map(([l, n]) => `<button class="chip" data-act="due-quick" data-n="${n}" aria-pressed="${t.due === dayPlus(n)}">${l}</button>`).join("")}
        <button class="chip" data-act="due-none" aria-pressed="${!!t.noDue && !t.due}">No due date</button></div>
      <span class="label" style="color:var(--ink);margin-top:4px">Rush</span>
      <div class="row"><button class="chip" data-act="rush" data-n="0" aria-pressed="${!t.rush}">No rush</button>
        ${RUSH.map(([n, l, fee]) => `<button class="chip" data-act="rush" data-n="${n}" aria-pressed="${t.rush === n}">${l} +$${fee}</button>`).join("")}</div>
      <span class="small muted">Rush fees don't apply to pant hems. Today doesn't count as a working day.</span>`;
  }

  function payHtml(d) {
    const total = cartTotals().total;
    const st = paymentState(total, d.payments);
    const amt = toCents(d.amount);
    let entry = "";
    if (st.due > 0) {
      if (d.method === "Card" && d.reader) entry = readerWaitHtml(d);
      else if (d.method === "Card" && readerOn(d)) entry = `<div class="terminal"><span class="label">Card reader${card.state.test ? ` <span class="pill plain">Test mode · no money moves</span>` : ""}</span>
          <div class="row"><input type="text" id="pay-amt" inputmode="decimal" style="max-width:170px;font-size:22px" class="money" value="${esc(d.amount)}" data-in="dlg" data-k="amount"><span class="small muted">Change it to split the payment.</span></div>
          <div class="row"><button class="btn primary" data-act="reader-send" id="reader-send" style="min-height:60px;font-size:15px">Send ${m(Math.min(amt, st.due) || st.due)} to the card reader</button></div>
          <span class="small muted">Reader not working? <button class="btn small ghost" data-act="reader-manual">Key it in on the reader instead</button></span></div>`;
      else if (d.method === "Card") entry = `<div class="terminal"><span class="label">On the card terminal</span><span>Key in this amount and have the customer tap or insert their card.</span>
          <div class="row"><input type="text" id="pay-amt" inputmode="decimal" style="max-width:170px;font-size:22px" class="money" value="${esc(d.amount)}" data-in="dlg" data-k="amount"><span class="small muted">Change it to split the payment.</span></div>
          <label class="f"><span>Approval code (optional)</span><input type="text" id="pay-ref" style="max-width:240px" value="${esc(d.ref)}" data-in="dlg" data-k="ref" autocomplete="off"></label>
          <div class="row"><button class="btn gold" data-act="pay-add">Approved on the terminal</button><button class="btn ghost" data-act="pay-declined">Declined</button></div>
          ${card && card.state.ready && d.manual ? `<span class="small muted"><button class="btn small ghost" data-act="reader-auto">Send it to the card reader instead</button></span>` : ""}</div>`;
      else if (d.method === "Cash") {
        const quick = [...new Set([st.due, Math.ceil(st.due / 500) * 500, Math.ceil(st.due / 1000) * 1000, Math.ceil(st.due / 2000) * 2000, Math.ceil(st.due / 5000) * 5000, Math.ceil(st.due / 10000) * 10000])].filter((v) => v >= st.due).slice(0, 5);
        entry = `<div class="terminal"><span class="label">Cash received</span>
          <div class="chips">${quick.map((v) => `<button class="chip" data-act="cash-quick" data-v="${v}">${v === st.due ? "Exact " : ""}${m(v)}</button>`).join("")}</div>
          <div class="row"><input type="text" id="pay-amt" inputmode="decimal" style="max-width:170px;font-size:22px" class="money" value="${esc(d.amount)}" data-in="dlg" data-k="amount" placeholder="Other amount">
            <span class="pill good" id="chg" ${amt > st.due ? "" : "hidden"}>Change ${m(Math.max(0, amt - st.due))}</span></div>
          <div class="row"><button class="btn gold" data-act="pay-add" id="pay-go" ${amt > 0 ? "" : "disabled"}>Take cash</button></div></div>`;
      } else entry = `<div class="terminal"><span class="label">${d.method === "Check" ? "Check" : "Other payment"}</span>
          <div class="row"><input type="text" id="pay-amt" inputmode="decimal" style="max-width:170px;font-size:22px" class="money" value="${esc(d.amount)}" data-in="dlg" data-k="amount">
            <input type="text" id="pay-ref" style="max-width:260px" value="${esc(d.ref)}" data-in="dlg" data-k="ref" placeholder="${d.method === "Check" ? "Check number" : "What was it? e.g. gift certificate"}" autocomplete="off"></div>
          <div class="row"><button class="btn gold" data-act="pay-add" id="pay-go" ${amt > 0 ? "" : "disabled"}>Record payment</button></div></div>`;
    }
    return `<div class="due"><span>${st.due > 0 ? (d.payments.length ? "Still to pay" : "Amount due") : "Paid in full"}</span><span class="money">${m(st.due)}</span></div>
      ${d.payments.length ? `<div class="pays">${d.payments.map((p, i) => `<div class="pay"><span>${esc(p.method)}${p.ref ? ` (${esc(p.ref)})` : ""} ${p.reader ? `<button class="btn small ghost" data-act="pay-void-reader" data-i="${i}" ${d.reader ? "disabled" : ""}>Void card charge</button>` : `<button class="btn small ghost" data-act="pay-remove" data-i="${i}" ${d.reader ? "disabled" : ""}>Undo</button>`}</span><span>${m(p.amount)}</span></div>`).join("")}
        ${d.change ? `<div class="pay"><b>Change due</b><b>${m(d.change)}</b></div>` : ""}</div>` : ""}
      ${readerNoteHtml(d)}
      ${st.due > 0 ? `<div class="choice">${["Card", "Cash", "Check", "Other"].map((x) => `<button data-act="pay-method" data-m="${x}" aria-pressed="${d.method === x}" ${d.reader ? "disabled" : ""}>${x}</button>`).join("")}</div>${entry}` : ""}
      <div class="foot"><button class="btn" data-act="close" ${d.reader ? "disabled" : ""}>Back to sale</button><button class="btn primary" data-act="pay-finish" ${st.due > 0 || d.reader ? "disabled" : ""}>Finish sale</button></div>`;
  }

  // ---------- the card reader ----------
  const readerOn = (d) => !!(card && card.state.ready && link.key && !d.manual);
  const readerNoteHtml = (d) => d.readerNote ? `<div class="readernote ${d.readerNote.bad ? "bad" : "good"}" role="status">${esc(d.readerNote.text)}</div>` : "";
  function readerWaitHtml(d) {
    const r = d.reader;
    return `<div class="terminal readerwait" id="readerwait"><span class="label">On the card reader${card.state.test ? ` <span class="pill plain">Test mode</span>` : ""}</span>
      <span class="money" style="font-size:40px">${m(r.amount)}</span>
      <span style="font-size:18px">${r.sending ? "Sending to the reader…" : r.canceling ? "Canceling…" : "Have the customer tap, insert or swipe their card on the reader."}</span>
      <span class="readerdots" aria-hidden="true"><i></i><i></i><i></i></span>
      ${r.warn ? `<span class="small" style="color:var(--red)">${esc(r.warn)} Still trying…</span>` : ""}
      ${r.stale ? `<div class="readernote bad">Still no answer after ${Math.round((Date.now() - r.at) / 60000)} minutes. Look at the reader screen. If it says approved, tap Check again. If nothing is happening, tap Stop waiting.</div>
        <div class="row"><button class="btn" data-act="reader-check">Check again</button><button class="btn ghost" data-act="reader-stop">Stop waiting</button></div>`
        : `<div class="row"><button class="btn" data-act="reader-cancel" ${r.sending || r.canceling ? "disabled" : ""}>Cancel</button></div>`}
    </div>`;
  }
  const pendingSave = (r) => { try { localStorage.setItem(CARD_PENDING, JSON.stringify({ id: r.id, amount: r.amount, at: r.at })); } catch {} };
  const pendingClear = () => { try { localStorage.removeItem(CARD_PENDING); } catch {} };
  let readerWatch = null, readerStaleTimer = null;
  function readerStopWatching() { if (readerWatch) readerWatch.stop(); readerWatch = null; clearTimeout(readerStaleTimer); }
  function readerWatchStart(d) {
    readerStopWatching();
    const id = d.reader.id;
    readerWatch = card.watch(id, (p) => readerUpdate(id, p));
    readerStaleTimer = setTimeout(() => { const x = UI.dialog; if (x && x.reader && x.reader.id === id) { x.reader.stale = true; renderDialog(); } }, 3 * 60 * 1000);
  }
  function readerUpdate(id, p) {
    const d = UI.dialog;
    if (!d || d.type !== "pay" || !d.reader || d.reader.id !== id) return;
    if (p.error) { if (d.reader.warn !== p.error) { d.reader.warn = p.error; renderDialog(); } return; }
    if (d.reader.warn) { d.reader.warn = ""; renderDialog(); }
    if (p.status === "pending") return;
    readerStopWatching(); pendingClear();
    const r = d.reader; d.reader = null;
    if (p.status === "succeeded") {
      const st = paymentState(cartTotals().total, d.payments);
      const amount = Math.min(Number.isFinite(p.amount) && p.amount > 0 ? p.amount : r.amount, st.due);
      const desc = window.CardPay.describe(p);
      d.payments.push({ method: "Card", amount, ...(desc ? { ref: desc.slice(0, 40) } : {}), reader: { id: p.id, last4: p.last4 || "", auth: p.auth || "", brand: p.brand || "", ...(card.state.test ? { test: true } : {}) } });
      d.readerNote = { text: `Approved ${m(amount)}${desc ? " · " + desc : ""}.` };
      d.amount = (paymentState(cartTotals().total, d.payments).due / 100).toFixed(2);
    } else if (p.status === "failed") d.readerNote = { bad: true, text: `Declined${p.message && !/declin/i.test(p.message) ? " (" + p.message + ")" : ""}. Try the card again or choose another way to pay.` };
    else if (p.status === "canceled") d.readerNote = { bad: true, text: p.canceledBy === "terminal" ? "Canceled on the reader. Nothing was charged." : "Canceled. Nothing was charged." };

  // A sale that was waiting on the reader when the app closed: find out how it ended.
  async function checkCardLeftover() {
    let left = null; try { left = JSON.parse(localStorage.getItem(CARD_PENDING) || "null"); } catch {}
    if (!left || !card || !card.state.ready) return;
    let p; try { p = await card.get(left.id); } catch { return; }
    if (p.status === "pending") { try { p = await card.cancel(left.id); } catch {} }
    pendingClear();
    if (p.status !== "succeeded") return;
    UI.dialog = { type: "confirm", title: `${m(p.amount || left.amount)} was approved on the card reader`,
      text: `The app closed before that sale was finished, so it isn't on a receipt here (${esc(window.CardPay.describe(p) || "card")}). Void the charge to give the money back to the card, or keep it if you've already rung the sale up another way.`,
      yes: "Void the charge", run: async () => { try { await card.void(p.id); toast("The card charge was voided."); } catch (e) { toast(e.message + " Void it on the reader instead.", true); } } };
    renderDialog();
  }

    "reader-send": async () => {
      const d = UI.dialog; if (!d || d.reader) return;

      if (amt <= 0) return toast("Enter an amount.", true);

      const tagNos = cartTagNos();
      d.readerNote = null;

        const p = await card.start(amt, d.reader.ref, tagNos.length ? "Tag " + tagNos.map((n) => "#" + n).join(", ") : "Bespoke Tailoring sale");
        if (UI.dialog !== d || !d.reader) return;
        Object.assign(d.reader, { id: p.id, sending: false }); pendingSave(d.reader); renderDialog();
        if (p.status !== "pending") return readerUpdate(p.id, p);
        readerWatchStart(d);
      } catch (e) {
        d.reader = null;
        if (e.status === 503 || e.status === 404) d.manual = true;   // not switched on yet: key it in on the reader

      catch (e) {

        try { const p = await card.get(d.reader.id); if (p.status !== "pending") return readerUpdate(d.reader.id, p); } catch {}

    "pay-add": () => {

      UI.dialog = { type: "confirm", title: `Void receipt ${recNo(rec)}?`, text: `The sale stops counting toward today's totals.${readerSum ? ` The ${m(readerSum)} paid on the card reader goes back to the customer's card.` : ""}${cardSum ? ` <b>Also void or refund the ${m(cardSum)} card charge on the terminal.</b>` : ""}`, yes: "Void sale",

  };
  // ----- customers & tags -----
  async function saveCustomer(thenTag) {
    const d = UI.dialog;
    const name = String(d.name || "").trim().slice(0, 120), phone = String(d.phone || "").trim().slice(0, 40);
    const rawEmail = String(d.email || "").trim(), email = cleanEmail(rawEmail);
    if (rawEmail && !email) return toast("That email address doesn't look right.", true);
    if (phone && (phoneDigits(phone).length < 7 || phoneDigits(phone).length > 15)) return toast("That phone number doesn't look right.", true);
    if (!email && !phone) return toast("Give a phone number, an email, or both.", true);
    // The same person shouldn't be on the list twice.
    const other = customers.find((c) => c.id !== d.id && ((email && c.email === email) || (phone && phoneDigits(c.phone) === phoneDigits(phone))));
    if (other) {
      if (d.id) return toast(`That ${email && other.email === email ? "email" : "phone number"} already belongs to ${custName(other)}.`, true);
      UI.dialog = null; UI.custSel = other.id; UI.view = "customers"; render();
      toast(`${custName(other)} is already on the list.`);
      if (thenTag) openNewTag(other);
      return;
    }
    let c = d.id && customers.find((x) => x.id === d.id);
    if (!c) { c = { id: uid(), created: new Date().toISOString(), source: "tablet" }; customers.push(c); }
    Object.assign(c, { name, phone, email });
    UI.dialog = null; UI.custSel = c.id; UI.custQ = ""; UI.view = "customers";
    if (sync) sync.touched(c);
    await saveDoc("customers", c);
    render();
    if (thenTag) openNewTag(c); else toast(d.id ? "Saved." : `${custName(c)} added.`);
  }
  function refreshDue() { const b = document.getElementById("tdue"); if (b) { b.innerHTML = dueHtml(UI.dialog); b.classList.remove("missing"); } }
  function openNewTag(c) {
    UI.dialog = { type: "tag", isNew: true, tag: { id: uid(), no: null, customerId: c.id, status: "open", opened: new Date().toISOString(), due: null, noDue: false, items: {}, others: [], notes: "" } };
    renderDialog();
  }
  async function storeTag() {
    const t = UI.dialog.tag;
    t.others = (t.others || []).filter((o) => String(o.label || "").trim() || String(o.measure || "").trim() || o.price > 0);
    if (t.others.some((o) => !String(o.label || "").trim())) { toast("Name each extra alteration, or remove the line.", true); return null; }
    for (const [k, r] of Object.entries(t.items)) if (!r.on && !String(r.measure || "").trim() && (r.qty || 1) === 1) delete t.items[k];
    if (!tagLines(t).length && !String(t.notes || "").trim()) { toast("Tick at least one alteration or write a note first.", true); return null; }
    // Tags saved before due dates existed count as "No due date".
    if (t.due === undefined && t.no) t.noDue = true;
    if (!t.due && !t.noDue) {
      const b = document.getElementById("tdue"); if (b) { b.classList.add("missing"); b.scrollIntoView({ block: "center", behavior: "smooth" }); }
      toast("Pick a due date, or tap No due date.", true); return null;
    }
    if (!t.no) { t.no = settings.nextTag++; await saveSettings(); }
    const i = tags.findIndex((x) => x.id === t.id);
    if (i >= 0) tags[i] = t; else tags.push(t);
    await saveDoc("tags", t);
    return t;
  }
  function closeTag(t) {
    const lines = tagLines(t);
    if (!lines.length) { toast("Tick at least one alteration on the tag before closing it.", true); UI.dialog = { type: "tag", tag: JSON.parse(JSON.stringify(t)) }; renderDialog(); return; }
    if (UI.cart.length && !(UI.cartCustomer && UI.cartCustomer.id === t.customerId)) { UI.view = "register"; render(); return toast("Finish or clear the sale that's on the register first.", true); }
    if (UI.cart.some((l) => l.tagId === t.id)) { UI.view = "register"; render(); return; }
    const c = customers.find((x) => x.id === t.customerId);
    for (const l of lines) UI.cart.push({ key: uid(), name: l.name, measure: l.measure, qty: l.qty, price: t.paid ? 0 : linePrice(l), paid: !!t.paid, disc: null, tagId: t.id, tagNo: t.no, tagKey: l.key.startsWith("other:") ? "" : l.key, range: TAG_ROW[l.key] && Array.isArray(TAG_ROW[l.key].price) ? priceText(l.key) : "", note: TAG_ROW[l.key] && TAG_ROW[l.key].note ? TAG_ROW[l.key].note : "" });
    const rush = rushOf(t);
    if (rush) UI.cart.push({ key: uid(), name: `Rush: ${rush[1]}`, measure: "", qty: 1, price: t.paid ? 0 : rush[2] * 100, paid: !!t.paid, disc: null, tagId: t.id, tagNo: t.no, tagKey: "", rush: true });
    UI.cartCustomer = c ? { id: c.id, name: c.name, phone: c.phone, email: c.email } : null;
    t.status = "register"; saveDoc("tags", t);
    UI.view = "register"; render();
    toast(unpriced() ? `Tag ${tagNo(t)} is on the register. Set a price on each line, then take payment.` : `Tag ${tagNo(t)} is on the register.`);
  }
  // A tag whose lines are no longer on the sale goes back to Open.
  function releaseTags() {
    const still = new Set(cartTagIds());
    for (const t of tags) if (t.status === "register" && !still.has(t.id)) { t.status = "open"; saveDoc("tags", t); }
    if (!UI.cart.length) UI.cartCustomer = null;
  }

  // Press and drag a line's handle in Settings to move it within its section; the order is saved on release.
  let drag = null;
  document.addEventListener("pointerdown", (ev) => {
    const h = ev.target.closest && ev.target.closest(".pricerow .drag"); if (!h) return;
    const row = h.closest(".pricerow"), list = row.parentElement;
    ev.preventDefault();
    try { h.setPointerCapture(ev.pointerId); } catch {}
    drag = { row, list, handle: h, id: ev.pointerId, before: [...list.children].map((r) => r.dataset.k).join() };
    row.classList.add("dragging"); document.body.classList.add("is-dragging");
  });
  document.addEventListener("pointermove", (ev) => {
    if (!drag || ev.pointerId !== drag.id) return;
    ev.preventDefault();
    const others = [...drag.list.children].filter((r) => r !== drag.row);
    // Count the lines that come before the finger in reading order (left to right, top to bottom).
    let n = 0;
    for (const r of others) {
      const b = r.getBoundingClientRect(), cy = b.top + b.height / 2, cx = b.left + b.width / 2;
      if (cy < ev.clientY - b.height / 2 || (Math.abs(cy - ev.clientY) <= b.height / 2 && cx < ev.clientX)) n++;
    }
    const ref = others[n] || null;
    if (drag.row.nextElementSibling !== ref || (!ref && drag.list.lastElementChild !== drag.row)) drag.list.insertBefore(drag.row, ref);
    // Scroll the page when the finger nears the top or bottom.
    const page = drag.list.closest(".page");
    if (page) { const pb = page.getBoundingClientRect(); if (ev.clientY < pb.top + 70) page.scrollTop -= 14; else if (ev.clientY > pb.bottom - 70) page.scrollTop += 14; }
  });
  async function endDrag(ev) {
    if (!drag || (ev && ev.pointerId !== drag.id)) return;
    const d = drag; drag = null;
    d.row.classList.remove("dragging"); document.body.classList.remove("is-dragging");
    const keys = [...d.list.children].map((r) => r.dataset.k);
    if (keys.join() === d.before) return;
    settings.tagOrder = { ...(settings.tagOrder || {}), [d.list.dataset.s]: keys };
    await saveSettings();
    const o = document.getElementById("order-row"); if (o) o.hidden = false;
    toast(`${TAG_ROW[d.row.dataset.k] ? itemName(d.row.dataset.k) : "That line"} moved. The tag shows the new order.`);
  }
  document.addEventListener("pointerup", endDrag);
  document.addEventListener("pointercancel", endDrag);

  function clearBtn(input) { const b = input.parentElement && input.parentElement.querySelector(".clear"); if (b) b.hidden = !input.value; }

  function fallbackCopy(text) {
    const t = document.createElement("textarea"); t.value = text; t.setAttribute("readonly", ""); t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select(); let ok = false; try { ok = document.execCommand("copy"); } catch {} t.remove(); return ok;
  }

  async function finishSale() {
    const d = UI.dialog; const t = cartTotals();
    if (d.reader || paymentState(t.total, d.payments).due > 0) return;
    const sale = {
      id: uid(), no: settings.nextReceipt++, date: new Date().toISOString(), device: "tablet",
      lines: UI.cart.map((l, i) => ({ name: l.name, qty: l.qty, price: l.price, disc: l.disc, fixed: !!l.fixed, net: t.perLine[i], ...(l.measure ? { measure: l.measure } : {}), ...(l.tagId ? { tagId: l.tagId } : {}) })),
      customer: UI.cartCustomer || null, tagNos: cartTagNos(),
      cartDisc: UI.cartDisc, subtotal: t.subtotal, discount: t.discount, total: t.total,
      payments: d.payments.map((p) => ({ method: p.method, amount: p.amount, ...(p.ref ? { ref: p.ref } : {}), ...(p.tendered ? { tendered: p.tendered } : {}), ...(p.reader ? { reader: p.reader } : {}) })),
      change: d.change || 0, voided: false,
    };
    sales.unshift(sale);
    // Tags on this sale are now paid: closed, and kept on the customer with the receipt.
    const paidTags = [];
    for (const id of cartTagIds()) {
      const tg = tags.find((x) => x.id === id); if (!tg) continue;
      Object.assign(tg, { status: "closed", closedAt: sale.date, saleId: sale.id, receiptNo: sale.no, total: sale.lines.reduce((a, l, i) => a + (UI.cart[i].tagId === id ? l.net : 0), 0) });
      paidTags.push(tg);
    }
    UI.cart = []; UI.cartDisc = null; UI.cartCustomer = null;
    for (const tg of paidTags) saveDoc("tags", tg);
    UI.dialog = { type: "receipt", id: sale.id, fresh: true };
    render();
    if (sync && sale.customer) sync.sale(custOf(sale.customer), recNo(sale), sale.total, today(), sale.tagNos && sale.tagNos.length ? "Tag " + sale.tagNos.map((n) => "#" + n).join(", ") : "");
    await saveSale(sale);
    await saveSettings();
  }

  // ---------- events ----------
  document.addEventListener("click", (ev) => {
    const el = ev.target.closest("[data-act]");
    if (!el || el.disabled) return;
    const fn = A[el.dataset.act];
    if (fn) fn(el, ev);
    keepAwake();
  });
  document.addEventListener("input", (ev) => {
    const el = ev.target; const kind = el.dataset.in;
    if (kind === "custq") { UI.custQ = el.value; const w = document.getElementById("who-list"); if (w) w.innerHTML = whoListHtml(); clearBtn(el); return; }
    if (kind === "tagq") { UI.tagQ = el.value; const w = document.getElementById("board"); if (w) w.innerHTML = boardHtml(); clearBtn(el); return; }
    if (!kind || !UI.dialog) return;
    if (kind === "tagp") {
      const k = el.dataset.k; const r = UI.dialog.tag.items[k] = UI.dialog.tag.items[k] || { on: false, qty: 1 };
      r.price = Math.max(0, toCents(el.value));
      const rowEl = document.getElementById("tr-" + k);
      if (r.price && !r.on) { r.on = true; if (rowEl) { rowEl.classList.add("on"); const tk = rowEl.querySelector(".tick"); if (tk) tk.setAttribute("aria-pressed", "true"); } }
      const box = el.closest(".tpricebox"); if (box) box.classList.toggle("own", !!r.price);
      refreshTotal();
      return;
    }
    if (kind === "tagm") {
      const k = el.dataset.k; const r = UI.dialog.tag.items[k] = UI.dialog.tag.items[k] || { on: false, measure: "", qty: 1 };
      r.measure = el.value;
      if (el.value.trim() && !r.on) { r.on = true; const rowEl = document.getElementById("tr-" + k); if (rowEl) rowEl.classList.add("on"); refreshTotal(); }
      return;
    }
    if (kind === "tago") {
      const o = UI.dialog.tag.others[Number(el.dataset.i)];
      if (el.dataset.k === "price") o.price = Math.max(0, toCents(el.value)); else o[el.dataset.k] = el.value;
      if (el.dataset.k !== "measure") refreshTotal();
      return;
    }
    if (kind === "tagn") { UI.dialog.tag.notes = el.value; return; }
    if (kind === "tagdue") {
      const t = UI.dialog.tag; t.due = /^\d{4}-\d{2}-\d{2}$/.test(el.value) ? el.value : null; if (t.due) t.noDue = false;
      const b = document.getElementById("tdue");
      if (b) { b.classList.remove("missing"); b.querySelectorAll('[data-act^="due-"]').forEach((c) => c.setAttribute("aria-pressed", c.dataset.act === "due-quick" ? String(t.due === dayPlus(Number(c.dataset.n))) : String(!t.due && !!t.noDue))); }
      return;
    }
    const val = el.type === "checkbox" ? el.checked : el.value;
    if (kind === "svc") { UI.dialog.rows[Number(el.dataset.i)][el.dataset.k] = val; return; }
    UI.dialog[el.dataset.k] = val;
    if (UI.dialog.type === "pay" && el.id === "pay-amt") {
      const due = paymentState(cartTotals().total, UI.dialog.payments).due; const amt = toCents(val);
      const go = document.getElementById("pay-go"); if (go) go.disabled = !(amt > 0);
      const chg = document.getElementById("chg"); if (chg) { chg.hidden = !(amt > due); chg.textContent = "Change " + m(Math.max(0, amt - due)); }
    }
  });
  document.addEventListener("change", (ev) => { if (ev.target.dataset && ev.target.dataset.in === "price") savePrice(ev.target); });
  document.addEventListener("change", (ev) => { if (ev.target.dataset.in === "svc" && ev.target.type === "checkbox") UI.dialog.rows[Number(ev.target.dataset.i)].fixed = ev.target.checked; });
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape" && UI.dialog && UI.dialog.type !== "tag") return A.close();
    if (ev.key === "Enter" && ev.target.dataset && ev.target.dataset.in === "price") { ev.preventDefault(); ev.target.blur(); return; }
    if (ev.key !== "Enter" || !UI.dialog || ev.target.tagName !== "INPUT" || ev.target.type === "checkbox") return;
    const go = { custom: "custom-add", disc: "disc-apply", pay: "pay-add", "edit-svc": "svc-save", cust: "cust-save" }[UI.dialog.type];
    if (go) { ev.preventDefault(); A[go](); }
  });

  // Keep the tablet screen on while the register is open.
  let lock = null;
  async function keepAwake() {
    if (lock || !navigator.wakeLock) return;
    try { lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => { lock = null; }); } catch {}
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });

  let toastTimer;
  function toast(msg, bad) {
    let t = document.querySelector(".toast");
    if (!t) { t = document.createElement("div"); document.body.appendChild(t); }
    t.className = "toast" + (bad ? " bad" : ""); t.setAttribute("role", "status"); t.textContent = msg;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), bad ? 6000 : 3200);
  }
  function tick() { const c = document.getElementById("clock"); if (c) c.textContent = new Date().toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); }

  tick(); setInterval(tick, 20000);
  render();
  connect();
  startSync();
  setupFullscreen();
  checkUpdate(); setInterval(checkUpdate, 4 * 60 * 60 * 1000);
})();
</script>

</body></html>
