<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Bespoke Register Tablet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="fonts/fonts.css">
<style>/* Layout: the Bespoke Register's red header band (logo left, cream tabs) over a cream counter,
   sized for a 10.5" Android tablet: service tags on the left, the current sale on the right.
   Same palette, square red frames with a gold inner line, Courier Prime capitals, Gloock headings.
   Single light look on purpose, matching the desktop register and the website. */
:root {
  --bg: #f7eeda;
  --card: #fbf5e6;
  --ink: #3a1d1d;
  --brown: #7a4a20;
  --rule: #cfb98a;
  --red: #b92f37;
  --red-dark: #8a1f26;
  --gold: #e3a53f;
  --gold-dark: #d8962c;
  --gold-soft: #fff3d6;
  --good: #2f7d4f;
  --good-soft: #e1efe3;
  --slip: #fffdf7;
  --slip-ink: #2a1a12;
  --shade: rgba(58, 29, 29, 0.18);
  --scrim: rgba(58, 29, 29, 0.6);
  --f-display: "Gloock", "Georgia", "Times New Roman", serif;
  --f-body: "Lora", "Georgia", "Times New Roman", serif;
  --f-mono: "Courier Prime", "Courier New", ui-monospace, monospace;
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 var(--f-body); overflow: hidden;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button, input, select, textarea { font: inherit; color: inherit; }
button { -webkit-user-select: none; user-select: none; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; margin: 0; text-wrap: balance; color: var(--red); }
h2 { font-size: 30px; line-height: 1.15; }
.money, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

#app { display: grid; grid-template-rows: auto auto 1fr; height: 100%; }

/* Header band */
.bar { display: flex; align-items: center; gap: 24px; background: var(--red); color: var(--bg);
  padding-block: 10px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 14px; }
.brand img { height: 62px; width: auto; display: block; }
.brand span { font-family: var(--f-mono); font-weight: 700; font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); border-left: 1px solid rgba(247, 238, 218, 0.4); padding-left: 14px; }
.tabs { display: flex; }
.tabs button { background: transparent; color: var(--bg); border: 2px solid var(--bg); padding: 12px 26px; min-height: 52px; cursor: pointer; font-family: var(--f-mono); font-weight: 700; font-size: 14px; letter-spacing: 0.18em; text-transform: uppercase; }
.tabs button + button { border-left: 0; }
.tabs button:active { background: rgba(247, 238, 218, 0.15); }
.tabs button[aria-current="page"] { background: var(--bg); color: var(--red); }
.bar .tabs { margin-right: auto; }
.bar .clock { font-family: var(--f-mono); font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--bg); white-space: nowrap; }
.notice { background: var(--gold); color: var(--ink); font-family: var(--f-mono); font-size: 14px; padding-block: 7px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
.notice:empty { display: none; }
main { min-height: 0; overflow: hidden; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 2px solid var(--red); background: transparent; color: var(--red); padding: 8px 18px; cursor: pointer; min-height: 48px; white-space: nowrap;
  font-family: var(--f-mono); font-weight: 700; font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; }
.btn:active { background: var(--gold-soft); }
.btn.primary { background: var(--red); color: var(--bg); }
.btn.primary:active { background: var(--red-dark); border-color: var(--red-dark); }
.btn.gold { background: var(--gold); border-color: var(--gold); color: var(--ink); }
.btn.gold:active { background: var(--gold-dark); border-color: var(--gold-dark); }
.btn.ghost { border-color: transparent; color: var(--brown); padding-inline: 10px; }
.btn.ghost:active { color: var(--red); background: transparent; }
.btn.big { min-height: 66px; font-size: 17px; letter-spacing: 0.16em; width: 100%; }
.btn.small { min-height: 40px; padding: 4px 12px; font-size: 12.5px; letter-spacing: 0.12em; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
input[type="text"] { background: var(--bg); border: 2px solid var(--red); padding: 8px 12px; min-height: 52px; width: 100%; color: var(--ink); border-radius: 0; font-size: 18px; }
input:focus { outline: 3px solid var(--gold); outline-offset: 2px; }
label.f { display: grid; gap: 6px; }
label.f > span, .label { font-family: var(--f-mono); font-weight: 700; font-size: 12.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--red); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.muted { color: var(--brown); }
.small { font-size: 15px; }
.empty { padding: 32px 16px; text-align: center; color: var(--brown); border: 2px dashed var(--rule); }
.seg { display: inline-flex; }
.seg button { border: 2px solid var(--red); background: transparent; color: var(--red); padding: 6px 18px; cursor: pointer; min-height: 48px; font-family: var(--f-mono); font-weight: 700; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; }
.seg button + button { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--red); color: var(--bg); }
.chips { display: flex; gap: 10px; flex-wrap: wrap; }
.chip { border: 2px solid var(--red); background: transparent; color: var(--red); padding: 8px 16px; min-height: 48px; cursor: pointer; font-family: var(--f-mono); font-weight: 700; font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; }
.chip:active { background: var(--gold-soft); }
.pill { display: inline-block; padding: 1px 8px; font-family: var(--f-mono); font-weight: 700; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.plain { background: var(--gold); color: var(--ink); }
.pill.bad { background: var(--red); color: var(--bg); }
.banner { background: var(--red); color: var(--gold); font-family: var(--f-display); font-size: 22px; letter-spacing: 0.06em; text-transform: uppercase; padding: 10px 18px; margin: 0; }

/* Register */
.counter { display: grid; grid-template-columns: minmax(0, 1fr) 430px; height: 100%; min-height: 0; }
.shelf { min-height: 0; overflow: auto; display: grid; gap: 18px; align-content: start; -webkit-overflow-scrolling: touch;
  padding-block: 22px 32px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: 20px; }
.shelf .head { display: flex; align-items: center; gap: 12px; }
.shelf .head .btn { margin-left: auto; }
.tags { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
/* Each service is a framed tag with a punched hole, as on the desktop register. */
.tag { position: relative; text-align: left; border: 2px solid var(--red); background: var(--card); padding: 7px; cursor: pointer; display: block; box-shadow: 0 4px 12px var(--shade); transition: transform 0.1s; min-width: 0; }
.tag > .in { border: 1px solid var(--gold); padding: 26px 14px 14px; display: grid; gap: 6px; height: 100%; position: relative; min-height: 132px; align-content: start; }
.tag .in::before { content: ""; position: absolute; top: 9px; left: 50%; width: 11px; height: 11px; margin-left: -5.5px; border-radius: 50%; background: var(--bg); box-shadow: inset 0 0 0 1.5px var(--red); }
.tag:active { transform: scale(0.97); }
.tag .cat { font-family: var(--f-mono); font-weight: 700; font-size: 11.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--red); }
.tag .nm { font-family: var(--f-display); font-size: 20px; line-height: 1.2; color: var(--ink); overflow-wrap: anywhere; }
.tag .price { font-family: var(--f-mono); font-size: 19px; font-weight: 700; color: var(--red); margin-top: auto; }
.tag.svc, .tag.svc > .in { border-style: dashed; }
.tag.fixed { border-color: var(--gold); }
.tag.fixed .nm { color: var(--red); }

.today { display: grid; gap: 10px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.stat { border: 2px solid var(--red); background: var(--card); padding: 10px 14px; display: grid; gap: 2px; min-width: 0; }
.stat .label { color: var(--brown); font-size: 11.5px; letter-spacing: 0.12em; }
.stat .v { font-family: var(--f-display); font-size: 28px; line-height: 1.15; color: var(--red); }
.list { border: 2px solid var(--red); background: var(--card); }
.list button { display: grid; grid-template-columns: 90px 1fr auto; gap: 12px; align-items: center; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--rule); background: none; padding: 12px 16px; min-height: 56px; cursor: pointer; }
.list button:first-child { border-top: 0; }
.list button:active { background: var(--gold-soft); }
.list .no { font-family: var(--f-mono); font-weight: 700; color: var(--red); }
.list .what { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list .amt { font-family: var(--f-mono); font-weight: 700; text-align: right; }
.list button.void .what, .list button.void .amt { text-decoration: line-through; color: var(--brown); }

/* Current sale */
.tape { min-width: 0; background: var(--card); border-left: 2px solid var(--red); display: flex; flex-direction: column; min-height: 0;
  padding-right: env(safe-area-inset-right, 0px); }
.tape .top { display: flex; align-items: center; background: var(--red); padding-right: 6px; flex: none; }
.tape .top .banner { flex: 1; }
.tape .top .btn.ghost { color: var(--bg); }
.lines { flex: 1 1 auto; overflow: auto; min-height: 0; -webkit-overflow-scrolling: touch; }
.line { padding: 12px 18px; border-bottom: 1px solid var(--rule); display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; }
.line .what { min-width: 0; }
.line .what b { font-family: var(--f-display); font-weight: 400; font-size: 19px; overflow-wrap: anywhere; }
.line .opts { font-size: 14px; color: var(--brown); }
.line .amt { text-align: right; font-family: var(--f-mono); font-weight: 700; font-size: 18px; }
.line .amt s { color: var(--brown); font-weight: 400; font-size: 14px; display: block; }
.line .ctl { grid-column: 1 / -1; display: flex; gap: 6px; align-items: center; }
.qty { display: inline-flex; align-items: center; border: 2px solid var(--red); }
.qty button { border: 0; background: none; width: 46px; height: 40px; cursor: pointer; font-size: 22px; color: var(--red); font-weight: 700; }
.qty button:active { background: var(--gold-soft); }
.qty span { min-width: 30px; text-align: center; font-family: var(--f-mono); font-weight: 700; font-size: 18px; }
.sums { border-top: 2px solid var(--red); padding: 14px 18px 18px; display: grid; gap: 6px; flex: none; }
.sum { display: flex; justify-content: space-between; font-family: var(--f-mono); }
.sum.total { font-family: var(--f-display); font-size: 30px; color: var(--red); padding-top: 6px; border-top: 1px solid var(--gold); margin-top: 4px; align-items: baseline; }
.sum.total span:last-child { font-family: var(--f-mono); font-weight: 700; font-size: 26px; }
.sums .btn.big { margin-top: 8px; }

/* Customers */
.page { height: 100%; overflow: auto; padding-block: 32px 48px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.page > .wrap { max-width: 900px; margin: 0 auto; display: grid; gap: 20px; }
.frame { border: 2px solid var(--red); padding: 7px; background: var(--card); box-shadow: 0 6px 18px var(--shade); }
.frame > .in { border: 1px solid var(--gold); padding: 48px 24px; display: grid; gap: 10px; justify-items: center; text-align: center; }
.frame .glyph { width: 72px; height: 72px; }

/* Dialogs */
.scrim { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; z-index: 50;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.dialog { background: var(--card); border: 2px solid var(--red); padding: 9px; box-shadow: 0 12px 40px rgba(58, 29, 29, 0.45); width: min(600px, 100%); max-height: 100%; overflow: auto; }
.dialog > .in { border: 1px solid var(--gold); padding: 22px; display: grid; gap: 16px; }
.dialog.wide { width: min(860px, 100%); }
.dialog .foot { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; padding-top: 4px; }
.dialog .foot .left { margin-right: auto; }
.choice { display: flex; flex-wrap: wrap; gap: 10px; }
.choice button { border: 2px solid var(--red); background: transparent; color: var(--ink); padding: 8px 20px; min-height: 52px; cursor: pointer; font-family: var(--f-mono); font-weight: 700; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; }
.choice button[aria-pressed="true"] { background: var(--red); color: var(--bg); }
.due { display: flex; align-items: baseline; justify-content: space-between; padding: 14px 18px; background: var(--red); color: var(--bg); margin: 0; }
.due > span:first-child { font-family: var(--f-mono); font-weight: 700; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); }
.due .money { font-size: 34px; font-weight: 700; }
.pays { display: grid; gap: 6px; }
.pay { display: flex; justify-content: space-between; align-items: center; font-family: var(--f-mono); }
.terminal { border: 2px solid var(--gold); padding: 14px 16px; display: grid; gap: 12px; background: var(--gold-soft); }
.readerwait { border-color: var(--red); background: var(--card); justify-items: center; text-align: center; padding: 22px 16px; }
.readerdots { display: flex; gap: 8px; }
.readerdots i { width: 10px; height: 10px; background: var(--red); animation: rdot 1.2s infinite ease-in-out; }
.readerdots i:nth-child(2) { animation-delay: .2s; } .readerdots i:nth-child(3) { animation-delay: .4s; }
@keyframes rdot { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
.readernote { padding: 10px 12px; font-size: 16px; border-left: 4px solid var(--good); background: var(--good-soft); color: var(--ink); text-align: left; }
.readernote.bad { border-left-color: var(--red); background: var(--gold-soft); }
.terminal .money { font-size: 26px; font-weight: 700; color: var(--red); }
.amtbox { font-family: var(--f-mono); font-weight: 700; font-size: 34px; color: var(--red); background: var(--bg); border: 2px solid var(--red); padding: 6px 14px; text-align: right; min-height: 60px; font-variant-numeric: tabular-nums; }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.keypad button { min-height: 62px; border: 2px solid var(--red); background: var(--bg); color: var(--ink); font-family: var(--f-mono); font-weight: 700; font-size: 26px; cursor: pointer; }
.keypad button:active { background: var(--gold); }
.keypad button.word { font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; }
.pad-wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.edit-row { display: grid; grid-template-columns: minmax(0, 1fr) 130px auto; gap: 8px; align-items: center; }
.edit-row input { min-height: 48px; font-size: 17px; }
.receipt-view { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 22px; align-items: start; }
.slip { background: var(--slip); color: var(--slip-ink); padding: 18px 16px 22px; box-shadow: 0 2px 10px var(--shade);
  -webkit-mask: radial-gradient(circle 5px at 50% 100%, transparent 98%, #000) 0 0 / 14px 100% repeat-x; mask: radial-gradient(circle 5px at 50% 100%, transparent 98%, #000) 0 0 / 14px 100% repeat-x; }
.rc { font-family: var(--f-mono); font-size: 13px; line-height: 1.4; color: var(--slip-ink); }
.rc-c { text-align: center; }
.rc-shop { font-family: var(--f-display); font-size: 19px; margin-bottom: 2px; }
.rc-r { display: flex; justify-content: space-between; gap: 10px; }
.rc-r span:last-child { white-space: nowrap; }
.rc-o { padding-left: 14px; color: var(--brown); font-size: 12px; }
.rc-b { font-weight: 700; }
.rc-big { font-size: 16px; }
.rc-hr { border-top: 1px dashed var(--brown); margin: 8px 0; }
.change-due { margin: 8px 0 0; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 12px 20px; z-index: 80; box-shadow: 0 8px 24px var(--shade); max-width: calc(100% - 32px); border-left: 4px solid var(--gold); font-size: 16px; }
.toast.bad { background: var(--red); border-left-color: var(--ink); }

/* Customers */
.people { display: grid; grid-template-columns: 360px minmax(0, 1fr); height: 100%; min-height: 0; }
.people .roster { border-right: 2px solid var(--red); background: var(--card); display: flex; flex-direction: column; min-height: 0; padding-left: env(safe-area-inset-left, 0px); }
.roster .find { padding: 14px 16px; display: grid; gap: 10px; border-bottom: 1px solid var(--gold); flex: none; }
.roster .who-list { overflow: auto; min-height: 0; flex: 1 1 auto; -webkit-overflow-scrolling: touch; }
.who-list button { display: grid; gap: 2px; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--rule); background: none; padding: 12px 16px; min-height: 64px; cursor: pointer; }
.who-list button:active, .who-list button[aria-current="true"] { background: var(--gold-soft); }
.who-list button[aria-current="true"] { box-shadow: inset 5px 0 0 var(--red); }
.who-list b { font-family: var(--f-display); font-weight: 400; font-size: 19px; overflow-wrap: anywhere; }
.who-list .sub { font-size: 14px; color: var(--brown); overflow-wrap: anywhere; }
.people .detail { overflow: auto; min-height: 0; -webkit-overflow-scrolling: touch; padding-block: 24px 40px; padding-left: 24px; padding-right: max(24px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; align-content: start; }
.detail .who-head { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
.detail .who-head > div { min-width: 0; flex: 1 1 260px; display: grid; gap: 4px; }
.detail .who-head h2 { overflow-wrap: anywhere; }
.tagcards { display: grid; gap: 12px; }
.tagcard { border: 2px solid var(--red); background: var(--card); padding: 6px; }
.tagcard > .in { border: 1px solid var(--gold); padding: 14px 16px; display: grid; gap: 8px; }
.tagcard .top { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.tagcard .top b { font-family: var(--f-display); font-weight: 400; font-size: 21px; color: var(--red); }
.tagcard .items { font-size: 15px; color: var(--ink); overflow-wrap: anywhere; }
.tagcard.closed { border-color: var(--rule); }
.tagcard.closed .top b { color: var(--brown); }
.pill.open { background: var(--gold); color: var(--ink); }
.pill.reg { background: var(--red); color: var(--bg); }
.pill.done { background: var(--good-soft); color: var(--good); }

/* The alteration tag: a manila tag with a reinforced hole, ruled like the paper ones */
.dialog.tagsheet { width: min(980px, 100%); background: #f3e6c4; border-color: #b49660; }
.dialog.tagsheet > .in { border-color: #c9ad74; position: relative; padding-top: 34px; }
.dialog.tagsheet > .in::before { content: ""; position: absolute; top: 10px; left: 50%; width: 22px; height: 22px; margin-left: -11px; border-radius: 50%; background: var(--card); box-shadow: 0 0 0 5px #b8763c, inset 0 1px 2px rgba(0,0,0,.35); }
.tsec { display: grid; gap: 0; }
.tsec h3 { font-family: var(--f-display); font-size: 22px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink); border-bottom: 2px solid var(--ink); padding-bottom: 2px; margin-bottom: 2px; }
.trows { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 22px; }
.trow { display: grid; grid-template-columns: minmax(0, 1fr) 96px auto; gap: 8px; align-items: center; border-bottom: 1px solid #a88d5c; padding: 6px 0; min-width: 0; }
.trow .tick { display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 0; min-height: 48px; text-align: left; cursor: pointer; color: var(--ink); font-size: 17px; min-width: 0; }
.trow .tick i { width: 26px; height: 26px; border: 2px solid var(--ink); flex: none; display: grid; place-items: center; background: var(--card); }
.trow.on .tick i { background: var(--red); border-color: var(--red); }
.trow.on .tick i::after { content: ""; width: 7px; height: 13px; border: solid var(--bg); border-width: 0 3px 3px 0; transform: rotate(45deg) translate(-1px, -2px); }
.trow.on .tick span { font-weight: 600; }
.trow input[type="text"] { min-height: 44px; font-size: 16px; padding: 6px 8px; background: var(--card); border-width: 0 0 2px; border-color: var(--ink); }
.trow .qty button { width: 36px; height: 36px; font-size: 19px; }
.trow .qty span { min-width: 34px; font-size: 15px; }
.trow.other { grid-template-columns: minmax(0, 1fr) 120px auto auto; }

<script>
(() => {
  // ---------- money (whole cents), same math as the desktop register ----------
  const toCents = (s) => { const n = Number(String(s ?? "").replace(/[^0-9.\-]/g, "")); return isFinite(n) ? Math.round(n * 100) : 0; };
  const m = (c) => (c < 0 ? "-$" : "$") + (Math.abs(c) / 100).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  const pct = (v) => Math.max(0, Math.min(100, Number(v) || 0));
  function discountOf(amount, d) {
    if (!d || !d.value) return 0;
    if (d.type === "%") return Math.round((amount * pct(d.value)) / 100);
    return Math.max(0, Math.min(amount, Math.round(d.value)));
  }
  function allocate(total, weights) {
    const sum = weights.reduce((a, b) => a + b, 0);
    if (!sum || !total) return weights.map(() => 0);
    const raw = weights.map((w) => (total * w) / sum);
    const out = raw.map(Math.floor);
    let left = total - out.reduce((a, b) => a + b, 0);
    const order = raw.map((r, i) => [r - Math.floor(r), i]).sort((a, b) => b[0] - a[0]);
    for (let k = 0; left > 0 && k < order.length; k++, left--) out[order[k][1]]++;
    return out;
  }
  function totals(lines, cartDisc) {
    const gross = lines.map((l) => l.price * l.qty);
    const lineDisc = lines.map((l, i) => discountOf(gross[i], l.disc));
    const afterLine = gross.map((g, i) => g - lineDisc[i]);
    const cartOff = discountOf(afterLine.reduce((a, b) => a + b, 0), cartDisc);
    const share = allocate(cartOff, afterLine);
    const net = afterLine.map((a, i) => a - share[i]);
    const sum = (a) => a.reduce((x, y) => x + y, 0);
    return { subtotal: sum(gross), discount: sum(lineDisc) + cartOff, total: sum(net), perLine: net };
  }
  function paymentState(total, payments) {
    const paid = payments.reduce((a, p) => a + p.amount, 0);
    const due = total - paid;
    return { paid, due: Math.max(0, due) };
  }

  // ---------- helpers ----------
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const dayOf = (iso) => { const d = new Date(iso); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
  const today = () => dayOf(new Date().toISOString());
  const timeOf = (iso) => new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const dateLong = (iso) => new Date(iso).toLocaleString([], { weekday: "short", month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" });
  const discLabel = (d) => (!d || !d.value ? "" : d.type === "%" ? `${d.value}% off` : `${m(d.value)} off`);
  const recNo = (s) => `T-${s.no}`;

  const SHOP = { name: "Bespoke Tailoring", address: "34 W 8th St, Erie, PA 16501", phone: "(814) 860-4797", footer: "Thank you for visiting Bespoke Tailoring." };
  const START_NO = 1001;
  const START_TAG = 101;

  // The alteration tag, laid out like the shop's paper tags. Each line can be ticked, given a
  // measurement, and multiplied when more than one piece needs the same work.
  // Prices come from the shop's price menu. A number is the price in dollars; [low, high] is a range
  // that's set at the register for each job; null means it isn't on the menu yet.
  // Coat, Vest and Trousers follow the paper tag and are always open; the others open when needed.
  const TAG = [
    { id: "coat", title: "Coat", prefix: "Coat", paper: true, rows: [
      ["shorten-sleeves", "Shorten Sleeves", 35], ["lengthen-sleeves", "Lengthen Sleeves", 35],
      ["raise-collar", "Raise Collar", 35], ["lower-collar", "Lower Collar", 35],
      ["pad-shoulders", "Pad Shoulders", 80], ["move-buttons", "Move Buttons", null],
      ["shorten-coat", "Shorten Coat", 80],
      ["take-in-sides", "Take in Sides", 30], ["let-out-sides", "Let out Sides", 30],
      ["taper-sleeves", "Taper Sleeves", 30], ["replace-lining", "Replace Lining", 90, "plus the cost of the lining"],
    ] },
    { id: "vest", title: "Vest", prefix: "Vest", paper: true, rows: [["vest-chest", "Chest", null], ["vest-waist", "Waist", null]] },
    { id: "trousers", title: "Trousers", prefix: "Trousers", paper: true, rows: [
      ["tr-waist", "Waist", 25], ["tr-thigh", "Thigh", null],
      ["tr-length", "Length", 15], ["tr-knee", "Knee", null],
      ["tr-bottom", "Bottom", null], ["tr-pin-hem", "Pin. Hem", null],
      ["tr-cuffs", "With Cuffs", 20], ["tr-no-cuffs", "Without Cuffs", 15],
      ["tr-rolled-hem", "Rolled Hem", 20], ["tr-crotch", "Crotch", 25],
      ["tr-taper", "Taper", 25],
    ] },
    { id: "jeans", title: "Jeans", prefix: "Jeans", rows: [
      ["jn-original-hem", "Original Hem", 25], ["jn-plain-hem", "Plain Hem", 20],
      ["jn-taper", "Taper", 40], ["jn-waist", "Waist", 40],
    ] },
    { id: "shirts", title: "Shirts", prefix: "Shirt", rows: [
      ["sh-sleeves", "Sleeves", 35], ["sh-dart", "Dart", 20],
      ["sh-sides", "Sides", 30], ["sh-hem", "Hem", 30],
    ] },
    { id: "dresses", title: "Dresses & Skirts", prefix: "Dress", rows: [
      ["dr-sides", "Sides", 40], ["dr-sleeves", "Sleeves", 35],
      ["dr-fix-beading", "Fix Beading", [40, 200], "depends on the damage"], ["dr-add-cups", "Add Cups", 35],
      ["dr-corset-back", "Make Corset Back", 80], ["dr-add-slit", "Add Slit", 40],
      ["dr-tack", "Tack Bust or Slit", [25, 40]],
      ["dr-shoulders", "Shoulders", 40], ["dr-spaghetti", "Spaghetti Strap Shoulders", 25],
      ["dr-rolled-hem", "Rolled Hem (per layer)", 40], ["dr-tulle-hem", "Cut Tulle Hem (per layer)", 30],
    ] },
    { id: "patches", title: "Patches", prefix: "Patch", rows: [
      ["pt-small", "Small Patch", 10], ["pt-big", "Big Patch", 12], ["pt-letterman", "Letterman", 25],
    ] },
  ];
  // Rush fees, added to the total (pant hems excepted). The current day doesn't count as a working day.
  const RUSH = [[4, "4 working days", 20], [3, "3 working days", 30], [2, "2 working days", 40], [1, "Tomorrow (1 working day)", 50]];
  const TAG_ROW = {};
  for (const sec of TAG) for (const [k, label, price, note] of sec.rows) TAG_ROW[k] = { section: sec.title, prefix: sec.prefix, label, price, note };
  // A section's lines in the order set in Settings (lines not placed yet keep the paper tag's order, at the end).
  function rowsOf(sec) {
    const order = (settings.tagOrder || {})[sec.id];
    if (!Array.isArray(order) || !order.length) return sec.rows;
    const at = new Map(order.map((k, i) => [k, i]));
    const pos = (r, i) => (at.has(r[0]) ? at.get(r[0]) : 1e6 + i);
    return sec.rows.map((r, i) => [r, pos(r, i)]).sort((a, b) => a[1] - b[1]).map(([r]) => r);
  }
  const itemName = (k) => (TAG_ROW[k] ? `${TAG_ROW[k].prefix}: ${TAG_ROW[k].label}` : k);
  const listPrice = (k) => { const r = TAG_ROW[k]; return r && typeof r.price === "number" ? r.price * 100 : 0; };
  const priceText = (k) => { const r = TAG_ROW[k]; if (!r || r.price == null) return ""; return Array.isArray(r.price) ? `$${r.price[0]}–${r.price[1]}` : `$${r.price}`; };
  // The price a line rings up at: one saved at the register wins, then the price menu.
  const priceFor = (k) => settings.tagPrices[k] || listPrice(k);
  // The price shown beside a line on the tag: the shop's own price if one is set, else the menu's.
  const shownPrice = (k) => (settings.tagPrices[k] ? "$" + (settings.tagPrices[k] / 100).toFixed(2).replace(/\.00$/, "") : priceText(k));
  // A tag line's price: an extra line carries its own; a printed line uses the price list.
  // A price typed on the tag itself wins for that tag; then the shop's price from Settings; then the menu.
  const linePrice = (l) => (l.key.startsWith("other:") ? l.price || 0 : l.price || priceFor(l.key));
  const tagNo = (t) => `#${t.no}`;
  const rushOf = (t) => RUSH.find(([n]) => n === t.rush) || null;
  // What the tag comes to at menu (or saved) prices. Lines without a set price are listed instead.
  function tagTotal(t) {
    let sum = 0; const unset = [];
    for (const l of tagLines(t)) {
      const p = linePrice(l);
      if (p) sum += p * l.qty;
      else unset.push(l.name + (priceText(l.key) ? ` (${priceText(l.key)})` : ""));
    }
    const rush = rushOf(t); if (rush) sum += rush[2] * 100;
    // A tag marked Paid comes to nothing more.
    if (t.paid) return { sum: 0, unset: [], full: sum };
    return { sum, unset, full: sum };
  }
  function tagTotalHtml(t) {
    const { sum, unset, full } = tagTotal(t);
    const ro = UI.dialog && UI.dialog.readOnly;
    return `<div class="ttotal-row"><span>Total${t.paid ? ` <span class="pill done">Paid</span>` : ""}</span>
        ${ro ? "" : `<button class="chip paidbtn" data-act="tag-paid" aria-pressed="${!!t.paid}">${t.paid ? "✓ Paid" : "Mark as paid"}</button>`}<span class="money">${m(sum)}</span></div>

  const cleanEmail = (v) => { const e = String(v ?? "").trim().toLowerCase(); return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e) ? e : ""; };

  }
  // Due dates are plain calendar days (YYYY-MM-DD). A tag either has one or says "No due date".
  const dayPlus = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return dayOf(d.toISOString()); };
  const dueText = (t) => {
    if (!t.due) return "No due date";

  };
  const isLate = (t) => t.status !== "closed" && t.due && t.due < today();

  // ---------- state ----------
  let settings = { services: [], nextReceipt: START_NO, nextTag: START_TAG, tagPrices: {}, tagOrder: {} };

  let customers = [];
  let tags = [];

  let store = null; // "db" when saving to the shared store, "local" when only this browser

  let db = null;

  let tagState = { cursor: null, dirty: [], deletes: [] };   // tags waiting to go to the website
  const writeLocal = () => { try { localStorage.setItem(LS, JSON.stringify({ settings, sales, customers, tags, syncState, tagState, link })); } catch {} };

  async function saveSettings() {
    writeLocal();

    try { await db.doc("settings/main").set({ services: settings.services, nextReceipt: settings.nextReceipt, nextTag: settings.nextTag, tagPrices: settings.tagPrices, tagOrder: settings.tagOrder }); }

  }
  async function saveSale(sale) {

    catch { toast(`Receipt ${recNo(sale)} is kept on this tablet but couldn't reach the shared record. Check the internet connection.`, true); }
  }

  // Customers and tags: one document each, kept on this tablet and in the shared record when signed in.
  async function saveDoc(col, obj) {
    obj.updated = new Date().toISOString();
    if (col === "tags" && tagSync) tagSync.touched(obj);
    writeLocal();
    if (store !== "db") return;
    try { await db.collection(col).doc(obj.id).set(obj); }
    catch { toast("Saved on this tablet, but it couldn't reach the shared record. Check the internet connection.", true); }
  }
  // Keep a list in step with the shared record, re-sending anything this tablet saved while offline.
  function follow(col, get, set, after) {
    db.collection(col).onSnapshot((snap) => {
      const remote = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      const byId = new Map(remote.map((x) => [x.id, x]));
      for (const mine of get()) {
        const r = byId.get(mine.id);
        if (!r || (mine.updated || "") > (r.updated || "")) { byId.set(mine.id, mine); db.collection(col).doc(mine.id).set(mine).catch(() => {}); }
      }
      set([...byId.values()]);
      writeLocal();
      after();
    }, () => {});
  }

  // ---------- the website's customer list (installed app) ----------
  // Customers added or edited here, and sales for a customer, go to the website; customers from the
  // website (Calendly bookings, the staff page, the shop computer) come back. Works offline and
  // catches up when the connection returns.
  let sync = null;
  let card = null;   // the card reader, through the website (shared/card-pay.js)
  const CARD_PENDING = "bespoke-card-pending";   // a reader sale that was still waiting, in case the app closes
  function startSync() {
    if (!window.CustomerSync || !IN_APP) return;
    if (window.CardPay) { card = window.CardPay.createCardPay({ base: link.base, key: link.key }); if (link.key) card.check().then(checkCardLeftover); }
    sync = window.CustomerSync.createSync({
      base: link.base, key: link.key,
      adapter: {
        customers: () => customers,
        addCustomer: (f) => { const c = { id: uid(), created: new Date().toISOString(), source: "website", ...f }; customers.push(c); return c; },
        removeCustomer: (c) => {
          // Removed on the website. Keep them here only if they have tags, so the tag history isn't lost.
          if (tags.some((t) => t.customerId === c.id)) { c.remoteId = null; c.unlinked = true; }
          else { customers = customers.filter((x) => x !== c); if (UI.custSel === c.id) UI.custSel = null; }
        },
        state: () => syncState,
        saveState: (st) => { syncState = st; writeLocal(); },
        changed: () => { writeLocal(); linkBadge(); if ((UI.view === "customers" || UI.view === "tags") && !UI.dialog) render(); else if (UI.dialog && UI.dialog.type === "link") renderDialog(); },
      },
    });

  }
  // Customers first, then tags (a new customer needs its website id before its tags can go up).
  const syncAll = () => (tagSync ? tagSync.syncNow() : sync.syncNow());

  // ---------- alteration tags on the website (installed app) ----------
  // Every tag saved, sent to the register, paid or deleted here goes to the website, so the shop
  // computer (and any other register) sees it. Tags changed elsewhere come back.
  let tagSync = null;
  function startTagSync() {
    if (!window.TagSync || !sync) return;
    tagSync = window.TagSync.createTagSync({
      base: link.base, key: link.key, before: () => sync.syncNow(),
      adapter: {
        tags: () => tags,
        toWire: (t) => {
          if (!t.no) return null;                                       // never saved
          const c = customers.find((x) => x.id === t.customerId);
          if (c && !c.remoteId && !c.unlinked) return null;             // its customer isn't on the website yet
          const { sum, unset } = tagTotal(t);
          const lines = tagLines(t).map((l) => ({ name: l.name, measure: l.measure, qty: l.qty, price: linePrice(l) }));
          const rush = rushOf(t); if (rush) lines.push({ name: `Rush: ${rush[1]}`, measure: "", qty: 1, price: rush[2] * 100 });
          return {
            id: t.id, no: t.no, customerId: (c && c.remoteId) || null,
            customer: c ? { name: c.name || "", phone: c.phone || "", email: c.email || "" } : {},
            status: t.status, opened: t.opened, due: t.due || null, noDue: !!t.noDue, rush: t.rush || null,

  function linkBadge() {

  // ---------- full screen ----------
  // In the installed app this hides Android's status and navigation bars (swipe from the edge to

  async function connect() {
    const local = readLocal();
    if (local) { settings = { ...settings, ...local.settings }; sales = local.sales || []; customers = local.customers || []; syncState = local.syncState || syncState; tagState = local.tagState || tagState; link = { ...link, ...(local.link || {}) }; tags = local.tags || []; }
    settings.tagPrices = settings.tagPrices || {}; settings.tagOrder = settings.tagOrder || {}; settings.nextTag = settings.nextTag || START_TAG;
    try { db = await window.claude?.use?.("db"); } catch { db = null; }

        settings.nextReceipt = Math.max(Number(d.nextReceipt) || START_NO, settings.nextReceipt || START_NO);

    } catch {}

    render();

      settings.nextTag = Math.max(Number(d.nextTag) || START_TAG, settings.nextTag);

    }, () => {});
    db.collection("sales").orderBy("date", "desc").limit(300).onSnapshot((snap) => {
      const remote = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      const ids = new Set(remote.map((x) => x.id));

  async function checkUpdate() {
