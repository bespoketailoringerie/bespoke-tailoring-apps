<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: data:">
<!-- Bespoke Post Studio for Windows. Built from the Post Studio artifact; edit this file directly. -->
<title>Bespoke Post Studio</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: the shop's red header band over a design-tool workspace. A tool rail and its panel
   on the left, the page being designed in the middle on a manila work surface, and the
   settings for whatever is selected on the right. Phones stack: page, tools, settings.
   One light look on purpose, matching the website, the register and the tablet. */
:root {
  --bg: #f7eeda;
  --card: #fbf5e6;
  --desk: #e9dcbc;
  --ink: #3a1d1d;
  --brown: #7a4a20;
  --rule: #cfb98a;
  --red: #b92f37;
  --red-dark: #8a1f26;
  --gold: #e3a53f;
  --gold-soft: #fff3d6;
  --good: #2f7d4f;
  --good-soft: #e1efe3;
  --guide: #d6177a;
  --shade: rgba(58, 29, 29, 0.18);
  --f-display: "Gloock", "Georgia", "Times New Roman", serif;
  --f-body: "Lora", "Georgia", "Times New Roman", serif;
  --f-mono: "Courier Prime", "Courier New", ui-monospace, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-body); overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
h2, h3 { font-family: var(--f-display); font-weight: 400; margin: 0; color: var(--red); text-wrap: balance; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
#app { display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); height: 100%; }
.work, .stagewrap, .stage { min-width: 0; }

/* Header */
.bar { background: var(--red); color: var(--bg); }
.bar .in { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap;
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 12px; }
.brand img { height: 48px; width: auto; display: block; }
.brand span { font-family: var(--f-mono); font-weight: 700; font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); border-left: 1px solid rgba(247, 238, 218, 0.4); padding-left: 12px; white-space: nowrap; }
.docname { flex: 1 1 200px; max-width: 340px; min-width: 0; background: transparent; border: 0; border-bottom: 2px solid rgba(247, 238, 218, 0.5); color: var(--bg); font-family: var(--f-display); font-size: 20px; padding: 4px 2px; min-height: 40px; border-radius: 0; }
.docname:focus { border-bottom-color: var(--gold); outline: none; }
.bar .tools { display: flex; gap: 8px; align-items: center; margin-left: auto; flex-wrap: wrap; }
.status { font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.06em; color: var(--gold); min-width: 0; }
.ibtn { width: 40px; height: 40px; display: grid; place-items: center; border: 2px solid var(--bg); background: transparent; color: var(--bg); cursor: pointer; padding: 0; }
.ibtn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.ibtn:disabled { opacity: 0.4; cursor: not-allowed; }
.ibtn:not(:disabled):hover { background: rgba(247, 238, 218, 0.14); }
.hbtn { border: 2px solid var(--bg); background: transparent; color: var(--bg); min-height: 40px; padding: 6px 14px; cursor: pointer; font-family: var(--f-mono); font-weight: 700; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; }
.hbtn:hover { background: rgba(247, 238, 218, 0.14); }
.hbtn.gold { background: var(--gold); border-color: var(--gold); color: var(--ink); }
.hbtn.gold:hover { background: #d8962c; border-color: #d8962c; }

/* Workspace */
.work { display: grid; grid-template-columns: 76px 318px minmax(0, 1fr) 300px; grid-template-areas: "rail side stage props"; min-height: 0;
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
.rail { grid-area: rail; background: var(--red-dark); display: flex; flex-direction: column; gap: 2px; padding: 8px 0; overflow: auto; }
.rail button { border: 0; background: transparent; color: var(--bg); padding: 9px 2px 8px; cursor: pointer; display: grid; justify-items: center; gap: 4px; font-family: var(--f-mono); font-weight: 700; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }
.rail button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.rail button:hover { background: rgba(247, 238, 218, 0.1); }
.rail button[aria-current="true"] { background: var(--bg); color: var(--red); }
.side { grid-area: side; background: var(--card); border-right: 2px solid var(--red); overflow: auto; padding: 16px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.props { grid-area: props; background: var(--card); border-left: 2px solid var(--red); overflow: auto; padding: 16px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.side h2, .props h2 { font-size: 22px; }
.stagewrap { grid-area: stage; display: grid; grid-template-rows: minmax(0, 1fr) auto; min-width: 0; min-height: 0; background: var(--desk); }
.stage { overflow: auto; display: flex; padding: 28px; min-height: 0; }
.paper { position: relative; margin: auto; flex: none; box-shadow: 0 10px 30px rgba(58, 29, 29, 0.28); background: #fff; }
.paper canvas { display: block; }
.overlay { position: absolute; inset: 0; touch-action: none; cursor: default; }
.overlay.drop { outline: 4px dashed var(--red); outline-offset: 6px; }
.selbox { position: absolute; border: 2px solid var(--gold); box-shadow: 0 0 0 1px var(--ink), inset 0 0 0 1px var(--ink); pointer-events: none; transform-origin: center; }
.selbox.locked { border-style: dashed; box-shadow: none; }
.hdl { position: absolute; width: 16px; height: 16px; background: var(--card); border: 2px solid var(--red); transform: translate(-50%, -50%); pointer-events: auto; touch-action: none; }
.hdl::before { content: ""; position: absolute; inset: -12px; }
.hdl[data-h="nw"] { left: 0; top: 0; cursor: nwse-resize; } .hdl[data-h="se"] { left: 100%; top: 100%; cursor: nwse-resize; }
.hdl[data-h="ne"] { left: 100%; top: 0; cursor: nesw-resize; } .hdl[data-h="sw"] { left: 0; top: 100%; cursor: nesw-resize; }
.hdl[data-h="n"] { left: 50%; top: 0; cursor: ns-resize; } .hdl[data-h="s"] { left: 50%; top: 100%; cursor: ns-resize; }
.hdl[data-h="e"] { left: 100%; top: 50%; cursor: ew-resize; } .hdl[data-h="w"] { left: 0; top: 50%; cursor: ew-resize; }
.hdl[data-h="rot"] { left: 50%; top: -34px; border-radius: 50%; width: 22px; height: 22px; background: var(--gold); border-color: var(--ink); cursor: grab; }
.hdl.mid { width: 12px; height: 12px; }
.guide { position: absolute; background: var(--guide); pointer-events: none; }
.guide.v { width: 1px; top: 0; bottom: 0; } .guide.h { height: 1px; left: 0; right: 0; }
.stagebar { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; padding: 8px 16px; border-top: 1px solid var(--rule); background: var(--card); }
.stagebar .dims { font-family: var(--f-mono); font-size: 12.5px; color: var(--brown); margin-right: auto; }
.zoom { display: inline-flex; align-items: center; }
.zoom button { width: 36px; height: 34px; border: 2px solid var(--red); background: transparent; color: var(--red); font-weight: 700; font-size: 17px; cursor: pointer; margin-left: -2px; }
.zoom button.fit { width: auto; padding: 0 10px; font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; }
.zoom span { min-width: 54px; text-align: center; font-family: var(--f-mono); font-size: 12.5px; }

/* Controls */
.label, label.f > span, .fl { font-family: var(--f-mono); font-weight: 700; font-size: 11.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--red); }
label.f { display: grid; gap: 5px; }
.hint { font-size: 13.5px; color: var(--brown); margin: 0; }
input[type="text"], input[type="number"], textarea, select { background: var(--bg); border: 2px solid var(--red); padding: 6px 10px; min-height: 40px; width: 100%; border-radius: 0; color: var(--ink); }
textarea { resize: vertical; min-height: 84px; line-height: 1.4; }
input[type="range"] { width: 100%; accent-color: var(--red); min-width: 0; }
input[type="color"] { width: 34px; height: 34px; padding: 0; border: 2px solid var(--ink); background: none; cursor: pointer; }
.pair { display: grid; grid-template-columns: minmax(0, 1fr) 72px; gap: 8px; align-items: center; }
.pair input[type="number"] { min-height: 34px; padding: 4px 6px; font-family: var(--f-mono); }
.group { display: grid; gap: 10px; border-top: 1px solid var(--rule); padding-top: 12px; }
.group:first-child { border-top: 0; padding-top: 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 2px solid var(--red); background: transparent; color: var(--red); padding: 6px 12px; cursor: pointer; min-height: 38px;
  font-family: var(--f-mono); font-weight: 700; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; }
.btn:hover { background: var(--gold-soft); }
.btn.primary { background: var(--red); color: var(--bg); }
.btn.primary:hover { background: var(--red-dark); border-color: var(--red-dark); }
.btn.gold { background: var(--gold); border-color: var(--gold); color: var(--ink); }
.btn.gold:hover { background: #d8962c; border-color: #d8962c; }
.btn.wide { width: 100%; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.warn { background: var(--red); color: var(--bg); }
.seg { display: flex; flex-wrap: wrap; }
.seg button { border: 2px solid var(--red); background: transparent; color: var(--red); padding: 5px 10px; cursor: pointer; min-height: 36px; font-family: var(--f-mono); font-weight: 700; font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; margin: 0 -2px -2px 0; }
.seg button[aria-pressed="true"] { background: var(--red); color: var(--bg); }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sw { width: 30px; height: 30px; border: 2px solid var(--rule); cursor: pointer; padding: 0; position: relative; }
.sw[aria-pressed="true"] { outline: 3px solid var(--ink); outline-offset: 1px; }
.sw.none { background: linear-gradient(135deg, var(--card) 45%, var(--red) 45% 55%, var(--card) 55%); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* Panels */
.tpls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tpl { border: 2px solid var(--red); background: var(--bg); padding: 6px; cursor: pointer; display: grid; gap: 6px; text-align: left; }
.tpl:hover { background: var(--gold-soft); }
.tpl canvas { width: 100%; height: auto; display: block; background: #fff; box-shadow: 0 1px 4px var(--shade); }
.tpl b { font-family: var(--f-display); font-weight: 400; font-size: 15px; color: var(--ink); }
.sizes { display: grid; gap: 6px; }
.sizes button { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; text-align: left; border: 2px solid var(--red); background: var(--bg); padding: 6px 10px; cursor: pointer; min-height: 38px; }
.sizes button b { font-weight: 600; }
.sizes button small { font-family: var(--f-mono); font-size: 11.5px; color: var(--brown); white-space: nowrap; }
.sizes button[aria-pressed="true"] { background: var(--red); color: var(--bg); }
.sizes button[aria-pressed="true"] small { color: var(--gold); }
.adds { display: grid; gap: 8px; }
.add { text-align: left; border: 2px solid var(--red); background: var(--bg); padding: 10px 12px; cursor: pointer; color: var(--ink); }
.add:hover { background: var(--gold-soft); }
.photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.photos button { aspect-ratio: 1; border: 2px solid var(--rule); background: var(--desk) center / cover no-repeat; cursor: pointer; padding: 0; }
.photos button:hover { border-color: var(--red); }
.dropzone { border: 2px dashed var(--red); padding: 16px 12px; text-align: center; display: grid; gap: 8px; justify-items: center; background: var(--bg); }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.layers { display: grid; border: 2px solid var(--red); background: var(--bg); }
.layer { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 8px; border-bottom: 1px solid var(--rule); cursor: pointer; }
.layer:last-child { border-bottom: 0; }
.layer[aria-current="true"] { background: var(--gold-soft); box-shadow: inset 4px 0 0 var(--red); }
.layer .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.layer svg { width: 18px; height: 18px; fill: none; stroke: var(--red); stroke-width: 2; }
.layer .acts { display: flex; gap: 2px; }
.layer .acts button { width: 30px; height: 30px; border: 0; background: none; cursor: pointer; color: var(--brown); font-size: 14px; padding: 0; }
.layer .acts button:hover { color: var(--red); background: var(--card); }
.designs { display: grid; gap: 10px; }
.design { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 10px; border: 2px solid var(--red); background: var(--bg); padding: 6px; }
.design img { width: 84px; height: 84px; object-fit: contain; background: var(--desk); display: block; }
.design b { font-family: var(--f-display); font-weight: 400; font-size: 16px; overflow-wrap: anywhere; }
.design small { font-size: 12.5px; color: var(--brown); display: block; }
.design .row { gap: 6px; margin-top: 4px; }
.design .btn { min-height: 32px; padding: 3px 8px; font-size: 11px; }
.empty { border: 2px dashed var(--rule); padding: 18px 12px; text-align: center; color: var(--brown); font-size: 14px; }
.pillars { display: flex; gap: 6px; flex-wrap: wrap; }
.pillars button { border: 2px solid var(--red); background: transparent; color: var(--red); padding: 4px 10px; min-height: 34px; cursor: pointer; font-family: var(--f-mono); font-weight: 700; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
.pillars button[aria-pressed="true"] { background: var(--red); color: var(--bg); }
.ideas { display: grid; border: 2px solid var(--red); background: var(--bg); }
.idea { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 9px 10px; border-bottom: 1px solid var(--rule); }
.idea:last-child { border-bottom: 0; }
.idea b { font-family: var(--f-display); font-weight: 400; font-size: 16px; }
.idea p { margin: 0; grid-column: 1; font-size: 13.5px; color: var(--brown); line-height: 1.35; }
.idea .btn { grid-column: 2; grid-row: 1 / span 2; min-height: 32px; padding: 3px 8px; font-size: 11px; }
.idea .when { font-family: var(--f-mono); font-weight: 700; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--red); }
.mix { font-size: 13.5px; color: var(--brown); margin: 0; border-left: 4px solid var(--gold); padding: 3px 0 3px 10px; }
textarea#caption { min-height: 180px; }
.count { font-family: var(--f-mono); font-size: 12.5px; color: var(--brown); }
.count.over { color: var(--red); font-weight: 700; }
.preview-more { background: var(--bg); border: 1px dashed var(--rule); padding: 8px 10px; font-size: 14px; overflow-wrap: anywhere; }
.preview-more .more { color: var(--brown); }
.checks { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.checks li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: baseline; font-size: 14px; line-height: 1.35; }
.mark { font-family: var(--f-mono); font-weight: 700; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; padding: 1px 6px; min-width: 42px; text-align: center; }
.mark.fix { background: var(--red); color: var(--bg); } .mark.tip { background: var(--gold); color: var(--ink); } .mark.ok { background: var(--good-soft); color: var(--good); }
.options { display: grid; gap: 8px; }
.option { border: 2px solid var(--red); background: var(--bg); padding: 8px 10px; display: grid; gap: 6px; }
.option p { margin: 0; white-space: pre-wrap; font-size: 14px; overflow-wrap: anywhere; }

/* Saved image sheet + toast */
.sheet { position: fixed; inset: 0; background: rgba(58, 29, 29, 0.6); display: grid; place-items: center; z-index: 60;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet .in { background: var(--card); border: 2px solid var(--red); padding: 16px; display: grid; gap: 10px; justify-items: center; max-height: 100%; overflow: auto; max-width: 560px; text-align: center; }
.sheet img { max-height: 60vh; width: auto; max-width: 100%; box-shadow: 0 2px 10px var(--shade); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 18px; z-index: 70; box-shadow: 0 8px 24px var(--shade); max-width: calc(100% - 32px); border-left: 4px solid var(--gold); }
.toast.bad { background: var(--red); border-left-color: var(--ink); }

/* Tablet: settings go under the page */
@media (max-width: 1180px) {
  .work { grid-template-columns: 76px 300px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: "rail side stage" "rail side props"; }
  .props { border-left: 0; border-top: 2px solid var(--red); max-height: 40vh; }
}
/* Phone: everything stacks and the page scrolls */
@media (max-width: 760px) {
  body { overflow: auto; }
  #app { height: auto; min-height: 100%; }
  .brand img { height: 38px; }
  .brand span { display: none; }
  .bar .tools { margin-left: 0; width: 100%; }
  .bar .tools .hbtn.gold { margin-left: auto; }
  .work { display: flex; flex-direction: column; padding-left: 0; padding-right: 0; }
  .stagewrap { order: 1; }
  .stage { padding: 16px; }
  .rail { order: 2; flex-direction: row; overflow-x: auto; padding: 4px max(16px, env(safe-area-inset-left, 0px)); }
  .rail button { min-width: 70px; }
  .props { order: 3; border: 0; border-top: 2px solid var(--red); max-height: none; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .side { order: 4; border: 0; border-top: 2px solid var(--red); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
</style>

        <div class="group"><div class="fl">Download</div>
          ${S2.group === "print" ? `<button class="btn gold wide" data-act="pdf">PDF for printing</button>` : ""}
          <button class="btn ${S2.group === "print" ? "" : "gold "}wide" data-act="png">PNG image</button>
          ${S2.group === "print" ? `<p class="hint">Print the PDF at actual size (100%) on ${esc(S2.note)} paper.</p>` : `<p class="hint">Then copy your caption from the Caption tab.</p>`}</div>
        <p class="hint">Tap anything on the page to edit it.</p>
        ${appVersion ? `<p class="hint">Bespoke Post Studio ${esc(appVersion)}</p>` : ""}`;
      return;
    }
    let body = "";
    if (el.type === "text") {
      body = `<h2>Text</h2>
        <label class="f"><span>Words</span><textarea id="p-text" data-k="text" data-t="str">${esc(el.text)}</textarea></label>
        <label class="f"><span>Font</span><select id="p-font" data-k="font" data-t="str">${FONTS.map((f) => `<option value="${f.f}" ${f.f === el.font ? "selected" : ""}>${esc(f.label)}</option>`).join("")}</select></label>
        <label class="f"><span>Size (${isPrint() ? "points" : "pixels"})</span>${pair("p-size", "size", toDisp(el.size), isPrint() ? 6 : 10, isPrint() ? 220 : 320, 1, "disp")}</label>
        <div class="fl">Color</div>${swatches("color", el.color, false)}
        <div class="fl">Line up</div>${seg("align", el.align, [["left", "Left"], ["center", "Center"], ["right", "Right"]])}
        <div class="seg"><button data-tog="bold" ${pressed(!!el.bold, true)}>Bold</button><button data-tog="italic" ${pressed(!!el.italic, true)}>Italic</button><button data-tog="caps" ${pressed(!!el.caps, true)}>All caps</button></div>
        <label class="f"><span>Letter spacing</span>${pair("p-sp", "spacing", el.spacing || 0, -5, 60, 1, "num")}</label>
        <label class="f"><span>Line spacing</span>${pair("p-lh", "lineH", el.lineH || 1.15, 0.8, 2.2, 0.02, "num")}</label>
        <div class="fl">Box behind the words</div>${swatches("hl", el.hl, true)}`;
    } else if (el.type === "image") {
      body = `<h2>Photo</h2>
        <div class="grid2"><label class="btn primary" for="file-replace">${el.src ? "Replace photo" : "Add photo"}</label><button class="btn" data-tab-go="photos">From library</button></div>
        ${el.src ? `<div class="fl">Fit</div>${seg("fit", el.fit, [["cover", "Fill the frame"], ["contain", "Show it all"]])}
        <label class="f"><span>Zoom</span>${pair("p-zoom", "zoom", el.zoom || 1, 1, 4, 0.01, "num")}</label>
        <label class="f"><span>Left / right</span>${pair("p-px", "px", el.px || 0, -1, 1, 0.01, "num")}</label>
        <label class="f"><span>Up / down</span>${pair("p-py", "py", el.py || 0, -1, 1, 0.01, "num")}</label>
        <button class="btn wide" data-act="aspect">Match frame to the photo's shape</button>` : ""}
        <div class="fl">Shape</div>${seg("shape", el.shape, [["rect", "Rectangle"], ["circle", "Circle"]])}
        <div class="fl">Frame</div>${seg("frame", el.frame, [["none", "None"], ["brand", "Red and gold"], ["line", "Line"]])}
        ${el.frame === "line" ? swatches("frameColor", el.frameColor, false) : ""}
        <button class="btn wide" data-act="fill">Fill the whole page</button>`;
    } else if (el.type === "shape") {
      body = `<h2>${el.kind === "ellipse" ? "Circle" : "Shape"}</h2>
        <div class="fl">Fill</div>${swatches("fill", el.fill, true)}
        <div class="fl">Outline</div>${swatches("stroke", el.stroke, true)}
        <label class="f"><span>Outline thickness</span>${pair("p-sw", "sw", Math.round(el.sw || 0), 0, Math.round(60 * unitK()), 1, "num")}</label>
        <div class="seg"><button data-tog="framed" ${pressed(!!el.framed, true)}>Inner gold line</button></div>
        <div class="fl">Shape</div>${seg("kind", el.kind, [["rect", "Rectangle"], ["ellipse", "Circle"]])}`;
    } else if (el.type === "logo") {
      body = `<h2>Logo</h2><p class="hint">The gold logo reads best on red or dark backgrounds. Drag a corner to resize it.</p>`;
    }
    p.innerHTML = body + arrangeBlock(el);
  }
  const props = $("props");
  let propDirty = false;
  function parseVal(t, v) { if (t === "str") return v; const n = parseFloat(v); if (!isFinite(n)) return null; if (t === "disp") return fromDisp(n); if (t === "pct") return clamp(n, 0, 100) / 100; return n; }
  props.addEventListener("input", (e) => {
    const k = e.target.dataset.k; if (!k) return;
    const target = selEl() || doc;
    const v = parseVal(e.target.dataset.t || "str", e.target.value);
    if (v === null) return;
    target[k] = v;
    if (k === "text" && target.type === "text") syncText(target);
    if (target.type === "text" && (k === "size" || k === "spacing" || k === "lineH" || k === "font")) syncText(target);
    const pairEl = e.target.closest(".pair");
    if (pairEl) for (const o of pairEl.querySelectorAll("input")) if (o !== e.target) o.value = e.target.value;
    if (e.target.type === "color") { for (const s of props.querySelectorAll(`.sw[data-set="${k}"]`)) s.setAttribute("aria-pressed", "false"); }
    propDirty = true; requestPaint();
  });
  props.addEventListener("change", (e) => {
    if (e.target.dataset.page === "size") { setSize(e.target.value); return; }
    if (e.target.id === "p-margins") { view.margins = e.target.checked; paint(); return; }
    if (propDirty) { propDirty = false; commit(); }
    if (e.target.tagName === "SELECT") renderProps();
  });
  props.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    const d = b.dataset, target = selEl() || doc;
    if (d.set) {
      let v = d.v || null;
      target[d.set] = v;
      if (target.type === "shape" && d.set === "stroke" && v && !(target.sw > 0)) target.sw = Math.round(6 * unitK());
      if (target.type === "text") syncText(target);
      commit(); paint(); renderProps();
    } else if (d.tog) { target[d.tog] = !target[d.tog]; if (target.type === "text") syncText(target); commit(); paint(); renderProps(); }
    else if (d.act === "png") downloadPNG();
    else if (d.act === "pdf") downloadPDF();
    else if (d.act) act(d.act);
    else if (d.tabGo) { view.tab = d.tabGo; renderRail(); renderSide(); }
  });

  // ---------- header ----------
  $("undo").addEventListener("click", undo);
  $("redo").addEventListener("click", redo);
  $("save").addEventListener("click", saveDesign);
  $("docname").addEventListener("input", (e) => { doc.name = e.target.value; autosave(); });
  $("docname").addEventListener("change", () => commit());
  const ZOOMS = [0.5, 0.75, 1, 1.5, 2, 3];
  $("zin").addEventListener("click", () => { view.zoom = ZOOMS.find((z) => z > view.zoom + 0.01) || view.zoom; fit(); });
  $("zout").addEventListener("click", () => { view.zoom = [...ZOOMS].reverse().find((z) => z < view.zoom - 0.01) || view.zoom; fit(); });
  $("zfit").addEventListener("click", () => { view.zoom = 1; fit(); });

  function renderAll() { $("docname").value = doc.name || ""; renderRail(); renderSide(); renderProps(); paint(); updateUndo(); }

  // ---------- start ----------
  const work = lsGet("bespoke-studio-work-v2");
  if (work && work.doc && SIZES[work.doc.size] && Array.isArray(work.doc.els)) { Object.assign(doc, work.doc); designId = work.designId || null; }
  else { const r = tCard(doc.w, doc.h, {}, false); doc.bg = r.bg; doc.els = r.els; }
  resetHistory();
  renderAll();
  requestAnimationFrame(fit);
  new ResizeObserver(() => fit()).observe(stage);
  const relayout = () => { for (const el of doc.els) if (el.type === "text") syncText(el); paint(); if (view.tab === "templates") drawThumbs(); };
  if (!logo.complete) logo.addEventListener("load", relayout);
  Promise.all(FONTS.flatMap((f) => [`400 40px "${f.f}"`, `700 40px "${f.f}"`, `italic 400 40px "${f.f}"`]).map((s) => document.fonts.load(s).catch(() => {}))).then(relayout);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);

  // Local designs until the shared store answers.
  const localAll = lsGet(LOCAL_DESIGNS) || {};
  designs = Object.entries(localAll).map(([k, v]) => ({ id: k, ...v })).sort((a, b) => b.updated - a.updated);

  // Dropping a file anywhere else must not open it in place of the app.
  document.addEventListener("dragover", (e) => e.preventDefault());
  document.addEventListener("drop", (e) => e.preventDefault());
  function loadDeviceLib() {
    idb.all().then((rows) => {
      const have = new Set(lib.map((p) => p.src));
      lib = [...lib, ...(rows || []).sort((a, b) => b.added - a.added).map((r) => ({ src: "idb:" + r.id, url: r.thumb })).filter((x) => !have.has(x.src))];
      if (view.tab === "photos") renderSide();
    }).catch(() => {});
  }
  if (window.studio && window.studio.version) window.studio.version().then((v) => { appVersion = v; if (!sel) renderProps(); }).catch(() => {});

  if (!(window.claude && claude.use)) loadDeviceLib();
  if (window.claude && claude.use) {
    claude.use("downloads").then((d) => { downloads = d; }).catch(() => {});
    claude.use("sample").then((s) => { sample = s; if (view.tab === "caption") renderSide(); }).catch(() => {});
    claude.use("assets").then(async (a) => {
      assets = a; if (!a) { loadDeviceLib(); return; }
      try {
        const r = await a.list();
        const have = new Set(lib.map((p) => p.src));
        const fromStore = r.assets.filter((x) => /^image\//.test(x.contentType)).reverse().map((x) => ({ src: "asset:" + x.id, url: x.url })).filter((x) => !have.has(x.src));
        lib = [...lib, ...fromStore];
      } catch {}
      if (view.tab === "photos") renderSide();
    }).catch(() => {});
    Promise.all([claude.use("db"), claude.use("user")]).then(async ([db, user]) => {
      const id = db && user ? await user.id() : null;
      if (!db || !id) return;
      designsColl = db.collection("data/users/" + id);
      designsColl.orderBy("updated", "desc").limit(200).onSnapshot((snap) => {
        designs = snap.docs.map((d) => ({ id: d.id, ...d.data() })).filter((d) => d.doc && SIZES[d.size]);
        if (view.tab === "designs") renderSide();
      }, () => {});
    }).catch(() => {});
  }
})();
</script>
</body>
</html>
