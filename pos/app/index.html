  // Markup table in Settings: one row per garment, with an example code's cost and selling price.
  const EXAMPLE_CODE = "V3";
  function exampleCode(type) { const c = S.priceList.codes.find((x) => x.code === EXAMPLE_CODE && x.prices[type] != null) || S.priceList.codes.find((x) => x.prices[type] != null); return c; }
  function markupExample(type) {
    const c = exampleCode(type); if (!c) return "";
    return `${esc(c.code)}: ${m(c.prices[type])} → <b>${m(sellPrice(c.prices[type], type))}</b>`;
  }
  function markupHtml() {
    const mk = S.settings.markup;
    const locked = hasManager() && isLocked();
    const dis = locked ? "disabled" : "";
    const R = [["0", "Exact"], ["1", "Nearest $1"], ["5", "Up to next $5"], ["10", "Up to next $10"]];
    return `<div style="display:grid;gap:10px"><div class="row"><span class="label">Markup by garment</span>${locked ? `<span style="margin-left:auto"></span><button class="btn small" data-act="mgr-unlock">Unlock to change</button>` : ""}</div>
      <div class="tablewrap"><table class="mkup"><thead><tr><th>Garment</th><th class="r">Markup</th><th>Example: cost → you charge</th></tr></thead><tbody>
      ${S.priceList.types.map((t) => { const id = t.replace(/[^\w]/g, "_"); const v = mk.byType[t]; return `<tr><td>${esc(t)}</td>
        <td class="r"><span class="pct"><input type="number" min="0" max="1000" step="1" id="mk-${id}" value="${v == null ? "" : esc(v)}" placeholder="${mk.fallback != null && mk.fallback !== "" ? esc(mk.fallback) : "—"}" data-in="markup" data-t="${esc(t)}" ${dis}><span>%</span></span></td>
        <td class="small" id="mkx-${id}">${markupExample(t)}</td></tr>`; }).join("")}
      <tr class="totals"><td>Anything left blank</td><td class="r"><span class="pct"><input type="number" min="0" max="1000" step="1" id="mk-fallback" value="${mk.fallback == null ? "" : esc(mk.fallback)}" placeholder="—" data-in="markup" data-t="" ${dis}><span>%</span></span></td><td class="small muted">Used for garments with no markup of their own, including new ones on a future list.</td></tr>
      </tbody></table></div>
      <div class="row"><span class="label">Round prices</span><div class="seg">${R.map(([k, t]) => `<button data-act="mk-round" data-v="${k}" aria-pressed="${String(mk.round) === k}" ${dis}>${t}</button>`).join("")}</div></div>
      <p class="small muted" style="margin:0">100% doubles the supplier's price. Changes apply to every price code card right away; sales already rung up keep their price.</p></div>`;
  }

      const cardSum = rec.payments.filter((p) => p.method === "Card" && !p.reader).reduce((a, p) => a + p.amount, 0);
      const viaReader = readerRefundable(rec);

        lines: [{ name: "Dress: Hem", measure: "", qty: 1, price: 4500 }], total: 4500, unpriced: [], notes: "", rev: 2, edited: new Date().toISOString() });
    S.customers.push({ id: "c1", remoteId: "a".repeat(24), name: "Margaret Ellis", email: "margaret.ellis@example.com", phone: "(814) 555-0142" }, { id: "c2", name: "David Okafor", email: "d.okafor@example.com", phone: "" });
    // Two example sales so the Sales and Returns screens have something to show.
    const [blazer, shirt, tie] = S.items;
    const mk = (cust, cart, pay, mins) => {
      UI.cart = cart.map(([it, size, ci, qty]) => ({ key: uid(), itemId: it ? it.id : null, name: it ? it.name : size, size: it ? size : "", colorId: it && it.colors[ci] ? it.colors[ci].id : "", colorName: it && it.colors[ci] ? it.colors[ci].name : "", price: it ? it.price : qty, qty: it ? qty : 1, taxable: false, disc: null }));
      const t = cartTotals();
      const lines = UI.cart.map((l, i) => ({ ...l, net: t.perLine[i].net, tax: t.perLine[i].tax, paid: t.perLine[i].paid, returned: 0 }));
      lines.forEach((l) => { if (l.itemId) { const it = itemById(l.itemId); it.stock[L.stockKey(l.size, l.colorId)] -= l.qty; } });
      S.sales.push({ id: uid(), kind: "sale", no: S.settings.nextReceipt++, date: new Date(Date.now() - mins * 60000).toISOString(), customer: cust, lines, cartDisc: null, subtotal: t.subtotal, discount: t.discount, tax: t.tax, total: t.total, payments: [{ method: pay, amount: t.total }], change: 0, voided: false });
      UI.cart = [];
    };
    mk(S.customers[0], [[blazer, "40R", 0, 1], [tie, "One size", 0, 1]], "Card", 140);
    mk(null, [[shirt, "M", 1, 2], [null, "Hem trousers", 0, 1500]], "Cash", 55);
    Object.assign(S.sales[0], { staffId: "st1", staffName: "Shop owner" });
    Object.assign(S.sales[1], { staffId: "st2", staffName: "Jordan (example)" });
  }

  async function boot() {
    const st = document.createElement("style"); st.textContent = receiptCss + labelCss; document.head.appendChild(st);
    try { S = await pos.load(); } catch { S = null; }
    if (!S) S = defaults();
    migrate();
    if (PREVIEW && !S.items.length) await seedPreview();
    render();
    startSync();
    setInterval(tick, 20000);
    if (!PREVIEW) pos.info().then((i) => { UI.info = i; }).catch(() => {});
  }
  boot();
})();
