/* Customers tab (from the tablet): customer list on the left, the chosen customer on the right. */
.people { display: grid; grid-template-columns: 380px minmax(0, 1fr); height: calc(100vh - var(--chrome, 140px)); min-height: 360px; }
.people .roster { border-right: 2px solid var(--red); background: var(--card); display: flex; flex-direction: column; min-height: 0; }
.roster .find { padding: 14px 16px; display: grid; gap: 10px; border-bottom: 1px solid var(--gold); flex: none; }
.roster .who-list { overflow: auto; min-height: 0; flex: 1 1 auto; }
.who-list button { display: grid; gap: 2px; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--rule); background: none; padding: 12px 16px; min-height: 60px; cursor: pointer; }
.who-list button:hover { background: var(--bg); }
.who-list button[aria-current="true"] { background: var(--gold-soft); box-shadow: inset 5px 0 0 var(--red); }
.who-list b { font-family: var(--f-display); font-weight: 400; font-size: 19px; overflow-wrap: anywhere; }
.who-list .sub { font-size: 14px; color: var(--brown); overflow-wrap: anywhere; }
.people .detail { overflow: auto; min-height: 0; padding: 24px 24px 40px; display: grid; gap: 18px; align-content: start; }
.detail .who-head { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.detail .who-head > div { min-width: 0; flex: 1 1 280px; display: grid; gap: 4px; }
.detail .who-head h2 { overflow-wrap: anywhere; }
.spentrow { display: flex; gap: 8px 18px; flex-wrap: wrap; font-family: var(--f-mono); font-size: 14px; }
.spentrow b { color: var(--red); }
.lastvisit { font-family: var(--f-mono); font-size: 14px; color: var(--brown); }
.lastvisit b { color: var(--ink); }
.searchbox { position: relative; }
.searchbox input[type="text"] { padding-right: 48px; }
.searchbox .clear { position: absolute; right: 2px; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border: 0; background: none; color: var(--brown); font-size: 18px; cursor: pointer; border-radius: 50%; }
.searchbox .clear:hover { background: var(--gold-soft); color: var(--red); }
.people .glyph { width: 72px; height: 72px; }
.people .frame > .in { padding: 28px; display: grid; gap: 10px; justify-items: start; }
@media (max-width: 1100px) { .people { grid-template-columns: 300px minmax(0, 1fr); } }
@media (max-width: 760px) {
  .people { grid-template-columns: 1fr; height: auto; }
  .people .roster { border-right: 0; border-bottom: 2px solid var(--red); }
  .roster .who-list { max-height: 50vh; }
  .people .detail { overflow: visible; padding: 18px 16px 32px; }
}

/* Alteration tags on the Customers tab */
.tagcards { display: grid; gap: 12px; }
.tagcard { border: 2px solid var(--red); padding: 5px; background: var(--card); }
.tagcard > .in { border: 1px solid var(--gold); padding: 12px 14px; display: grid; gap: 6px; }
.tagcard.closed { opacity: 0.7; border-color: var(--rule); }
.tagcard .top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.tagcard .top b { font-family: var(--f-display); font-weight: 400; font-size: 20px; color: var(--red); }
.tagcard .items { overflow-wrap: anywhere; }
.tagcard .late { color: var(--red); font-weight: 600; }

/* Customer list status at the top of the screen (same as the Alterations app) */
.linkbtn { margin-left: auto; border: 2px solid var(--bg); background: transparent; color: var(--bg); min-height: 40px; padding: 6px 14px; cursor: pointer; font-family: var(--f-mono); font-weight: 700; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
/* The status text changes during every sync; keep it on one line and the same width so the header never jumps. */
.linkbtn { white-space: nowrap; width: 210px; justify-content: center; flex-shrink: 0; }
.linkbtn span { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.linkbtn:hover { background: rgba(247, 238, 218, 0.12); }
.linkbtn i { width: 10px; height: 10px; border-radius: 50%; background: var(--rule); display: inline-block; }
.linkbtn.ok i { background: #7fd39a; } .linkbtn.warn i { background: var(--gold); } .linkbtn.bad i { background: #ff8a8a; }
.bar .linkbtn + .clock { margin-left: 0; }
@media (max-width: 1300px) {
  .bar { gap: 14px; }
  .bar .brand span { display: none; }
  .tabs button { padding: 10px 12px; letter-spacing: 0.12em; }

<title>Bespoke Register</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>/* Layout: the website's red header band (logo left, cream tabs) over a cream counter:
   item cards on the left, the current sale on the right. Square corners, red frames with a gold inner line,
   Courier Prime capitals for labels and buttons, Gloock for headings, all as on bespoke tailoring's site. */
:root {
  --bg: #f7eeda;
  --card: #fbf5e6;
  --white: #fffaf0;
  --ink: #3a1d1d;
  --brown: #7a4a20;
  --rule: #cfb98a;
  --red: #b92f37;
  --red-dark: #8a1f26;
  --gold: #e3a53f;
  --gold-soft: #fff3d6;
  --good: #2f7d4f;
  --good-soft: #e1efe3;
  --warn: #9a5a00;
  --warn-soft: #fbe7c2;
  --bad: #b92f37;
  --bad-soft: #f6dcd8;
  --shade: rgba(58, 29, 29, 0.18);
  --scrim: rgba(58, 29, 29, 0.6);
  --f-display: "Gloock", "Georgia", "Times New Roman", serif;
  --f-body: "Lora", "Georgia", "Times New Roman", serif;
  --f-mono: "Courier Prime", "Courier New", ui-monospace, monospace;
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--f-body); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; margin: 0; text-wrap: balance; color: var(--red); }
h2 { font-size: 30px; line-height: 1.15; }
h3 { font-size: 22px; }
.num, .money { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

#app { display: grid; grid-template-rows: auto auto 1fr; height: 100%; }

/* Header band */
.bar { display: flex; align-items: center; gap: 28px; padding: 10px 22px; background: var(--red); color: var(--bg); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 14px; }
.brand img { height: 64px; width: auto; display: block; }
.brand span { font-family: var(--f-mono); font-weight: 700; font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); border-left: 1px solid rgba(247, 238, 218, 0.4); padding-left: 14px; }
.tabs { display: flex; flex-wrap: wrap; }
.tabs button { background: transparent; color: var(--bg); border: 2px solid var(--bg); padding: 10px 20px; cursor: pointer; font-family: var(--f-mono); font-weight: 700; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; }
.tabs button + button { border-left: 0; }
.tabs button:hover { background: rgba(247, 238, 218, 0.12); }
.tabs button[aria-current="page"] { background: var(--bg); color: var(--red); }
.bar .clock { margin-left: auto; font-family: var(--f-mono); font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--bg); }
.notice { background: var(--gold); color: var(--ink); padding: 7px 22px; font-family: var(--f-mono); font-size: 13px; letter-spacing: 0.04em; }
.notice:empty { display: none; }

main { min-height: 0; overflow: auto; }
.page { padding: 32px 24px 48px; max-width: 1280px; margin: 0 auto; display: grid; gap: 20px; }
.head { display: flex; align-items: end; gap: 16px; flex-wrap: wrap; }
.head .sub { color: var(--brown); }
.head .tools { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* Buttons: outlined red capitals, like the site's staff buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 2px solid var(--red); background: transparent; color: var(--red); padding: 8px 16px; cursor: pointer; min-height: 40px; white-space: nowrap;
  font-family: var(--f-mono); font-weight: 700; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; }
.btn:hover { background: var(--gold-soft); }
.btn.primary { background: var(--red); color: var(--bg); }
.btn.primary:hover { background: var(--red-dark); border-color: var(--red-dark); }
.btn.gold { background: var(--gold); border-color: var(--gold); color: var(--ink); }
.btn.gold:hover { background: #d8962c; border-color: #d8962c; }
.btn.ghost { border-color: transparent; color: var(--brown); padding-inline: 8px; }
.btn.ghost:hover { color: var(--red); background: transparent; text-decoration: underline; }
.btn.danger { color: var(--red); }
.btn.big { min-height: 58px; font-size: 16px; padding: 10px 22px; letter-spacing: 0.16em; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.small { min-height: 30px; padding: 3px 10px; font-size: 11.5px; letter-spacing: 0.12em; }
input[type="text"], input[type="search"], input[type="email"], input[type="tel"], input[type="number"], input[type="password"], input[type="date"], input[type="url"], select, textarea {
  background: var(--bg); border: 2px solid var(--red); padding: 8px 12px; min-height: 42px; width: 100%; color: var(--ink); border-radius: 0;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--gold); outline-offset: 2px; }
input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--red); flex: none; }
label.f { display: grid; gap: 5px; }
label.f > span, .label { font-family: var(--f-mono); font-weight: 700; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--red); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.seg { display: inline-flex; }
.seg button { border: 2px solid var(--red); background: transparent; color: var(--red); padding: 6px 14px; cursor: pointer; min-height: 40px; font-family: var(--f-mono); font-weight: 700; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; }
.seg button + button { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--red); color: var(--bg); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 2px solid var(--red); background: transparent; color: var(--red); padding: 5px 13px; cursor: pointer; font-family: var(--f-mono); font-weight: 700; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; }
.chip[aria-pressed="true"] { background: var(--red); color: var(--bg); }
.pill { display: inline-block; padding: 1px 7px; font-family: var(--f-mono); font-weight: 700; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--red); color: var(--bg); }
.pill.plain { background: var(--gold); color: var(--ink); }
.muted { color: var(--brown); }
.small { font-size: 14px; }
.empty { padding: 36px 16px; text-align: center; color: var(--brown); border: 2px dashed var(--rule); }

/* The site's framed card: red border, inner gold line */
.frame { border: 2px solid var(--red); padding: 7px; background: var(--card); box-shadow: 0 6px 18px var(--shade); }
.frame > .in { border: 1px solid var(--gold); }
.banner { background: var(--red); color: var(--gold); font-family: var(--f-display); font-size: 22px; letter-spacing: 0.06em; text-transform: uppercase; padding: 8px 18px; margin: 0; }

/* Register */
/* The sale panel always fills from under the header to the bottom of the window (--chrome = header height, set by the app). */
.counter { display: grid; grid-template-columns: minmax(0, 1fr) 440px; align-items: start; height: 100%; min-height: calc(100vh - var(--chrome, 140px)); }
.shelf { min-height: 0; overflow: auto; padding: 22px 24px 32px; display: grid; gap: 16px; align-content: start; }
.shelf .find input { font-size: 17px; min-height: 48px; }
.services { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.services .label { margin-right: 4px; }
.service { border: 2px dashed var(--red); background: transparent; padding: 6px 12px; cursor: pointer; font-size: 15px; color: var(--ink); }
.service:hover { background: var(--gold-soft); border-style: solid; }
.service .money { color: var(--red); margin-left: 6px; font-size: 14px; font-weight: 700; }

.tags { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
/* Each item is a framed card with a punched tag hole. */
.tag { position: relative; text-align: left; border: 2px solid var(--red); background: var(--card); padding: 7px; cursor: pointer; display: block; box-shadow: 0 4px 12px var(--shade); transition: transform 0.12s, box-shadow 0.12s; }
.tag > .in { border: 1px solid var(--gold); padding: 24px 12px 12px; display: grid; gap: 6px; height: 100%; position: relative; }
.tag .in::before { content: ""; position: absolute; top: 8px; left: 50%; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--bg); box-shadow: inset 0 0 0 1.5px var(--red); }
.tag:hover { transform: translateY(-2px); box-shadow: 0 8px 20px var(--shade); }
.tag .nm { font-family: var(--f-display); font-size: 19px; line-height: 1.2; color: var(--ink); }
.tag .cat { font-family: var(--f-mono); font-weight: 700; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--red); }
.tag .bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 2px; }
.tag .price { font-family: var(--f-mono); font-size: 18px; font-weight: 700; color: var(--red); }
.tag.out { opacity: 0.55; }
.dots { display: flex; gap: 4px; }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1.5px var(--brown); display: inline-block; flex: none; }

/* Current sale */
.tape { min-width: 0; background: var(--card); border-left: 2px solid var(--red); display: flex; flex-direction: column; position: sticky; top: 0; height: calc(100vh - var(--chrome, 140px)); min-height: 360px; }
.tape > .lines { min-height: 0; overflow: auto; }
.tape > .lines { flex: 1 1 auto; }
.tape > .top, .tape > .who, .tape > .sums { flex: none; }
.tape .top { display: flex; align-items: center; gap: 10px; background: var(--red); padding: 0 10px 0 0; }
.tape .top .banner { flex: 1; }
.tape .top .btn.ghost { color: var(--bg); }
.tape .top .btn.ghost:disabled { opacity: 0.45; }
.who { padding: 12px 18px; border-bottom: 1px solid var(--gold); display: grid; gap: 6px; position: relative; }
.who .picked { display: flex; align-items: center; gap: 4px 10px; flex-wrap: wrap; min-width: 0; }
.who .picked b { font-weight: 600; }
.who .picked .muted { overflow-wrap: anywhere; }
.suggest { position: absolute; left: 18px; right: 18px; top: calc(100% - 6px); background: var(--card); border: 2px solid var(--red); box-shadow: 0 8px 24px var(--shade); z-index: 5; max-height: 260px; overflow: auto; }
.suggest button { display: block; width: 100%; text-align: left; border: 0; border-top: 1px solid #e8d9b5; background: none; padding: 10px 14px; cursor: pointer; }
.suggest button:first-child { border-top: 0; }
.suggest button:hover, .suggest button:focus { background: var(--bg); }
.lines { overflow: auto; min-height: 0; }
.line { padding: 12px 18px; border-bottom: 1px solid var(--rule); display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; }
.line .what { min-width: 0; }
.line .what b { font-family: var(--f-display); font-weight: 400; font-size: 18px; }
.line .opts { font-size: 14px; color: var(--brown); }
.line .amt { text-align: right; font-family: var(--f-mono); font-weight: 700; }
.line .amt s { color: var(--brown); font-weight: 400; font-size: 13px; display: block; }
.line .ctl { grid-column: 1 / -1; display: flex; gap: 6px; align-items: center; }
.qty { display: inline-flex; align-items: center; border: 2px solid var(--red); }
.qty button { border: 0; background: none; width: 30px; height: 28px; cursor: pointer; font-size: 17px; color: var(--red); font-weight: 700; }
.qty span { min-width: 26px; text-align: center; font-family: var(--f-mono); font-weight: 700; }
.line.credit { background: var(--good-soft); }
.sums { border-top: 2px solid var(--red); padding: 14px 18px 18px; display: grid; gap: 6px; background: var(--card); }
.sum { display: flex; justify-content: space-between; font-family: var(--f-mono); }
.sum.total { font-family: var(--f-display); font-size: 28px; color: var(--red); padding-top: 6px; border-top: 1px solid var(--gold); margin-top: 4px; align-items: baseline; }
.sum.total span:last-child { font-family: var(--f-mono); font-weight: 700; font-size: 24px; }
.sums .btn.big { width: 100%; margin-top: 8px; }

/* Tables */
.tablewrap { overflow-x: auto; border: 2px solid var(--red); background: var(--card); }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--rule); vertical-align: middle; }
th { font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--red); font-weight: 700; background: var(--bg); border-bottom: 2px solid var(--red); }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--gold-soft); }
tr.void td { color: var(--brown); text-decoration: line-through; }
tr.sel td { background: var(--gold-soft); box-shadow: inset 0 0 0 0 transparent; }
tr.sel td:first-child { box-shadow: inset 4px 0 0 var(--red); }

/* Number tiles, like the site's Stats tab */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
.stat { border: 2px solid var(--red); background: var(--card); padding: 14px 16px; display: grid; gap: 2px; }
.stat .label { color: var(--brown); font-size: 11.5px; letter-spacing: 0.12em; }
.stat .v { font-family: var(--f-display); font-size: 32px; line-height: 1.15; color: var(--red); }
.stat .v.warn { color: var(--warn); }

/* Stock grid */
.item-row td:first-child { width: 36%; }
.stockgrid { display: grid; gap: 8px; padding: 6px 0 4px; }
.stockgrid table { width: auto; }
.stockgrid td, .stockgrid th { padding: 6px 8px; border: 0; background: none; }
.stockgrid input { width: 76px; text-align: center; font-family: var(--f-mono); font-weight: 700; min-height: 36px; padding: 4px; }
.stockgrid input.low { border-color: var(--warn); background: var(--warn-soft); }
.stockgrid input.zero { background: var(--bad-soft); }
.expand td { background: var(--bg); }

/* Settings */
.panel { border: 2px solid var(--red); padding: 7px; background: var(--card); box-shadow: 0 6px 18px var(--shade); }
.panel > .in { border: 1px solid var(--gold); padding: 0 20px 20px; display: grid; gap: 14px; }
.panel > .in > .banner { margin: 0 -20px 4px; }
.panel .head { padding-top: 16px; }
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; align-items: start; }
.svc-row { display: grid; grid-template-columns: 1fr 120px auto; gap: 8px; }

/* Dialogs: the site's framed pop-up */
.scrim { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; padding: 20px; z-index: 50; }
.dialog { background: var(--card); border: 2px solid var(--red); padding: 9px; box-shadow: 0 12px 40px rgba(58, 29, 29, 0.45); width: min(580px, 100%); max-height: calc(100vh - 40px); overflow: auto; }
.dialog > .in { border: 1px solid var(--gold); padding: 22px; display: grid; gap: 14px; }
.dialog.wide { width: min(880px, 100%); }
.dialog .foot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; padding-top: 4px; }
.dialog .foot .left { margin-right: auto; }
.choice { display: flex; flex-wrap: wrap; gap: 8px; }
.choice button { border: 2px solid var(--red); background: transparent; color: var(--ink); padding: 8px 14px; cursor: pointer; min-width: 64px; display: inline-flex; align-items: center; gap: 8px; font-family: var(--f-mono); font-weight: 700; font-size: 14px; letter-spacing: 0.06em; }
.choice button small { font-weight: 400; color: var(--brown); }
.choice button[aria-pressed="true"] { background: var(--red); color: var(--bg); }
.choice button[aria-pressed="true"] small { color: var(--gold); }
.choice button[aria-pressed="true"] .dot { box-shadow: 0 0 0 1.5px var(--bg); }
.due { display: flex; align-items: baseline; justify-content: space-between; padding: 14px 18px; background: var(--red); color: var(--bg); }
.due > span:first-child { font-family: var(--f-mono); font-weight: 700; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); }
.due .money { font-size: 32px; font-weight: 700; }
.pays { display: grid; gap: 6px; }
.pay { display: flex; justify-content: space-between; align-items: center; font-family: var(--f-mono); }
.terminal { border: 2px solid var(--gold); padding: 14px 16px; display: grid; gap: 10px; background: var(--gold-soft); }
.readerwait { border-color: var(--red); background: var(--card); justify-items: center; text-align: center; padding: 20px 16px; }
.readerdots { display: flex; gap: 8px; }
.readerdots i { width: 10px; height: 10px; background: var(--red); animation: rdot 1.2s infinite ease-in-out; }
.readerdots i:nth-child(2) { animation-delay: .2s; } .readerdots i:nth-child(3) { animation-delay: .4s; }
@keyframes rdot { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
.readernote { padding: 10px 12px; font-size: 15px; border-left: 4px solid var(--good); background: var(--good-soft); color: var(--ink); text-align: left; }

    const raw = weights.map((w) => (total * w) / sum);
    const out = raw.map(Math.floor);

  // lines: [{ price, qty, disc, taxable }], cartDisc: discount, taxRate: percent
  function totals(lines, cartDisc, taxRate) {
    const gross = lines.map((l) => l.price * l.qty);
    const lineDisc = lines.map((l, i) => discountOf(gross[i], l.disc));
    const afterLine = gross.map((g, i) => g - lineDisc[i]);
    const subAfterLine = afterLine.reduce((a, b) => a + b, 0);
    const cartOff = discountOf(subAfterLine, cartDisc);
    const cartShare = allocate(cartOff, afterLine);
    const net = afterLine.map((a, i) => a - cartShare[i]);
    const rate = Math.max(0, Number(taxRate) || 0);
    const tax = net.map((n, i) => (lines[i].taxable ? Math.round((n * rate) / 100) : 0));
    const paid = net.map((n, i) => n + tax[i]);
    const sum = (a) => a.reduce((x, y) => x + y, 0);
    return {
      subtotal: sum(gross),
      discount: sum(lineDisc) + cartOff,
      tax: sum(tax),
      total: sum(paid),

  // What to give back for returning `qty` of a sold line, given how many were already returned.
  function refundFor(line, qty) {

    if (!q) return 0;
    // Units returned so far and now are paid back proportionally; the last unit absorbs rounding.

  function csvRows(text) {

    const intro = rows.slice(0, h).map((r) => r.join(" ").trim()).filter(Boolean);
    const allTypes = rows[h].slice(1).map((x) => x.trim());
    const codes = [];

<script>// Bespoke Register: the screens. Runs inside the desktop app (window.pos is the bridge to the
// computer) or, without that bridge, as a preview with sample data that is never saved.
(() => {
  const L = window.PosLogic;
  const PREVIEW = !window.pos;
  const pos = window.pos || previewBridge();
  const root = document.getElementById("app");

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const m = L.money;
  const dayOf = (iso) => { const d = new Date(iso); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
  const today = () => dayOf(new Date().toISOString());
  const timeOf = (iso) => new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const dateLong = (iso) => new Date(iso).toLocaleString([], { weekday: "short", month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" });

  let S = null;
  const UI = {
    view: "register",
    cart: [], cartDisc: null, customer: null, credit: null,
    search: "", cat: "All", custQuery: "",
    dialog: null,
    stockOpen: {}, stockFilter: "all", stockSearch: "",
    salesDate: today(),
    retQuery: "", retSale: null, retPick: {}, retRestock: {},
    custQ: "", custSel: null,
  };

  function defaults() {
    return {
      version: 1,
      settings: {
        shopName: "Bespoke Tailoring",
        address: "34 W 8th St, Erie, PA 16501",
        phone: "(814) 860-4797",
        email: "bespoketailoringerie@gmail.com",
        taxRate: 0,
        lowStock: 2,
        receiptFooter: "Thank you for visiting Bespoke Tailoring.",
        paper: "80mm",
        websiteUrl: "https://ilovemisspookie.netlify.app",
        // This computer's key for the website's customer list (POS_APP_KEY in Netlify).
        syncKey: "",
        smtpUser: "bespoketailoringerie@gmail.com",
        smtpPass: "",
        backupFolder: "",
        services: [],
        nextReceipt: 1001,
        nextReturn: 1,
        nextSku: 1,
        labelSize: "roll",
        weekStart: 0,
        // Markup on the made-to-measure price list: percent per garment, a fallback, and rounding.
        markup: { byType: {}, fallback: null, round: "5" },
        // Fixed-price cards at the start of the Register's Custom section.
        fixedCards: [{ name: "Custom Shirt", price: 14900 }],
        // Shop hours by weekday (0 = Sunday); empty means closed.
        hours: ["", "", "11:00-18:00", "11:00-18:00", "11:00-18:00", "11:00-18:00", "10:00-15:00"],
      },
      items: [], customers: [], sales: [], returns: [], stockLog: [],
      staff: [], punches: [], notes: [], drawers: [], shifts: [],
      tags: [], tagSync: null,
      priceList: null,
    };
  }

  function migrate() {
    const d = defaults();
    S.settings = { ...d.settings, ...(S.settings || {}) };
    if (!Array.isArray(S.settings.fixedCards)) S.settings.fixedCards = [{ name: "Custom Shirt", price: 14900 }];
    S.settings.markup = { byType: {}, fallback: null, round: "5", ...(S.settings.markup || {}) };
    if (!S.priceList && window.DEFAULT_PRICE_LIST) S.priceList = JSON.parse(JSON.stringify(window.DEFAULT_PRICE_LIST));
    for (const k of ["items", "customers", "sales", "returns", "stockLog", "staff", "punches", "notes", "drawers", "shifts", "tags"]) if (!Array.isArray(S[k])) S[k] = [];
    if (!S.sync || typeof S.sync !== "object") S.sync = { cursor: null, outbox: [] };
  }

  async function persist() {
    if (S.stockLog.length > 5000) S.stockLog = S.stockLog.slice(-5000);
    try { await pos.save(S); } catch { toast("Couldn't save to this computer. Your last change may not be kept.", true); }
  }

  // ---------- helpers ----------
  const itemById = (id) => S.items.find((i) => i.id === id);
  const colorsOf = (it) => (it.colors && it.colors.length ? it.colors : [null]);
  const keysOf = (it) => it.sizes.flatMap((s) => colorsOf(it).map((c) => L.stockKey(s, c && c.id)));
  const countOf = (it, size, colorId) => Number((it.stock || {})[L.stockKey(size, colorId)] || 0);
  const totalStock = (it) => keysOf(it).reduce((a, k) => a + Number((it.stock || {})[k] || 0), 0);
  const inCart = (itemId, size, colorId) => UI.cart.filter((l) => l.itemId === itemId && l.size === size && (l.colorId || "") === (colorId || "")).reduce((a, l) => a + l.qty, 0);
  const variantName = (it, key) => { const [size, cid] = key.split("|"); const c = (it.colors || []).find((x) => x.id === cid); return [size, c && c.name].filter(Boolean).join(" · "); };
  const domKey = (key) => esc(key).replace(/[^\w-]/g, "_");
  // Find which item, size and color a barcode belongs to. UPC and EAN versions of a code match each other.
  function findCode(code) {
    const n = L.normCode(code);
    if (!n) return null;
    for (const it of S.items) for (const [k, v] of Object.entries(it.skus || {})) if (v && L.normCode(v) === n) return { it, key: k };
    return null;
  }
  function newCode() { let c; do { c = L.itemCode(S.settings.nextSku++); } while (findCode(c)); return c; }
  const isShopCode = (c) => L.isEan13(c) && c[0] === "2";
  function barcodeSvg(code, opts = {}) {
    const mods = L.barcodeModules(code);
    if (!mods) return "";
    const h = opts.h || 46, q = 10, w = mods.length + q * 2, th = opts.text === false ? 0 : 12;
    let rects = "";
    for (let i = 0; i < mods.length; ) {
      if (mods[i] === "1") { let j = i; while (mods[j] === "1") j++; rects += `<rect x="${i + q}" y="0" width="${j - i}" height="${h}"/>`; i = j; } else i++;
    }
    return `<svg class="bc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h + th}" style="width:${opts.width || "100%"};height:auto;display:block;margin:0 auto" shape-rendering="crispEdges" role="img" aria-label="Barcode ${esc(code)}"><rect width="${w}" height="${h + th}" fill="#fff"/><g fill="#000">${rects}</g>${th ? `<text x="${w / 2}" y="${h + 10}" font-family="Courier New, monospace" font-size="10" text-anchor="middle" fill="#000">${esc(code)}</text>` : ""}</svg>`;
  }

  function stockState(it) {
    const keys = keysOf(it);
    const counts = keys.map((k) => Number((it.stock || {})[k] || 0));
    const total = counts.reduce((a, b) => a + b, 0);
    if (total <= 0) return { cls: "bad", text: "Sold out" };
    if (counts.some((c) => c <= 0)) return { cls: "warn", text: "Some sizes out" };
    if (counts.some((c) => c <= S.settings.lowStock)) return { cls: "warn", text: "Running low" };
    return { cls: "good", text: "In stock" };
  }
  function cartTotals() {
    return L.totals(UI.cart.map((l) => ({ price: l.price, qty: l.qty, disc: l.disc, taxable: l.taxable })), UI.cartDisc, S.settings.taxRate);
  }
  const discLabel = (d) => (!d || !d.value ? "" : d.type === "%" ? `${d.value}% off` : `${m(d.value)} off`);
  function logStock(itemId, key, change, reason) { S.stockLog.push({ at: new Date().toISOString(), itemId, key, change, reason }); }

  let toastTimer;
  function toast(msg, bad) {
    let t = document.querySelector(".toast");
    if (!t) { t = document.createElement("div"); document.body.appendChild(t); }
    t.className = "toast" + (bad ? " bad" : "");
    t.setAttribute("role", "status");
    t.textContent = msg;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.remove(), bad ? 6000 : 3200);
  }

  // ---------- receipts ----------
  function receiptBody(rec, forEmail) {
    const s = S.settings;
    const head = `<div class="rc-c"><div class="rc-shop">${esc(s.shopName)}</div><div>${esc(s.address)}</div><div>${esc(s.phone)}</div></div>`;
    const row = (a, b, cls = "") => `<div class="rc-r ${cls}"><span>${a}</span><span>${b}</span></div>`;
    let body = "";
    if (rec.kind === "return") {
      const sale = S.sales.find((x) => x.id === rec.saleId);
      body += `<div class="rc-c rc-b">${rec.type === "exchange" ? "EXCHANGE" : "RETURN"} R-${rec.no}</div>`;
      body += row(dateLong(rec.date), "");
      body += row(`For receipt #${sale ? sale.no : "?"}`, "");
      body += `<div class="rc-hr"></div>`;
      for (const r of rec.lines) {
        const l = sale && sale.lines[r.lineIdx];
        body += row(`${r.qty} × ${esc(l ? l.name : "Item")}`, m(-r.amount));
        if (l && (l.size || l.colorName)) body += `<div class="rc-o">${esc([l.size, l.colorName].filter(Boolean).join(" · "))}${r.restock ? "" : " · not restocked"}</div>`;
      }
      body += `<div class="rc-hr"></div>`;
      body += row("RETURN TOTAL", m(-rec.amount), "rc-b");
      body += rec.type === "exchange" ? row(`Applied to #${rec.exchangeSaleNo || ""}`, m(rec.amount)) : row(`Refunded · ${esc(rec.method)}`, m(rec.amount));
    } else {
      body += row(`Receipt #${rec.no}`, "", "rc-b");
      body += row(dateLong(rec.date), "");
      if (rec.customer && rec.customer.name) body += row(esc(rec.customer.name), "");
      if (rec.staffName) body += row(`Served by ${esc(rec.staffName)}`, "");
      if (rec.voided) body += `<div class="rc-c rc-b">*** VOIDED ***</div>`;
      body += `<div class="rc-hr"></div>`;
      for (const l of rec.lines) {
        body += row(`${l.qty} × ${esc(l.name)}`, m(l.price * l.qty));
        const opts = [l.size, l.colorName].filter(Boolean).join(" · ");
        if (opts) body += `<div class="rc-o">${esc(opts)}</div>`;
        if (l.disc && l.disc.value) body += row(`&nbsp;&nbsp;${esc(discLabel(l.disc))}`, m(-L.discountOf(l.price * l.qty, l.disc)), "rc-o");
        if (l.returned) body += `<div class="rc-o">${l.returned} returned</div>`;
      }
      body += `<div class="rc-hr"></div>`;
      body += row("Subtotal", m(rec.subtotal));
      if (rec.discount) body += row(`Discounts${rec.cartDisc && rec.cartDisc.value ? " (incl. " + esc(discLabel(rec.cartDisc)) + ")" : ""}`, m(-rec.discount));
      if (rec.tax) body += row(`Sales tax ${S.settings.taxRate}%`, m(rec.tax));
      body += row("TOTAL", m(rec.total), "rc-b rc-big");
      body += `<div class="rc-hr"></div>`;
      for (const p of rec.payments) body += row(esc(p.method) + (p.ref ? ` (${esc(p.ref)})` : ""), m(p.amount));
      if (rec.change) body += row("Change", m(rec.change));
    }
    const bc = rec.kind !== "return" && Number.isInteger(rec.no) && !forEmail ? `<div class="rc-bc">${barcodeSvg(L.receiptCode(rec.no), { h: 34, width: codeWidth(L.receiptCode(rec.no)) })}</div>` : "";
    body += bc;
    const foot = s.receiptFooter ? `<div class="rc-hr"></div><div class="rc-c">${esc(s.receiptFooter).replace(/\n/g, "<br>")}</div>` : "";
    return `<div class="rc">${head}<div class="rc-hr"></div>${body}${foot}</div>`;
  }
  const receiptCss = `.rc{font-family:"Courier Prime","Courier New",monospace;font-size:12.5px;line-height:1.4;color:#2a1a12}
    .rc-c{text-align:center}.rc-shop{font-family:Gloock,Georgia,serif;font-size:18px;margin-bottom:2px}
    .rc-r{display:flex;justify-content:space-between;gap:10px}.rc-r span:last-child{white-space:nowrap}
    .rc-o{padding-left:14px;color:#6b5240;font-size:11.5px}.rc-b{font-weight:700}.rc-big{font-size:15px}
    .rc-hr{border-top:1px dashed #8a7360;margin:8px 0}.rc-bc{margin:10px 0 2px}`;
  function receiptDoc(rec, forEmail) {
    const width = S.settings.paper === "letter" ? "360px" : "72mm";
    return `<!doctype html><html><head><meta charset="utf-8"><title>Receipt</title><style>@page{margin:${S.settings.paper === "letter" ? "0.6in" : "3mm"}}body{margin:0;padding:${forEmail ? "24px" : "0"};background:#fff}.wrap{width:${forEmail ? "340px" : width};margin:0 auto}${receiptCss}</style></head><body><div class="wrap">${receiptBody(rec, forEmail)}</div></body></html>`;
  }
  async function printReceipt(rec) {
    if (PREVIEW) return toast("In the installed app, this opens the receipt printer.");
    const r = await pos.printReceipt(receiptDoc(rec), S.settings.paper);
    if (r && r.ok) toast("Sent to the printer.");
    else if (r && r.error) toast(r.error, true);
  }
  async function emailReceipt(rec, to) {
    to = String(to || "").trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to)) return toast("Enter the customer's email address first.", true);
    if (PREVIEW) return toast(`In the installed app, this emails the receipt to ${to}.`);
    toast("Sending…");
    const label = rec.kind === "return" ? `return R-${rec.no}` : `receipt #${rec.no}`;
    const r = await pos.emailReceipt({ to, subject: `Your ${S.settings.shopName} ${label}`, html: receiptDoc(rec, true), user: S.settings.smtpUser, pass: S.settings.smtpPass, fromName: S.settings.shopName });
    if (r && r.ok) {
      toast(`Receipt emailed to ${to}.`);
      rec.emailedTo = to; persist();
    } else toast((r && r.error) || "The receipt wasn't sent.", true);
  }

  // ---------- the website's customer list ----------
  let sync = null;
  let card = null;   // the card reader, through the website (shared/card-pay.js)
  const CARD_PENDING = "bespoke-card-pending";
  function startSync() {
    if (PREVIEW || !window.CustomerSync) return;
    sync = window.CustomerSync.createSync({
      base: S.settings.websiteUrl, key: S.settings.syncKey,
      adapter: {
        customers: () => S.customers,
        addCustomer: (f) => { const c = { id: uid(), created: new Date().toISOString(), source: "website", ...f }; S.customers.push(c); return c; },
        removeCustomer: (c) => { S.customers = S.customers.filter((x) => x !== c); if (UI.customer && UI.customer.id === c.id) UI.customer = null; },
        state: () => S.sync,
        saveState: (st) => { S.sync = st; },
        changed: () => { persist(); linkBadge(); if (UI.view === "customers" && !UI.dialog) render(); },
      },
    });
    startTagSync();
    if (window.CardPay) { card = window.CardPay.createCardPay({ base: S.settings.websiteUrl, key: S.settings.syncKey }); if (S.settings.syncKey) card.check().then(checkCardLeftover); }
    if (S.settings.syncKey) syncAll();
    setInterval(() => { configureSync(); if (S.settings.syncKey) syncAll(); }, 2 * 60 * 1000);
  }
  // Customers first, then the tablet's alteration tags.
  const syncAll = () => (tagSync ? tagSync.syncNow() : sync.syncNow());
  function configureSync() {
    sync.configure({ base: S.settings.websiteUrl, key: S.settings.syncKey });
    if (card && (card._base !== S.settings.websiteUrl || card._key !== S.settings.syncKey)) { card._base = S.settings.websiteUrl; card._key = S.settings.syncKey; card.configure({ base: S.settings.websiteUrl, key: S.settings.syncKey }); if (S.settings.syncKey) card.check(); }
    if (tagSync) tagSync.configure({ base: S.settings.websiteUrl, key: S.settings.syncKey });
  }

  // ---------- alteration tags from the website ----------
  // Tags are written on the tablet. This computer keeps a copy of the website's list so each
  // customer's tags show on the Customers tab (it doesn't change them).
  let tagSync = null;
  function startTagSync() {
    if (!window.TagSync) return;
    tagSync = window.TagSync.createTagSync({
      base: S.settings.websiteUrl, key: S.settings.syncKey, before: () => sync.syncNow(),
      adapter: {
        tags: () => S.tags,
        toWire: () => null,
        fromWire: (w) => { const i = S.tags.findIndex((x) => x.id === w.id); if (i >= 0) S.tags[i] = w; else S.tags.push(w); },
        removeLocal: (id) => { S.tags = S.tags.filter((x) => x.id !== id); },
        state: () => S.tagSync,
        saveState: (st) => { S.tagSync = st; },
        changed: () => { persist(); linkBadge(); if (UI.view === "customers" && !UI.dialog) render(); },
      },
    });
  }
  // The status button at the top of the screen, like the Alterations app.
  const pendingAll = () => (sync ? sync.pending() : 0) + (tagSync ? tagSync.pending() : 0);
  function linkState() {
    if (PREVIEW) return ["", "Customer list"];
    if (!S.settings.syncKey || !sync) return ["", "Connect customer list"];
    const st = sync.status.state, n = pendingAll();
    return st === "ok" ? ["ok", n ? `${n} to send` : "Customer list"] : st === "syncing" ? ["warn", "Syncing…"] : st === "badkey" ? ["bad", "Check key"]
      : st === "offline" ? ["warn", n ? `Offline · ${n} waiting` : "Offline"] : ["warn", "Customer list"];
  }
  function linkBadge() {
    const b = document.getElementById("link-btn"); if (!b) return;
    const [cls, text] = linkState();
    b.className = "linkbtn " + cls; b.innerHTML = `<i></i><span>${esc(text)}</span>`; b.title = text;
    if (UI.dialog && UI.dialog.type === "link") { const l = document.getElementById("lk-status"); if (l) l.innerHTML = linkLine(); }
  }
  function linkLine() {
    if (PREVIEW) return "<b>Connects in the installed app.</b>";
    const st = sync ? sync.status : { state: "off" };
    const when = st.lastOk ? new Date(st.lastOk).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "";
    const line = !S.settings.syncKey ? "Not connected yet." : st.state === "ok" ? `Connected. Last synced at ${when}.` : st.state === "syncing" ? "Syncing now…"
      : st.state === "badkey" || st.state === "offline" ? st.error : "Connected.";
    const n = pendingAll();
    return `<b>${esc(line)}</b>${n ? ` ${n} change${n === 1 ? "" : "s"} waiting to send.` : ""}`;
  }

  const custOf = (snap) => snap && S.customers.find((x) => x.id === snap.id);

  // ---------- render ----------
  const VIEWS = [["register", "Register"], ["customers", "Customers"], ["returns", "Returns"], ["stock", "Stock"], ["sales", "Sales"], ["staff", "Staff"], ["settings", "Settings"]];
  // Height of the header and notice band, so the sale panel can fill the rest of the window.

  }

  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => setChrome());

  function renderDialog() {
    const box = document.getElementById("dlg");
    if (!box) return render();
    box.innerHTML = dialogHtml();
    const f = box.querySelector("[autofocus]");
    if (f) f.focus();
  }
  function rerenderPart(id, html) { const el = document.getElementById(id); if (el) el.innerHTML = html; }
  function tick() {
    const bc = document.getElementById("bigclock"); if (bc) bc.textContent = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    if (document.getElementById("board")) rerenderPart("board", boardHtml());
    const c = document.getElementById("clock"); if (c) c.textContent = innerWidth >= 1500 ? new Date().toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }

  function viewHtml() {
    if (UI.view === "returns") return returnsView();
    if (UI.view === "stock") return stockView();
    if (UI.view === "sales") return salesView();
    if (UI.view === "settings") return settingsView();
    if (UI.view === "staff") return staffView();
    if (UI.view === "customers") return customersView();
    return registerView();
  }

  // ---------- Customers (the tablet's Customers tab, for the shop computer) ----------
  const custName = (c) => (c && (c.name || c.phone || c.email)) || "Customer";
  const phoneDigits = (v) => { const d = String(v ?? "").replace(/\D/g, ""); return d.length === 11 && d[0] === "1" ? d.slice(1) : d; };
  const cleanEmail = (v) => { const e = String(v ?? "").trim().toLowerCase(); return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e) ? e : ""; };
  const salesOf = (c) => S.sales.filter((x) => x.customer && x.customer.id === c.id);
  // A customer's tags: matched by their website id, or by phone/email for a tag whose customer
  // isn't linked to the website list.
  const tagsOf = (c) => S.tags.filter((t) => (t.customerId && c.remoteId && t.customerId === c.remoteId)
    || (!t.customerId && t.customer && ((t.customer.phone && phoneDigits(t.customer.phone) === phoneDigits(c.phone)) || (t.customer.email && c.email && t.customer.email.toLowerCase() === c.email.toLowerCase()))));
  const tagLate = (t) => t.status !== "closed" && t.due && t.due < today();
  function tagDue(t) {
    if (!t.due) return "No due date";
    const d = new Date(t.due + "T12:00"), diff = Math.round((d - new Date(today() + "T12:00")) / 864e5);
    const nice = d.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
    return diff < 0 ? `Overdue · was due ${nice}` : diff === 0 ? `Due today · ${nice}` : diff === 1 ? `Due tomorrow · ${nice}` : `Due ${nice}`;
  }
  function tagCardHtml(t) {
    const [cls, label] = t.status === "closed" ? ["good", "Paid"] : t.status === "register" ? ["warn", "Being paid on the tablet"] : tagLate(t) ? ["bad", "Overdue"] : ["plain", "Open"];
    const fmt = (iso) => new Date(iso).toLocaleDateString([], { month: "short", day: "numeric", year: "numeric" });
    return `<div class="tagcard ${t.status === "closed" ? "closed" : ""}"><div class="in">
        <div class="top"><b>Tag #${t.no || "?"}</b><span class="pill ${cls}">${label}</span>
          ${t.status !== "closed" ? `<span class="small ${tagLate(t) ? "late" : "muted"}">${esc(tagDue(t))}${t.rush ? " · RUSH" : ""}</span>` : ""}
          <span class="money" style="margin-left:auto;font-weight:700">${m(t.total || 0)}${t.status !== "closed" && t.unpriced && t.unpriced.length ? "+" : ""}</span></div>
        <div class="items">${t.lines && t.lines.length ? t.lines.map((l) => esc(`${l.qty > 1 ? l.qty + " × " : ""}${l.name}${l.measure ? " " + l.measure : ""}`)).join(" · ") : '<span class="muted">Nothing ticked yet</span>'}</div>

  const searchBox = (id, kind, value, placeholder) => `<div class="searchbox">

  function customersView() {

  function rosterHtml() {
    return `<div class="find">
        ${searchBox("cust-q", "custlist", UI.custQ, "Find a customer by name or phone")}
        <button class="btn primary" data-act="cust-new-tab">+ New customer</button></div>
      <div class="who-list" id="who-list">${whoListHtml()}</div>`;
  }
  function whoListHtml() {
    const list = custMatches();
    if (!S.customers.length) return `<div class="empty" style="margin:16px">No customers yet. Click <b>New customer</b> to add the first one.</div>`;
    if (!list.length) return `<div class="empty" style="margin:16px">No one matches “${esc(UI.custQ)}”.</div>`;
    return list.map((c) => `<button data-act="cust-sel" data-id="${esc(c.id)}" aria-current="${UI.custSel === c.id}">
        <b>${esc(custName(c))}</b><span class="sub">${esc([c.phone, c.email].filter(Boolean).join(" · "))}</span>
        ${(() => { const n = tagsOf(c).filter((t) => t.status !== "closed").length; return n ? `<span><span class="pill plain">${n} open tag${n === 1 ? "" : "s"}</span></span>` : ""; })()}</button>`).join("");
  }
  // The customer's last visit (a calendar day): the latest of a fitting booked through the website
  // that has happened, a purchase at either register, and an alteration tag paid. Opening a tag doesn't count.
  function lastVisit(c) {
    const days = [];
    if (c.lastBooked) days.push(dayOf(c.lastBooked));
    if (c.lastBought) days.push(String(c.lastBought).slice(0, 10));
    for (const x of salesOf(c)) if (!x.voided && x.date) days.push(dayOf(x.date));
    for (const t of tagsOf(c)) if (t.status === "closed" && t.closedAt) days.push(dayOf(t.closedAt));
    const t0 = today();
    return days.filter((d) => /^\d{4}-\d{2}-\d{2}$/.test(d) && d <= t0).sort().pop() || null;
  }
  function agoText(day) {
    const n = Math.round((new Date(today() + "T12:00") - new Date(day + "T12:00")) / 864e5);
    if (n <= 0) return "today";
    if (n === 1) return "yesterday";
    if (n < 14) return `${n} days ago`;
    if (n < 60) return `${Math.round(n / 7)} weeks ago`;
    if (n < 730) return `${Math.round(n / 30.4)} months ago`;
    return `${Math.round(n / 365)} years ago`;
  }
  function custDetailHtml() {
    const c = S.customers.find((x) => x.id === UI.custSel);
    if (!c) return `<div class="frame"><div class="in">${glyph}
        <h3 style="font-size:24px">${S.customers.length ? "Choose a customer" : "Add your first customer"}</h3>
        <p class="muted" style="margin:0;max-width:46ch">${S.customers.length ? "Pick someone from the list to see their details and what they've bought here." : "Add a customer with a phone number, an email, or both."}</p>
      </div></div>`;
    const mine = salesOf(c).slice().sort((a, b) => (a.date < b.date ? 1 : -1));
    const rets = S.returns.filter((r) => mine.some((x) => x.id === r.saleId));
    const here = mine.filter((x) => !x.voided).reduce((a, x) => a + x.total, 0) - rets.filter((r) => r.type === "refund").reduce((a, r) => a + r.amount, 0);
    const sp = c.spent;
    return `<div class="who-head"><div><span class="label">Customer</span><h2>${esc(custName(c))}</h2>
          <span class="muted">${esc([c.phone, c.email].filter(Boolean).join(" · ")) || "No phone or email yet"}</span>
          ${(() => { const lv = lastVisit(c); return `<span class="lastvisit">${lv ? `Last visit <b>${esc(new Date(lv + "T12:00").toLocaleDateString([], { weekday: "short", month: "short", day: "numeric", year: "numeric" }))}</b> · ${esc(agoText(lv))}` : "No visits yet"}</span>`; })()}
          ${sp && sp.total ? `<div class="spentrow"><span>Spent <b>${m(Math.round(sp.total * 100))}</b></span>${["pos", "tablet", "staff"].filter((k) => sp[k]).map((k) => `<span>${{ pos: "Register", tablet: "Tablet", staff: "Added by hand" }[k]} ${m(Math.round(sp[k] * 100))}</span>`).join("")}${c.visits ? `<span>${c.visits} visit${c.visits === 1 ? "" : "s"}</span>` : ""}</div>`
            : mine.length ? `<div class="spentrow"><span>Spent here <b>${m(here)}</b></span><span>${mine.length} sale${mine.length === 1 ? "" : "s"}</span></div>` : ""}</div>
        <button class="btn ghost" data-act="cust-edit">Edit details</button>
        <button class="btn primary big" style="width:auto" data-act="cust-ring">Start a sale</button></div>
      ${(() => {
        const mine = tagsOf(c).sort((a, b) => (a.status === "closed") - (b.status === "closed") || (a.opened < b.opened ? 1 : -1));
        return `<h3>Alteration tags</h3>${mine.length ? `<div class="tagcards">${mine.map(tagCardHtml).join("")}</div>`
          : `<div class="empty">${S.settings.syncKey || PREVIEW ? "No tags for this customer. Tags are written on the tablet and show here once it syncs." : "Tags written on the tablet show here once this computer is connected to the website's customer list (Settings)."}</div>`}`;
      })()}
      <h3>Purchases on this register</h3>
      ${mine.length ? `<div class="tablewrap"><table><thead><tr><th>Date</th><th>Receipt</th><th>Items</th><th class="r">Total</th><th></th></tr></thead><tbody>${mine.map((x) => `
        <tr class="click ${x.voided ? "void" : ""}" data-act="sale-open" data-id="${x.id}"><td>${new Date(x.date).toLocaleDateString([], { month: "short", day: "numeric", year: "numeric" })}</td><td class="num">#${x.no}</td>
          <td>${esc(x.lines.map((l) => (l.qty > 1 ? l.qty + "× " : "") + l.name).join(", "))}</td><td class="r num">${m(x.total)}</td>
          <td>${x.voided ? '<span class="pill bad">Voided</span>' : x.lines.some((l) => l.returned) ? '<span class="pill warn">Has returns</span>' : ""}</td></tr>`).join("")}</tbody></table></div>`
        : `<div class="empty">No purchases on this register yet. Click <b>Start a sale</b> to ring something up for ${esc(custName(c))}.</div>`}`;
  }
  async function saveCustomerTab() {
    const d = UI.dialog;
    const name = String(d.name || "").trim().slice(0, 120), phone = String(d.phone || "").trim().slice(0, 40);
    const rawEmail = String(d.email || "").trim(), email = cleanEmail(rawEmail);
    if (rawEmail && !email) return toast("That email address doesn't look right.", true);
    if (phone && (phoneDigits(phone).length < 7 || phoneDigits(phone).length > 15)) return toast("That phone number doesn't look right.", true);
    if (!email && !phone) return toast("Give a phone number, an email, or both.", true);
    // The same person shouldn't be on the list twice.
    const other = S.customers.find((c) => c.id !== d.id && ((email && c.email === email) || (phone && phoneDigits(c.phone) === phoneDigits(phone))));
    if (other) {
      if (d.id) return toast(`That ${email && other.email === email ? "email" : "phone number"} already belongs to ${custName(other)}.`, true);
      UI.dialog = null; UI.custSel = other.id; render();
      return toast(`${custName(other)} is already on the list.`);
    }
    let c = d.id && S.customers.find((x) => x.id === d.id);
    if (!c) { c = { id: uid(), created: new Date().toISOString(), source: "pos" }; S.customers.push(c); }
    Object.assign(c, { name, phone, email });
    if (UI.customer && UI.customer.id === c.id) UI.customer = c;
    UI.dialog = null; UI.custSel = c.id; UI.custQ = "";
    if (sync) sync.touched(c);
    await persist(); render();
    toast(d.id ? "Saved." : `${custName(c)} added.`);
  }

  // ---------- Register ----------
  function registerView() {
    const cats = ["All", ...[...new Set(S.items.filter((i) => i.active !== false).map((i) => i.category).filter(Boolean))].sort()];
    const svc = S.settings.services || [];
    return `<div class="counter">

        </div>
        ${UI.cat === CUSTOM ? `<div class="find plfind"><input type="search" id="plfind" placeholder="Find a price code, or a garment like Shirt or 3 Piece" value="${esc(UI.plSearch || "")}" data-in="plsearch" autocomplete="off" spellcheck="false">
          <span class="small muted" id="plcount">${plCountText()}</span></div>
          ${unmarked().length ? `<div class="plwarn"><b>No markup set for ${esc(unmarked().join(", "))}.</b> Those prices are still the supplier's cost. Set markups in Settings, under Made-to-measure price list.</div>` : ""}` : ""}
        <div class="tags" id="tags">${tagsHtml()}</div>

    </div>`;
  }
  const CUSTOM = "__custom";
  // The Custom filter: one card per price code from the made-to-measure price list.
  function plMatches() {
    const pl = S.priceList;
    if (!pl) return { list: [], type: null };
    const words = String(UI.plSearch || "").trim().toLowerCase().split(/\s+/).filter(Boolean);
    let type = null;
    const typeWords = [];
    // words that name a garment type pick that type ("shirt", "3 piece", "suit + pant")
    const typeHit = pl.types.slice().sort((a, b) => b.length - a.length).find((t) => { const tw = t.toLowerCase(); const joined = words.join(" "); return joined.includes(tw) || (words.length && words.every((w) => tw.includes(w))); });
    if (typeHit) { type = typeHit; for (const w of words) if (typeHit.toLowerCase().includes(w)) typeWords.push(w); }
    const codeWords = words.filter((w) => !typeWords.includes(w));
    let list = pl.codes.filter((c) => codeWords.every((w) => c.code.toLowerCase().includes(w)) && (!type || c.prices[type] != null));
    if (codeWords.length === 1) { const w = codeWords[0]; list = list.sort((a, b) => (a.code.toLowerCase() === w ? -2 : a.code.toLowerCase().startsWith(w) ? -1 : 0) - (b.code.toLowerCase() === w ? -2 : b.code.toLowerCase().startsWith(w) ? -1 : 0)); }
    return { list, type };
  }
  const markupFor = (type) => { const mk = S.settings.markup; const v = mk.byType[type]; return v != null && v !== "" ? Number(v) : mk.fallback != null && mk.fallback !== "" ? Number(mk.fallback) : null; };
  const sellPrice = (cost, type) => L.retailPrice(cost, markupFor(type) || 0, S.settings.markup.round);
  const unmarked = () => (S.priceList ? S.priceList.types.filter((t) => markupFor(t) == null) : []);
  const plCountText = () => { const pl = S.priceList; if (!pl) return ""; const n = plMatches().list.length; const f = fixedMatches().length; return `${f ? `${f} set-price card${f === 1 ? "" : "s"} · ` : ""}${n} of ${pl.codes.length} price codes · ${esc(pl.name)}${pl.updated ? " · updated " + esc(pl.updated) : ""}`; };
  function plType(c, preferred) {
    const t = UI.plSel && UI.plSel[c.code];
    if (t && c.prices[t] != null) return t;
    if (preferred && c.prices[preferred] != null) return preferred;
    return S.priceList.types.find((x) => c.prices[x] != null) || null;
  }
  function fixedMatches() {
    const words = String(UI.plSearch || "").trim().toLowerCase().split(/\s+/).filter(Boolean);
    return (S.settings.fixedCards || []).map((f, i) => [f, i]).filter(([f]) => f.name && f.price > 0 && words.every((w) => f.name.toLowerCase().includes(w)));
  }
  function customTagsHtml() {
    const fixed = fixedMatches().map(([f, i]) => `<div class="tag pl fixed"><div class="in">
        <span class="cat">Set price</span><span class="nm">${esc(f.name)}</span>
        <span class="bottom"><span class="price">${m(f.price)}</span><button class="btn small primary" data-act="fixed-add" data-i="${i}">Add</button></span>
      </div></div>`).join("");
    const pl = S.priceList;
    if (!pl) return fixed + `<div class="empty" style="grid-column:1/-1">No price list yet. Bring one in from <b>Settings</b>, under Made-to-measure price list.</div>`;
    const { list, type } = plMatches();
    if (!list.length) return fixed || `<div class="empty" style="grid-column:1/-1">No price codes match “${esc(UI.plSearch)}”.</div>`;
    return fixed + list.map((c) => {
      const types = pl.types.filter((t) => c.prices[t] != null);
      const sel = plType(c, type);
      const id = c.code.replace(/[^\w-]/g, "_");
      return `<div class="tag pl ${types.length ? "" : "out"}"><div class="in">
        <span class="cat">Price code</span><span class="nm code">${esc(c.code)}</span>
        ${types.length ? `<select id="pl-${id}" data-in="pl-type" data-c="${esc(c.code)}" aria-label="Garment for price code ${esc(c.code)}">${types.map((t) => `<option value="${esc(t)}" ${t === sel ? "selected" : ""}>${esc(t)} · ${m(sellPrice(c.prices[t], t))}</option>`).join("")}</select>
          <span class="bottom"><span class="price" id="plp-${id}">${m(sellPrice(c.prices[sel], sel))}</span><button class="btn small primary" data-act="pl-add" data-c="${esc(c.code)}">Add</button></span>`
          : `<span class="small muted">No prices on this list</span>`}
      </div></div>`;
    }).join("");
  }
  function tagsHtml() {
    const q = UI.search.trim().toLowerCase();
    if (UI.cat === CUSTOM) return customTagsHtml();
    const list = S.items.filter((i) => i.active !== false && (UI.cat === "All" || i.category === UI.cat) && (!q || `${i.name} ${i.category} ${Object.values(i.skus || {}).join(" ")}`.toLowerCase().includes(q)));

  function itemTag(it) {
    {
      const n = totalStock(it);

      return `<button class="tag ${n <= 0 ? "out" : ""}" data-act="pick" data-id="${it.id}"><span class="in">

      <div class="top"><h2 class="banner">Current sale</h2><div class="tools">

      ${activeStaff().length ? `<div class="who"><label class="row small" style="gap:10px"><span class="label">Sold by</span><select id="clerk" data-in="clerk" style="flex:1;min-height:36px;padding:4px 8px">${clerkOptions()}</select></label></div>` : ""}

            <div class="amt">${off ? `<s>${m(gross)}</s>` : ""}${m(gross - off)}</div>
            <div class="ctl"><span class="qty"><button data-act="line-dec" data-i="${i}" aria-label="One fewer">−</button><span>${l.qty}</span><button data-act="line-inc" data-i="${i}" aria-label="One more">+</button></span>
              <button class="btn small ghost" data-act="line-disc" data-i="${i}">Discount</button>
              <button class="btn small ghost danger" data-act="line-del" data-i="${i}" style="margin-left:auto">Remove</button></div></div>`;
        }).join("") : `<div class="empty" style="margin:16px 18px">Tap an item tag to add it to the sale.</div>`}
      </div>
      <div class="sums">
        <div class="sum"><span>Subtotal</span><span>${m(t.subtotal)}</span></div>
        ${t.discount ? `<div class="sum"><span>Discounts${UI.cartDisc && UI.cartDisc.value ? " · " + esc(discLabel(UI.cartDisc)) + " on sale" : ""}</span><span>${m(-t.discount)}</span></div>` : ""}
        ${S.settings.taxRate ? `<div class="sum"><span>Sales tax ${S.settings.taxRate}%</span><span>${m(t.tax)}</span></div>` : ""}
        ${credit ? `<div class="sum"><span>Exchange credit</span><span>${m(-credit)}</span></div>` : ""}
        <div class="sum total"><span>${due < 0 ? "To give back" : "Total"}</span><span>${m(Math.abs(due))}</span></div>
        <button class="btn primary big" data-act="charge" ${UI.cart.length || UI.credit ? "" : "disabled"}>${due < 0 ? "Finish exchange" : due === 0 && UI.cart.length ? "Finish sale" : `Take payment · ${m(Math.max(0, due))}`}</button>
      </div>`;
  }

  // ---------- dialogs ----------
  function dialogHtml() {

    const wrap = (inner, wide) => `<div class="scrim" data-act="scrim"><div class="dialog ${wide ? "wide" : ""}" role="dialog" aria-modal="true"><div class="in">${inner}</div></div></div>`;
