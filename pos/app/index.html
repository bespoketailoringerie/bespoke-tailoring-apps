    if (d.type === "pick") {
      const it = itemById(d.itemId);
      const cols = colorsOf(it);
      const left = countOf(it, d.size, d.colorId) - inCart(it.id, d.size, d.colorId);
      return wrap(`<div><span class="label">${esc(it.category || "Item")}</span><h2>${esc(it.name)}</h2><div class="money" style="font-size:20px">${m(it.price)}</div></div>
        <div class="grid" style="display:grid;gap:8px"><span class="label">Size</span><div class="choice">${it.sizes.map((s) => {
          const n = cols.reduce((a, c) => a + countOf(it, s, c && c.id), 0);
          return `<button data-act="pick-size" data-s="${esc(s)}" aria-pressed="${d.size === s}">${esc(s)} <small>${n}</small></button>`;
        }).join("")}</div></div>
        ${it.colors && it.colors.length ? `<div style="display:grid;gap:8px"><span class="label">Color</span><div class="choice">${it.colors.map((c) => `<button data-act="pick-color" data-c="${esc(c.id)}" aria-pressed="${d.colorId === c.id}"><i class="dot" style="background:${esc(c.hex)}"></i>${esc(c.name)} <small>${d.size ? countOf(it, d.size, c.id) : ""}</small></button>`).join("")}</div></div>` : ""}
        <div class="row"><span class="label">Quantity</span><span class="qty"><button data-act="pick-qty" data-d="-1" aria-label="One fewer">−</button><span>${d.qty}</span><button data-act="pick-qty" data-d="1" aria-label="One more">+</button></span>
          ${d.size && (!it.colors.length || d.colorId) ? `<span class="pill ${left - d.qty < 0 ? "bad" : left - d.qty <= S.settings.lowStock ? "warn" : "good"}">${Math.max(0, left)} available</span>` : ""}</div>
        ${d.size && (!it.colors.length || d.colorId) && left - d.qty < 0 ? `<p class="small" style="margin:0;color:var(--bad)">The stock count says there aren't enough of these. You can still sell it; the count will go below zero so you can fix it on the Stock screen.</p>` : ""}
        <div class="foot"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="pick-add" ${d.size && (!it.colors.length || d.colorId) ? "" : "disabled"}>Add to sale</button></div>`);
    }
    if (d.type === "custom") {
      return wrap(`<h2>Custom amount</h2><p class="muted" style="margin:0">For alterations, deposits, or anything not on the Stock list. It doesn't change any stock count.</p>
        <label class="f"><span>Description</span><input type="text" id="cu-name" value="${esc(d.name)}" data-in="dlg" data-k="name" placeholder="e.g. Hem trousers" autofocus></label>
        <div class="grid2"><label class="f"><span>Price</span><input type="text" id="cu-price" inputmode="decimal" value="${esc(d.price)}" data-in="dlg" data-k="price" placeholder="0.00"></label>
        <label class="f"><span>Quantity</span><input type="number" id="cu-qty" min="1" value="${esc(d.qty)}" data-in="dlg" data-k="qty"></label></div>
        <label class="row small"><input type="checkbox" id="cu-tax" data-in="dlg" data-k="taxable" ${d.taxable ? "checked" : ""}> Charge sales tax on this</label>
        <div class="foot"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="custom-add">Add to sale</button></div>`);
    }
    if (d.type === "disc") {
      const base = d.target === "cart" ? null : UI.cart[d.target];
      return wrap(`<h2>${d.target === "cart" ? "Discount the whole sale" : "Discount " + esc(base.name)}</h2>
        <div class="row"><div class="seg"><button data-act="disc-type" data-t="%" aria-pressed="${d.dtype === "%"}">Percent</button><button data-act="disc-type" data-t="$" aria-pressed="${d.dtype === "$"}">Dollars</button></div>
        <input type="text" id="disc-v" inputmode="decimal" style="max-width:140px" value="${esc(d.value)}" data-in="dlg" data-k="value" placeholder="${d.dtype === "%" ? "10" : "5.00"}" autofocus></div>
        <div class="chips">${(d.dtype === "%" ? ["10", "15", "20", "25", "50"] : ["5", "10", "20", "25"]).map((v) => `<button class="chip" data-act="disc-quick" data-v="${v}">${d.dtype === "%" ? v + "%" : "$" + v}</button>`).join("")}</div>
        <div class="foot"><button class="btn ghost left" data-act="disc-clear">Remove discount</button><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="disc-apply">Apply</button></div>`);
    }
    if (d.type === "link") {
      return wrap(`<h2>Customer list</h2>
        <p class="muted" style="margin:0">Connects this computer to the website's customer list. Customers added here and sales for a customer go to the website, credited to the POS; customers from Calendly, the staff page and the tablet come back, along with the tablet's alteration tags. It keeps working offline and catches up when the internet is back.</p>
        <p style="margin:0" id="lk-status">${linkLine()}</p>
        <label class="f"><span>This computer's key</span><input type="password" id="lk-key" value="${esc(d.key)}" data-in="dlg" data-k="key" autocomplete="off" spellcheck="false" placeholder="POS_APP_KEY from Netlify"></label>
        <label class="f"><span>Website address</span><input type="text" id="lk-base" value="${esc(d.base)}" data-in="dlg" data-k="base" autocomplete="off" spellcheck="false"></label>
        <div class="foot">${S.settings.syncKey ? `<button class="btn ghost left" data-act="link-off">Disconnect</button>` : ""}<button class="btn" data-act="close">Close</button>
          ${S.settings.syncKey ? `<button class="btn" data-act="sync-now">Sync now</button>` : ""}<button class="btn primary" data-act="link-save">${S.settings.syncKey ? "Save" : "Connect"}</button></div>`);
    }
    if (d.type === "custtab") {
      return wrap(`<h2>${d.id ? "Edit customer" : "New customer"}</h2>
        <label class="f"><span>Name</span><input type="text" id="ct-name" value="${esc(d.name)}" data-in="dlg" data-k="name" autocomplete="off" autofocus></label>
        <div class="grid2"><label class="f"><span>Phone</span><input type="tel" id="ct-phone" value="${esc(d.phone)}" data-in="dlg" data-k="phone" autocomplete="off"></label>
        <label class="f"><span>Email (for receipts)</span><input type="email" id="ct-email" value="${esc(d.email)}" data-in="dlg" data-k="email" autocomplete="off"></label></div>
        <p class="muted small" style="margin:0">Give a phone number, an email, or both.</p>
        <div class="foot"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="custtab-save">${d.id ? "Save" : "Add customer"}</button></div>`);
    }
    if (d.type === "cust") {
      return wrap(`<h2>New customer</h2>
        <label class="f"><span>Name</span><input type="text" id="cs-name" value="${esc(d.name)}" data-in="dlg" data-k="name" autofocus></label>
        <div class="grid2"><label class="f"><span>Email (for receipts)</span><input type="email" id="cs-email" value="${esc(d.email)}" data-in="dlg" data-k="email"></label>
        <label class="f"><span>Phone</span><input type="tel" id="cs-phone" value="${esc(d.phone)}" data-in="dlg" data-k="phone"></label></div>
        <div class="foot"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="cust-save">Add customer</button></div>`);
    }
    if (d.type === "pay") return wrap(payHtml(d));
    if (d.type === "receipt") {
      const rec = d.kind === "return" ? S.returns.find((x) => x.id === d.id) : S.sales.find((x) => x.id === d.id);
      const cust = rec.kind === "return" ? (S.sales.find((x) => x.id === rec.saleId) || {}).customer : rec.customer;
      const canVoid = rec.kind !== "return" && !rec.voided && !rec.lines.some((l) => l.returned) && !rec.payments.some((p) => p.method === "Exchange credit");
      return wrap(`<div class="receipt-view"><div class="slip">${receiptBody(rec)}</div>
        <div style="display:grid;gap:14px;align-content:start">
          ${d.fresh ? `<div><span class="label">${rec.kind === "return" ? "Return recorded" : "Sale complete"}</span><h2>${rec.kind === "return" ? `Return R-${rec.no}` : `Receipt #${rec.no}`}</h2>${rec.change ? `<p class="due" style="margin:8px 0 0"><span>Change due</span><span class="money">${m(rec.change)}</span></p>` : ""}</div>`
            : `<div><span class="label">${dateLong(rec.date)}</span><h2>${rec.kind === "return" ? `Return R-${rec.no}` : `Receipt #${rec.no}`}</h2>${rec.voided ? '<span class="pill bad">Voided</span>' : ""}</div>`}
          <button class="btn" data-act="rc-print">Print receipt</button>
          <div style="display:grid;gap:6px"><label class="f"><span>Email receipt to</span><input type="email" id="rc-to" value="${esc(d.to ?? (cust && cust.email) ?? "")}" data-in="dlg" data-k="to" placeholder="customer@example.com"></label>
            <button class="btn" data-act="rc-email">Email receipt</button>${rec.emailedTo ? `<span class="small muted">Last emailed to ${esc(rec.emailedTo)}</span>` : ""}</div>
          ${!d.fresh && rec.kind !== "return" && !rec.voided ? `<div class="row"><button class="btn" data-act="rc-return">Return or exchange items</button>${canVoid ? `<button class="btn ghost danger" data-act="rc-void">Void sale</button>` : ""}</div>` : ""}
          <div class="foot">${d.fresh ? `<button class="btn primary" data-act="close">Start next sale</button>` : `<button class="btn" data-act="close">Close</button>`}</div>
        </div></div>`, true);
    }
    if (d.type === "confirm") {
      return wrap(`<h2>${esc(d.title)}</h2><p style="margin:0">${d.text}</p>
        <div class="foot"><button class="btn" data-act="close">Keep it</button><button class="btn primary" data-act="confirm-yes">${esc(d.yes)}</button></div>`);
    }
    if (d.type === "refund") {
      const sale = S.sales.find((x) => x.id === UI.retSale);
      const paidBy = [...new Set(sale.payments.filter((p) => p.amount > 0).map((p) => p.method))];
      return wrap(`<h2>Refund ${m(d.amount)}</h2><p class="muted" style="margin:0">Receipt #${sale.no} was paid by ${esc(paidBy.join(" and ") || "—")}.</p>
        <div class="choice">${["Card", "Cash", "Check", "Other"].map((x) => `<button data-act="rf-method" data-m="${x}" aria-pressed="${d.method === x}">${x === "Card" ? "Back to card" : x}</button>`).join("")}</div>
        ${d.method === "Card" && refundByReader(sale, d) ? `<div class="terminal"><span class="label">Back to the card${card.state.test ? ` <span class="pill plain">Test mode</span>` : ""}</span><span class="money">${m(d.amount)}</span>
            <span>Goes back to ${esc(readerRefundable(sale).map((x) => window.CardPay.describe(x.p.reader) || "the card").join(" and "))}. The customer doesn't need the card.</span>
            <span class="small muted">Rather do it on the reader? <button class="btn small ghost" data-act="rf-manual">Record a refund done on the reader</button></span></div>`
          : d.method === "Card" ? `<div class="terminal"><span class="label">On the card terminal</span><span>Run a refund for</span><span class="money">${m(d.amount)}</span><span class="small">When the terminal shows it's done, record it here.</span></div>` : ""}
        ${d.rfNote ? `<div class="readernote bad" role="status">${esc(d.rfNote)}</div>` : ""}
        ${d.method === "Cash" ? `<div class="terminal"><span class="label">From the drawer</span><span>Give the customer</span><span class="money">${m(d.amount)}</span></div>` : ""}
        <label class="f"><span>Note (optional)</span><input type="text" id="rf-note" value="${esc(d.note)}" data-in="dlg" data-k="note" placeholder="Reason for the return"></label>
        <div class="foot"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="rf-done" ${d.refunding ? "disabled" : ""}>${d.method === "Card" && refundByReader(sale, d) ? (d.refunding ? "Refunding…" : `Refund ${m(d.amount)} to the card`) : "Record refund"}</button></div>`);
    }
    if (d.type === "item") return wrap(itemFormHtml(d), true);
    if (d.type === "assign") {
      const it = d.itemId && itemById(d.itemId);
      const ready = it && d.size && (!(it.colors || []).length || d.colorId);
      const existing = ready && (it.skus || {})[L.stockKey(d.size, d.colorId)];
      return wrap(`<div><span class="label">New barcode</span><h2 class="num">${esc(d.code)}</h2></div>
        <p style="margin:0">This barcode isn't saved to an item yet. Which item, size and color is it on?</p>
        <label class="f"><span>Item</span><select id="as-item" data-in="as-item"><option value="">Choose an item…</option>${S.items.map((i) => `<option value="${i.id}" ${d.itemId === i.id ? "selected" : ""}>${esc(i.name)}${i.category ? " · " + esc(i.category) : ""}</option>`).join("")}</select></label>
        ${it ? `<div style="display:grid;gap:8px"><span class="label">Size</span><div class="choice">${it.sizes.map((sz) => `<button data-act="as-size" data-s="${esc(sz)}" aria-pressed="${d.size === sz}">${esc(sz)}</button>`).join("")}</div></div>
          ${(it.colors || []).length ? `<div style="display:grid;gap:8px"><span class="label">Color</span><div class="choice">${it.colors.map((c) => `<button data-act="as-color" data-c="${esc(c.id)}" aria-pressed="${d.colorId === c.id}"><i class="dot" style="background:${esc(c.hex)}"></i>${esc(c.name)}</button>`).join("")}</div></div>` : ""}` : ""}
        ${existing ? `<p class="small" style="margin:0;color:var(--warn)">This size and color already has barcode ${esc(existing)}. Saving replaces it.</p>` : ""}
        <div class="foot"><button class="btn ghost left" data-act="as-new">Add as a new item</button><button class="btn" data-act="close">Cancel</button>
          <button class="btn primary" data-act="as-save" ${ready ? "" : "disabled"}>${UI.view === "register" ? "Save and add to sale" : "Save barcode"}</button></div>`);
    }
    if (d.type === "labels") {
      const it = itemById(d.itemId);
      const keys = keysOf(it).filter((k) => (it.skus || {})[k]);
      const total = keys.reduce((a, k) => a + (d.qty[k] || 0), 0);
      const size = S.settings.labelSize === "sheet" ? "sheet" : "roll";
      return wrap(`<div><span class="label">Barcode labels</span><h2>${esc(it.name)}</h2></div>
        <div class="seg">${Object.entries(LABEL_SIZES).map(([k, t]) => `<button data-act="lbl-size" data-v="${k}" aria-pressed="${size === k}">${t}</button>`).join("")}</div>
        <div class="tablewrap"><table><thead><tr><th>Size &amp; color</th><th>Barcode</th><th class="r">On hand</th><th class="r">Labels</th></tr></thead><tbody>${keys.map((k) => {
          const [sz, cid] = k.split("|");
          return `<tr><td>${esc(variantName(it, k))}</td><td class="num small">${esc(it.skus[k])}</td><td class="r num">${countOf(it, sz, cid)}</td>
            <td class="r"><input type="number" min="0" max="500" id="lbl-${domKey(k)}" style="width:80px;text-align:center" class="num" value="${d.qty[k] || 0}" data-in="lbl-qty" data-k="${esc(k)}"></td></tr>`;
        }).join("")}</tbody></table></div>
        <div class="row" style="align-items:start"><span class="label">Sample</span><div style="width:2.25in;height:${size === "sheet" ? "1in" : "1.25in"};border:1px dashed var(--rule);background:#fff;padding:0.07in 0.1in;box-sizing:border-box;display:flex">${keys.length ? labelHtml(it, keys[0], size).replace('class="lbl"', 'class="lbl" style="width:100%"') : ""}</div></div>
        <div class="foot"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="lbl-print" ${total ? "" : "disabled"}>Print ${total} label${total === 1 ? "" : "s"}</button></div>`, true);
    }
    return "";
  }

  function payHtml(d) {
    const t = cartTotals();
    const credit = UI.credit ? UI.credit.amount : 0;
    const total = t.total - credit;
    if (total < 0) {
      return `<h2>Give back ${m(-total)}</h2><p class="muted" style="margin:0">The returned items were worth more than the new ones.</p>
        <div class="choice">${["Card", "Cash"].map((x) => `<button data-act="pay-method" data-m="${x}" aria-pressed="${d.method === x}">${x === "Card" ? "Back to card" : "Cash"}</button>`).join("")}</div>
        <div class="terminal">${d.method === "Card" ? `<span class="label">On the card terminal</span><span>Run a refund for</span>` : `<span class="label">From the drawer</span><span>Give the customer</span>`}<span class="money">${m(-total)}</span></div>
        <div class="foot"><button class="btn" data-act="close">Back</button><button class="btn primary" data-act="pay-finish">Finish exchange</button></div>`;
    }
    const st = L.paymentState(total, d.payments);
    const amt = L.toCents(d.amount);
    const lineBtn = (x) => `<button data-act="pay-method" data-m="${x}" aria-pressed="${d.method === x}">${x}</button>`;
    let entry = "";
    if (st.due > 0) {
      if (d.method === "Card" && d.reader) entry = readerWaitHtml(d);
      else if (d.method === "Card" && readerOn(d)) entry = `<div class="terminal"><span class="label">Card reader${card.state.test ? ` <span class="pill plain">Test mode · no money moves</span>` : ""}</span>
          <div class="row"><input type="text" id="pay-amt" inputmode="decimal" style="max-width:160px;font-size:20px" class="money" value="${esc(d.amount)}" data-in="dlg" data-k="amount"><span class="small muted">Change it to split the payment.</span></div>
          <div class="row"><button class="btn primary" data-act="reader-send" id="reader-send" style="min-height:56px;font-size:15px">Send ${m(Math.min(amt, st.due) || st.due)} to the card reader</button></div>
          <span class="small muted">Reader not working? <button class="btn small ghost" data-act="reader-manual">Key it in on the reader instead</button></span></div>`;
      else if (d.method === "Card") entry = `<div class="terminal"><span class="label">On the card terminal</span><span>Key in this amount and have the customer tap or insert their card</span>
          <div class="row"><input type="text" id="pay-amt" inputmode="decimal" style="max-width:160px;font-size:20px" class="money" value="${esc(d.amount)}" data-in="dlg" data-k="amount"><span class="small muted">Change it to split the payment.</span></div>
          <label class="f"><span>Approval code (optional)</span><input type="text" id="pay-ref" style="max-width:220px" value="${esc(d.ref)}" data-in="dlg" data-k="ref"></label>
          <div class="row"><button class="btn gold" data-act="pay-add">Approved on the terminal</button><button class="btn ghost" data-act="pay-declined">Declined</button></div>
          ${card && card.state.ready && d.manual ? `<span class="small muted"><button class="btn small ghost" data-act="reader-auto">Send it to the card reader instead</button></span>` : ""}</div>`;
      else if (d.method === "Cash") {
        const quick = [...new Set([st.due, Math.ceil(st.due / 500) * 500, Math.ceil(st.due / 1000) * 1000, Math.ceil(st.due / 2000) * 2000, Math.ceil(st.due / 5000) * 5000, Math.ceil(st.due / 10000) * 10000])].filter((v) => v >= st.due).slice(0, 5);
        entry = `<div class="terminal"><span class="label">Cash received</span>
          <div class="chips">${quick.map((v) => `<button class="chip" data-act="cash-quick" data-v="${v}">${v === st.due ? "Exact " : ""}${m(v)}</button>`).join("")}</div>
          <div class="row"><input type="text" id="pay-amt" inputmode="decimal" style="max-width:160px;font-size:20px" class="money" value="${esc(d.amount)}" data-in="dlg" data-k="amount" placeholder="0.00" autofocus>
          ${amt > st.due ? `<span class="pill good">Change ${m(amt - st.due)}</span>` : ""}</div>
          <div class="row"><button class="btn gold" data-act="pay-add" ${amt > 0 ? "" : "disabled"}>Take cash</button></div></div>`;
      } else entry = `<div class="terminal"><span class="label">${d.method === "Check" ? "Check" : "Other payment"}</span>
          <div class="row"><input type="text" id="pay-amt" inputmode="decimal" style="max-width:160px;font-size:20px" class="money" value="${esc(d.amount)}" data-in="dlg" data-k="amount">
          <input type="text" id="pay-ref" style="max-width:240px" value="${esc(d.ref)}" data-in="dlg" data-k="ref" placeholder="${d.method === "Check" ? "Check number" : "What was it? e.g. gift certificate"}"></div>
          <div class="row"><button class="btn gold" data-act="pay-add" ${amt > 0 ? "" : "disabled"}>Record payment</button></div></div>`;
    }
    return `<div class="due"><span>${st.due > 0 ? (d.payments.length ? "Still to pay" : "Amount due") : "Paid in full"}</span><span class="money">${m(st.due)}</span></div>
      ${d.payments.length || credit ? `<div class="pays">${credit ? `<div class="pay"><span>Exchange credit · #${UI.credit.saleNo}</span><span>${m(credit)}</span></div>` : ""}${d.payments.map((p, i) => `<div class="pay"><span>${esc(p.method)}${p.ref ? ` (${esc(p.ref)})` : ""} ${p.reader ? `<button class="btn small ghost" data-act="pay-void-reader" data-i="${i}" ${d.reader ? "disabled" : ""}>Void card charge</button>` : `<button class="btn small ghost" data-act="pay-remove" data-i="${i}" ${d.reader ? "disabled" : ""}>Undo</button>`}</span><span>${m(p.amount)}</span></div>`).join("")}
        ${d.change ? `<div class="pay"><b>Change due</b><b>${m(d.change)}</b></div>` : ""}</div>` : ""}
      ${readerNoteHtml(d)}
      ${st.due > 0 ? `<div class="choice">${["Card", "Cash", "Check", "Other"].map((x) => lineBtn(x).replace("<button ", `<button ${d.reader ? "disabled " : ""}`)).join("")}</div>${entry}` : ""}
      <div class="foot"><button class="btn" data-act="close" ${d.reader ? "disabled" : ""}>Back to sale</button><button class="btn primary" data-act="pay-finish" ${st.due > 0 || d.reader ? "disabled" : ""}>Finish sale</button></div>`;
  }

  // ---------- the card reader ----------
  const payTotal = () => cartTotals().total - (UI.credit ? UI.credit.amount : 0);
  const readerOn = (d) => !!(card && card.state.ready && S.settings.syncKey && !d.manual);
  const readerNoteHtml = (d) => d.readerNote ? `<div class="readernote ${d.readerNote.bad ? "bad" : "good"}" role="status">${esc(d.readerNote.text)}</div>` : "";
  function readerWaitHtml(d) {
    const r = d.reader;
    return `<div class="terminal readerwait" id="readerwait"><span class="label">On the card reader${card.state.test ? ` <span class="pill plain">Test mode</span>` : ""}</span>
      <span class="money" style="font-size:38px">${m(r.amount)}</span>
      <span style="font-size:17px">${r.sending ? "Sending to the reader…" : r.canceling ? "Canceling…" : "Have the customer tap, insert or swipe their card on the reader."}</span>
      <span class="readerdots" aria-hidden="true"><i></i><i></i><i></i></span>
      ${r.warn ? `<span class="small" style="color:var(--red)">${esc(r.warn)} Still trying…</span>` : ""}
      ${r.stale ? `<div class="readernote bad">Still no answer after ${Math.round((Date.now() - r.at) / 60000)} minutes. Look at the reader screen. If it says approved, click Check again. If nothing is happening, click Stop waiting.</div>
        <div class="row"><button class="btn" data-act="reader-check">Check again</button><button class="btn ghost" data-act="reader-stop">Stop waiting</button></div>`
        : `<div class="row"><button class="btn" data-act="reader-cancel" ${r.sending || r.canceling ? "disabled" : ""}>Cancel</button></div>`}
    </div>`;
  }
  const pendingSave = (r) => { try { localStorage.setItem(CARD_PENDING, JSON.stringify({ id: r.id, amount: r.amount, at: r.at })); } catch {} };
  const pendingClear = () => { try { localStorage.removeItem(CARD_PENDING); } catch {} };
  let readerWatch = null, readerStaleTimer = null;
  function readerStopWatching() { if (readerWatch) readerWatch.stop(); readerWatch = null; clearTimeout(readerStaleTimer); }
  function readerWatchStart(d) {
    readerStopWatching();
    const id = d.reader.id;
    readerWatch = card.watch(id, (p) => readerUpdate(id, p));
    readerStaleTimer = setTimeout(() => { const x = UI.dialog; if (x && x.reader && x.reader.id === id) { x.reader.stale = true; renderDialog(); } }, 3 * 60 * 1000);
  }
  function readerUpdate(id, p) {
    const d = UI.dialog;
    if (!d || d.type !== "pay" || !d.reader || d.reader.id !== id) return;
    if (p.error) { if (d.reader.warn !== p.error) { d.reader.warn = p.error; renderDialog(); } return; }
    if (d.reader.warn) { d.reader.warn = ""; renderDialog(); }
    if (p.status === "pending") return;
    readerStopWatching(); pendingClear();
    const r = d.reader; d.reader = null;
    if (p.status === "succeeded") {
      const st = L.paymentState(payTotal(), d.payments);
      const amount = Math.min(Number.isFinite(p.amount) && p.amount > 0 ? p.amount : r.amount, st.due);
      const desc = window.CardPay.describe(p);
      d.payments.push({ method: "Card", amount, ...(desc ? { ref: desc.slice(0, 40) } : {}), reader: { id: p.id, last4: p.last4 || "", auth: p.auth || "", brand: p.brand || "", ...(card.state.test ? { test: true } : {}) } });
      d.readerNote = { text: `Approved ${m(amount)}${desc ? " · " + desc : ""}.` };
      d.amount = (L.paymentState(payTotal(), d.payments).due / 100).toFixed(2);
    } else if (p.status === "failed") d.readerNote = { bad: true, text: `Declined${p.message && !/declin/i.test(p.message) ? " (" + p.message + ")" : ""}. Try the card again or choose another way to pay.` };
    else if (p.status === "canceled") d.readerNote = { bad: true, text: p.canceledBy === "terminal" ? "Canceled on the reader. Nothing was charged." : "Canceled. Nothing was charged." };
    else d.readerNote = { bad: true, text: `The reader says "${p.status}". Check the reader before trying again.` };
    renderDialog();
  }
  async function checkCardLeftover() {
    let left = null; try { left = JSON.parse(localStorage.getItem(CARD_PENDING) || "null"); } catch {}
    if (!left || !card || !card.state.ready) return;
    let p; try { p = await card.get(left.id); } catch { return; }
    if (p.status === "pending") { try { p = await card.cancel(left.id); } catch {} }
    pendingClear();
    if (p.status !== "succeeded") return;
    UI.dialog = { type: "confirm", title: `${m(p.amount || left.amount)} was approved on the card reader`,
      text: `The register closed before that sale was finished, so it isn't on a receipt here (${esc(window.CardPay.describe(p) || "card")}). Void the charge to give the money back to the card, or keep it if you've already rung the sale up another way.`,
      yes: "Void the charge", run: async () => { try { await card.void(p.id); toast("The card charge was voided."); } catch (e) { toast(e.message + " Void it on the reader instead.", true); } } };
    renderDialog();
  }
  // Card refunds for a sale paid on the reader: what can still go back to each card.
  const refundByReader = (sale, d) => !!(card && card.state.ready && !d.manual && readerRefundable(sale).reduce((a, x) => a + x.left, 0) > 0);
  const readerRefundable = (sale) => (sale ? sale.payments.filter((p) => p.reader && !p.reader.voided).map((p) => ({ p, left: p.amount - (p.reader.refunded || 0) })).filter((x) => x.left > 0) : []);

  // ---------- Returns ----------
  function returnsView() {
    const q = UI.retQuery.trim().toLowerCase().replace(/^#/, "");
    const sale = UI.retSale && S.sales.find((x) => x.id === UI.retSale);
    const list = q ? S.sales.filter((s) => !s.voided && (String(s.no) === q || `${s.customer ? s.customer.name + " " + s.customer.email + " " + s.customer.phone : ""} ${s.lines.map((l) => l.name).join(" ")}`.toLowerCase().includes(q))).slice(-30).reverse()
      : S.sales.filter((s) => !s.voided).slice(-12).reverse();
    let right = `<div class="empty">Choose a sale to return items from it.</div>`;
    if (sale) {
      const rows = sale.lines.map((l, i) => {
        const can = l.qty - (l.returned || 0);
        const pick = UI.retPick[i] || 0;
        return `<tr><td><b>${esc(l.name)}</b><div class="small muted">${esc([l.size, l.colorName].filter(Boolean).join(" · "))}</div></td>
          <td class="r num">${l.qty}${l.returned ? `<div class="small muted">${l.returned} back</div>` : ""}</td><td class="r num">${m(l.paid)}</td>

          <td>${l.itemId && can ? `<label class="row small"><input type="checkbox" data-in="ret-restock" data-i="${i}" ${UI.retRestock[i] !== false ? "checked" : ""}> Back on shelf</label>` : ""}</td></tr>`;
      }).join("");
      const amount = sale.lines.reduce((a, l, i) => a + L.refundFor(l, UI.retPick[i] || 0), 0);
      right = `<div class="panel"><div class="in"><div class="head"><div><span class="label">${dateLong(sale.date)}</span><h3>Receipt #${sale.no}${sale.customer ? " · " + esc(sale.customer.name || sale.customer.email) : ""}</h3></div>
          <div class="tools"><button class="btn small ghost" data-act="sale-open" data-id="${sale.id}">View receipt</button></div></div>
        <div class="tablewrap"><table><thead><tr><th>Item</th><th class="r">Sold</th><th class="r">Paid</th><th>Returning</th><th>Stock</th></tr></thead><tbody>${rows}</tbody></table></div>
        <div class="due"><span>Return value</span><span class="money">${m(amount)}</span></div>
        <div class="row" style="justify-content:flex-end"><button class="btn" data-act="ret-exchange" ${amount ? "" : "disabled"}>Exchange for other items</button><button class="btn primary" data-act="ret-refund" ${amount ? "" : "disabled"}>Refund ${m(amount)}</button></div>
        <p class="small muted" style="margin:0">Exchange puts the return value on a new sale as credit. Discounts and tax from the original sale are already counted in what each item paid.</p></div></div>`;
    }
    return `<div class="page"><div class="head"><div><h2>Returns &amp; exchanges</h2><div class="sub">Find the original sale by receipt number, customer, or item.</div></div></div>
      <div class="cols" style="grid-template-columns:minmax(0,380px) minmax(0,1fr)">
        <div style="display:grid;gap:10px;align-content:start"><input type="search" id="retq" placeholder="Receipt #, customer, or item" value="${esc(UI.retQuery)}" data-in="retq" autocomplete="off">
          <div class="tablewrap" id="retlist">${list.length ? `<table><tbody>${list.map((s) => `<tr class="click ${UI.retSale === s.id ? "sel" : ""}" data-act="ret-open" data-id="${s.id}"><td><b class="num">#${s.no}</b><div class="small muted">${new Date(s.date).toLocaleDateString()} · ${esc(s.customer ? s.customer.name || s.customer.email : "No customer")}</div></td><td class="r num">${m(s.total)}</td></tr>`).join("")}</tbody></table>` : `<div class="empty" style="border:0">${q ? "No sales match." : "No sales yet."}</div>`}</div></div>
        <div>${right}</div></div></div>`;

  function pickedReturn() {
    const sale = S.sales.find((x) => x.id === UI.retSale);
    const lines = sale.lines.map((l, i) => ({ lineIdx: i, qty: UI.retPick[i] || 0, amount: L.refundFor(l, UI.retPick[i] || 0), restock: !!l.itemId && UI.retRestock[i] !== false })).filter((r) => r.qty > 0);
    return { sale, lines, amount: lines.reduce((a, r) => a + r.amount, 0) };
  }
  function recordReturn(sale, lines, info) {
    for (const r of lines) {
      const l = sale.lines[r.lineIdx];
      l.returned = (l.returned || 0) + r.qty;
      if (r.restock && l.itemId) {
        const it = itemById(l.itemId);
        if (it) { const k = L.stockKey(l.size, l.colorId); it.stock[k] = (Number(it.stock[k]) || 0) + r.qty; logStock(it.id, k, r.qty, `Return to #${sale.no}`); }
      }
    }
    const rec = { id: uid(), kind: "return", no: S.settings.nextReturn++, date: new Date().toISOString(), saleId: sale.id, lines, amount: lines.reduce((a, r) => a + r.amount, 0), ...info };
    S.returns.push(rec);
    return rec;
  }

  // ---------- Stock ----------
  function stockView() {
    const q = UI.stockSearch.trim().toLowerCase();
    const list = S.items.filter((it) => {
      if (q && !`${it.name} ${it.category}`.toLowerCase().includes(q)) return false;
      const st = stockState(it).cls;
      return UI.stockFilter === "all" || (UI.stockFilter === "low" && st !== "good");
    });
    const lowCount = S.items.filter((it) => stockState(it).cls !== "good").length;
    const units = S.items.reduce((a, it) => a + Math.max(0, totalStock(it)), 0);
    const value = S.items.reduce((a, it) => a + Math.max(0, totalStock(it)) * it.price, 0);

      <div class="stats"><div class="stat"><span class="label">Items</span><span class="v">${S.items.length}</span></div><div class="stat"><span class="label">Pieces on hand</span><span class="v">${units}</span></div>
        <div class="stat"><span class="label">At retail price</span><span class="v">${m(value)}</span></div><div class="stat"><span class="label">Need attention</span><span class="v ${lowCount ? "warn" : ""}">${lowCount}</span></div></div>

      <div class="tablewrap" id="stocktable">${stockTableHtml(list)}</div></div>`;

  function stockTableHtml(list) {

      const st = stockState(it);
      const open = UI.stockOpen[it.id];
      const cols = colorsOf(it);
      return `<tr class="click item-row" data-act="stock-toggle" data-id="${it.id}"><td><b>${esc(it.name)}</b><div class="small muted">${esc(it.category || "")}${it.webId ? " · on website" : ""}${it.taxable ? " · taxable" : ""}</div></td>
        <td class="r num">${m(it.price)}</td>

        ${open ? `<tr class="expand"><td colspan="6"><div class="stockgrid"><span class="label">Count on the shelf · type the real number to correct it</span>
          <div style="overflow-x:auto"><table><thead><tr><th>Size</th>${cols.map((c) => `<th>${c ? `<span class="row" style="gap:6px"><i class="dot" style="background:${esc(c.hex)}"></i>${esc(c.name)}</span>` : "Count"}</th>`).join("")}</tr></thead>

          }).join("")}</tr>`).join("")}</tbody></table></div>${codesHtml(it)}</div></td></tr>` : ""}`;

    return `<span class="label" style="margin-top:12px">Barcodes · scan the maker's code into a box, or create one</span>
      <div style="overflow-x:auto"><table><tbody>${keys.map((k) => {
        const v = (it.skus || {})[k] || "";
        return `<tr><th>${esc(variantName(it, k))}</th>
          <td><input type="text" id="sku-${it.id}-${domKey(k)}" class="num" style="width:230px" value="${esc(v)}" data-in="sku" data-id="${it.id}" data-k="${esc(k)}" placeholder="Scan or type a barcode" autocomplete="off" spellcheck="false"></td>
          <td>${v ? `<span class="pill ${isShopCode(v) ? "plain" : "good"}">${isShopCode(v) ? "Shop code" : "Maker's code"}</span>` : `<button class="btn small" data-act="sku-make" data-id="${it.id}" data-k="${esc(k)}">Create</button>`}</td></tr>`;
      }).join("")}</tbody></table></div>
      <div class="row"><button class="btn small" data-act="sku-make-all" data-id="${it.id}" ${has.length < keys.length ? "" : "disabled"}>Create barcodes for the rest</button>
        <button class="btn small primary" data-act="labels" data-id="${it.id}" ${has.length ? "" : "disabled"}>Print labels</button></div>`;

  // ---------- labels ----------
  const LABEL_SIZES = { roll: "Label printer · 2.25 × 1.25 in", sheet: "Sheet of 30 · Avery 5160 (2.625 × 1 in)" };
  const labelCss = `.lbl{box-sizing:border-box;overflow:hidden;font-family:"Courier Prime","Courier New",monospace;color:#000;background:#fff;display:flex;flex-direction:column;justify-content:space-between;gap:1px}
    .lbl-r{display:flex;justify-content:space-between;align-items:baseline;gap:6px;flex:none;line-height:1.15}
    .lbl-nm{font-family:Gloock,Georgia,serif;font-size:10pt;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
    .lbl-pr{font-weight:700;font-size:10pt;flex:none}
    .lbl-op{font-size:7.5pt;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
    .lbl-sh{font-size:6pt;letter-spacing:.08em;text-transform:uppercase;flex:none}
    .lbl .bc{flex:none}`;
  // Bars are 0.375 mm wide: exactly 3 dots on a 203 dpi label printer, so every bar prints evenly.
  const BAR_MM = 0.375;
  const codeWidth = (code) => { const m = L.barcodeModules(code); return m ? `${((m.length + 20) * BAR_MM).toFixed(2)}mm` : "100%"; };
  function labelHtml(it, key, size) {
    return `<div class="lbl"><div class="lbl-r"><span class="lbl-nm">${esc(it.name)}</span><span class="lbl-pr">${m(it.price)}</span></div>

  function labelsDoc(list, size) {
    const labels = list.flatMap(([it, key, n]) => Array.from({ length: n }, () => labelHtml(it, key, size)));
    if (size === "sheet") {
      const pages = [];
      for (let i = 0; i < labels.length; i += 30) pages.push(`<div class="sheet">${labels.slice(i, i + 30).join("")}</div>`);

        .sheet{width:8.5in;height:11in;padding:0.5in 0.1875in 0;box-sizing:border-box;display:grid;grid-template-columns:repeat(3,2.625in);grid-auto-rows:1in;column-gap:0.125in;page-break-after:always}

    }
    return `<!doctype html><html><head><meta charset="utf-8"><title>Labels</title><style>@page{size:2.25in 1.25in;margin:0}body{margin:0}
      .lbl{width:2.25in;height:1.25in;padding:0.07in 0.1in;page-break-after:always}${labelCss}</style></head><body>${labels.join("")}</body></html>`;
  }

  function itemFormHtml(d) {
    return `<h2>${d.id ? "Edit item" : "Add item"}</h2>
      ${d.webId ? `<p class="small muted" style="margin:0">This item came from the website Shop. Bringing items in again will refresh its name, price, sizes and colors from the website.</p>` : ""}

        <label class="f"><span>Sizes, separated by commas</span><input type="text" id="it-sizes" value="${esc(d.sizes)}" data-in="dlg" data-k="sizes" placeholder="S, M, L or One size"></label></div>

          <input type="text" id="it-cn-${i}" style="max-width:240px" value="${esc(c.name)}" data-in="dlg-color" data-i="${i}" data-k="name" placeholder="Color name"><button class="btn small ghost danger" data-act="it-color-del" data-i="${i}">Remove</button></div>`).join("")}
        <div><button class="btn small" data-act="it-color-add">+ Add color</button></div></div>
      <label class="row small"><input type="checkbox" id="it-tax" data-in="dlg" data-k="taxable" ${d.taxable ? "checked" : ""}> Charge sales tax on this item</label>
      ${d.err ? `<p style="margin:0;color:var(--bad)">${esc(d.err)}</p>` : ""}
      <div class="foot">${d.id ? `<button class="btn ghost danger left" data-act="item-delete">Delete item</button>` : ""}<button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="item-save">${d.id ? "Save changes" : "Add item"}</button></div>`;
  }

  async function importFromWebsite() {
    toast("Checking the website Shop…");
    const r = await pos.fetchProducts(S.settings.websiteUrl);
    if (!r || !r.ok) return toast((r && r.error) || "Couldn't reach the website.", true);
    let added = 0, updated = 0;
    for (const p of r.products) {
      if (!p || !p.id || !p.name) continue;
      const sizes = Array.isArray(p.sizes) && p.sizes.length ? p.sizes.map(String) : ["One size"];
      const colors = Array.isArray(p.colors) ? p.colors.filter((c) => c && c.id && c.name).map((c) => ({ id: String(c.id), name: String(c.name), hex: /^#[0-9a-f]{6}$/i.test(c.hex) ? c.hex : "#888888" })) : [];
      let it = S.items.find((x) => x.webId === p.id);
      const fields = { name: String(p.name), category: String(p.category || ""), price: L.toCents(p.price), sizes, colors };
      if (it) { Object.assign(it, fields); updated++; }
      else { it = { id: uid(), webId: p.id, taxable: false, stock: {}, active: true, ...fields }; S.items.push(it); added++; }
      const keep = new Set(keysOf(it));
      for (const k of Object.keys(it.stock)) if (!keep.has(k) && !Number(it.stock[k])) delete it.stock[k];
    }
    await persist();
    render();
    toast(added || updated ? `Brought in ${added} new item${added === 1 ? "" : "s"} and refreshed ${updated}. New items start at a count of 0.` : "The website Shop has no items yet.");
  }

  // ---------- Sales ----------
  function salesView() {
    const day = UI.salesDate;
    const sales = S.sales.filter((s) => dayOf(s.date) === day).reverse();
    const rets = S.returns.filter((r) => dayOf(r.date) === day).reverse();
    const live = sales.filter((s) => !s.voided);
    const sumBy = (method) => live.reduce((a, s) => a + s.payments.filter((p) => p.method === method).reduce((x, p) => x + p.amount, 0), 0);
    const refunds = rets.filter((r) => r.type === "refund").reduce((a, r) => a + r.amount, 0) + live.reduce((a, s) => a + s.payments.filter((p) => p.amount < 0).reduce((x, p) => x - p.amount, 0), 0);
    const cardRefunds = rets.filter((r) => r.type === "refund" && r.method === "Card").reduce((a, r) => a + r.amount, 0) + live.reduce((a, s) => a + s.payments.filter((p) => p.amount < 0 && /Card/.test(p.method)).reduce((x, p) => x - p.amount, 0), 0);
    const total = live.reduce((a, s) => a + s.total, 0);
    const card = sumBy("Card"), cash = sumBy("Cash");
    const isToday = day === today();
    return `<div class="page"><div class="head"><div><h2>Sales</h2><div class="sub">${isToday ? "Today, " : ""}${new Date(day + "T12:00").toLocaleDateString([], { weekday: "long", month: "long", day: "numeric", year: "numeric" })}</div></div>
        <div class="tools"><button class="btn small" data-act="day-shift" data-d="-1">← Day before</button><input type="date" id="salesday" value="${day}" data-in="salesday" style="width:auto">
        <button class="btn small" data-act="day-shift" data-d="1" ${isToday ? "disabled" : ""}>Next day →</button>${isToday ? "" : `<button class="btn small ghost" data-act="day-today">Today</button>`}
        <button class="btn" data-act="export-day" ${sales.length ? "" : "disabled"}>Export this day</button><button class="btn" data-act="export-all" ${S.sales.length ? "" : "disabled"}>Export all sales</button></div></div>
      <div class="stats">
        <div class="stat"><span class="label">Sales</span><span class="v">${live.length}</span><span class="small muted">${m(total)} total</span></div>
        <div class="stat"><span class="label">Card · match the terminal</span><span class="v">${m(card - cardRefunds)}</span><span class="small muted">${m(card)} in${cardRefunds ? ", " + m(cardRefunds) + " refunded" : ""}</span></div>
        <div class="stat"><span class="label">Cash in the drawer</span><span class="v">${m(cash - rets.filter((r) => r.type === "refund" && r.method === "Cash").reduce((a, r) => a + r.amount, 0) - live.reduce((a, s) => a + s.payments.filter((p) => p.amount < 0 && /Cash/.test(p.method)).reduce((x, p) => x - p.amount, 0), 0))}</span><span class="small muted">after change and refunds</span></div>
        <div class="stat"><span class="label">Refunds</span><span class="v">${m(refunds)}</span><span class="small muted">${rets.length} return${rets.length === 1 ? "" : "s"}</span></div>
      </div>
      <div class="tablewrap">${sales.length ? `<table><thead><tr><th>Time</th><th>Receipt</th><th>Customer</th><th>Sold by</th><th>Items</th><th>Paid by</th><th class="r">Total</th><th></th></tr></thead><tbody>${sales.map((s) => `
        <tr class="click ${s.voided ? "void" : ""}" data-act="sale-open" data-id="${s.id}"><td class="num">${timeOf(s.date)}</td><td class="num">#${s.no}</td><td>${esc(s.customer ? s.customer.name || s.customer.email : "—")}</td><td>${esc(s.staffName || "—")}</td>
          <td>${esc(s.lines.map((l) => (l.qty > 1 ? l.qty + "× " : "") + l.name).join(", "))}</td><td>${esc([...new Set(s.payments.map((p) => p.method))].join(" + ") || "—")}</td><td class="r num">${m(s.total)}</td>
          <td>${s.voided ? '<span class="pill bad">Voided</span>' : s.lines.some((l) => l.returned) ? '<span class="pill warn">Has returns</span>' : ""}</td></tr>`).join("")}</tbody></table>` : `<div class="empty" style="border:0">No sales on this day.</div>`}</div>
      ${rets.length ? `<h3>Returns</h3><div class="tablewrap"><table><thead><tr><th>Time</th><th>Return</th><th>From receipt</th><th>Type</th><th class="r">Amount</th></tr></thead><tbody>${rets.map((r) => {
        const s = S.sales.find((x) => x.id === r.saleId);
        return `<tr class="click" data-act="return-open" data-id="${r.id}"><td class="num">${timeOf(r.date)}</td><td class="num">R-${r.no}</td><td class="num">#${s ? s.no : "?"}</td><td>${r.type === "exchange" ? `Exchange for #${r.exchangeSaleNo || ""}` : "Refund · " + esc(r.method)}</td><td class="r num">${m(r.amount)}</td></tr>`;
      }).join("")}</tbody></table></div>` : ""}</div>`;
  }
  function csvOf(sales) {
    const q = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const rows = [["Date", "Time", "Receipt", "Status", "Customer", "Email", "Item", "Size", "Color", "Qty", "Unit price", "Paid for line", "Returned", "Sale total", "Paid by", "Sold by"]];
    for (const s of sales) for (const l of s.lines) rows.push([dayOf(s.date), timeOf(s.date), s.no, s.voided ? "Voided" : "Sale", s.customer && s.customer.name, s.customer && s.customer.email, l.name, l.size, l.colorName, l.qty, (l.price / 100).toFixed(2), (l.paid / 100).toFixed(2), l.returned || 0, (s.total / 100).toFixed(2), s.payments.map((p) => `${p.method} ${(p.amount / 100).toFixed(2)}`).join("; "), s.staffName || ""]);
    return rows.map((r) => r.map(q).join(",")).join("\r\n");
  }
  async function exportCsv(name, sales) {
    if (PREVIEW) return toast("In the installed app, this saves a spreadsheet you can open in Excel.");
    const f = await pos.saveCsv(name, csvOf(sales));
    if (f) toast("Saved " + f);
  }

  // ---------- Settings ----------

    return `<div class="page"><div class="head"><div><h2>Settings</h2><div class="sub">Changes save as you type.</div></div></div>
      <div class="cols">
        <div style="display:grid;gap:18px">
          <section class="panel"><div class="in"><h3 class="banner">Shop &amp; receipts</h3>${fld("shopName", "Shop name")}${fld("address", "Address")}<div class="grid2">${fld("phone", "Phone")}${fld("email", "Email")}</div>
            <label class="f"><span>Message at the bottom of receipts</span><textarea id="set-receiptFooter" rows="3" data-in="set" data-k="receiptFooter" placeholder="e.g. your return policy">${esc(s.receiptFooter)}</textarea></label>

          <section class="panel"><div class="in"><h3 class="banner">Staff</h3>
            <div><span class="label">Pay week starts on</span><div class="seg" style="margin-top:6px"><button data-act="set-week" data-v="0" aria-pressed="${Number(s.weekStart) !== 1}">Sunday</button><button data-act="set-week" data-v="1" aria-pressed="${Number(s.weekStart) === 1}">Monday</button></div></div>
            <div style="display:grid;gap:6px"><span class="label">Shop hours (for the schedule)</span>
              ${["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"].map((dn, i) => { const v = (s.hours || [])[i] || ""; const [o, c] = v ? v.split("-") : ["", ""]; return `<div class="hrsrow"><span>${dn}</span><input type="time" id="hr-o-${i}" value="${esc(o)}" data-in="hours" data-i="${i}" data-k="o" aria-label="${dn} opens"><span class="muted">to</span><input type="time" id="hr-c-${i}" value="${esc(c)}" data-in="hours" data-i="${i}" data-k="c" aria-label="${dn} closes"><span class="small muted">${v ? "" : "Closed"}</span></div>`; }).join("")}
              <span class="small muted">Clear both times for a day the shop is closed.</span></div>
            <p class="small muted" style="margin:0">Employees and PINs are on the Staff tab, under Employees.</p></div></section>
          <section class="panel"><div class="in"><h3 class="banner">Tax &amp; stock</h3><div class="grid2">${fld("taxRate", "Sales tax rate (%)", "number", 'step="0.01" min="0"')}${fld("lowStock", "Warn when a size or color is down to", "number", 'min="0"')}</div>
            <p class="small muted" style="margin:0">Tax is only added to items and custom amounts marked "Charge sales tax". Pennsylvania exempts most clothing, so check with your accountant which of your items and services are taxable.</p></div></section>
          <section class="panel"><div class="in"><h3 class="banner">Made-to-measure price list</h3>
            ${S.priceList ? `<div class="pays"><div class="pay"><span>List</span><span>${esc(S.priceList.name)}${S.priceList.currency ? " · " + esc(S.priceList.currency) : ""}</span></div>
              <div class="pay"><span>Updated</span><span>${esc(S.priceList.updated || "—")}</span></div>
              <div class="pay"><span>Price codes</span><span>${S.priceList.codes.length}</span></div>
              <div class="pay"><span>Garments</span><span style="text-align:right">${S.priceList.types.length}</span></div></div>
              ${markupHtml()}` : `<p style="margin:0">No price list yet.</p>`}
            <div class="row"><button class="btn" data-act="pl-import">${S.priceList ? "Replace with a new price list" : "Bring in a price list"}</button><input type="file" id="pl-file" accept=".csv,text/csv" hidden></div>
            <p class="small muted" style="margin:0">Use the supplier's CSV export (a "Price Code" column, then one column per garment). Bringing in a new one replaces every price on the Register's Custom filter; past receipts keep the price they were sold at.</p></div></section>
          <section class="panel"><div class="in"><h3 class="banner">Set-price custom cards</h3><p class="small muted" style="margin:0">Cards at the start of the Register's Custom section, at a fixed price. Markups don't apply to these.</p>
            ${(s.fixedCards || []).map((v, i) => `<div class="svc-row"><input type="text" id="fx-n-${i}" value="${esc(v.name)}" data-in="fx" data-i="${i}" data-k="name" placeholder="e.g. Custom Shirt"><input type="text" id="fx-p-${i}" inputmode="decimal" class="money" value="${(v.price / 100).toFixed(2)}" data-in="fx" data-i="${i}" data-k="price"><button class="btn small ghost danger" data-act="fx-del" data-i="${i}">Remove</button></div>`).join("")}
            <div><button class="btn small" data-act="fx-add">+ Add a card</button></div></div></section>
          <section class="panel"><div class="in"><h3 class="banner">Quick alterations</h3><p class="small muted" style="margin:0">Buttons on the Register for the services you ring up most.</p>
            ${(s.services || []).map((v, i) => `<div class="svc-row"><input type="text" id="svc-n-${i}" value="${esc(v.name)}" data-in="svc" data-i="${i}" data-k="name" placeholder="Service"><input type="text" id="svc-p-${i}" inputmode="decimal" class="money" value="${(v.price / 100).toFixed(2)}" data-in="svc" data-i="${i}" data-k="price"><button class="btn small ghost danger" data-act="svc-del" data-i="${i}">Remove</button></div>`).join("")}
            <div><button class="btn small" data-act="svc-add">+ Add a service</button></div></div></section>
        </div>
        <div style="display:grid;gap:18px">
          <section class="panel"><div class="in"><h3 class="banner">Emailing receipts</h3><p class="small muted" style="margin:0">Receipts go out from the shop's Gmail. Gmail needs an <b>app password</b> for this, not your normal password: in your Google Account, turn on 2-Step Verification, then search for "App passwords" and make one called Register.</p>
            ${fld("smtpUser", "Gmail address", "email")}${fld("smtpPass", "App password", "password", 'autocomplete="off"')}
            <div class="row"><input type="email" id="test-to" style="max-width:260px" placeholder="Send a test to…" value="${esc(UI.testTo || s.smtpUser)}" data-in="test-to"><button class="btn" data-act="test-email">Send test receipt</button></div></div></section>
          <section class="panel"><div class="in"><h3 class="banner">Website</h3>
            <p class="small muted" style="margin:0">The connection to the website's customer list is the <b>Customer list</b> button at the top of the screen. The Stock screen can bring in the items listed on the website.</p></div></section>
          <section class="panel"><div class="in"><h3 class="banner">Backups</h3><p class="small muted" style="margin:0">Everything is kept on this computer and copied to the backup folder once a day (the last 60 days are kept). Pick a OneDrive or USB-drive folder so a broken computer can't lose your sales history.</p>
            <div class="small"><span class="label">Backup folder</span><div class="num" style="word-break:break-all">${esc(s.backupFolder || "The app's own folder on this computer")}</div></div>
            <div class="row"><button class="btn" data-act="backup-choose">Choose folder</button><button class="btn" data-act="backup-now">Back up now</button><button class="btn ghost" data-act="backup-open">Open folder</button><button class="btn ghost danger" data-act="backup-restore">Restore a backup</button></div>
            <div class="small muted" id="appinfo">${UI.info && UI.info.version ? `Version ${esc(UI.info.version)} · data file: ${esc(UI.info.dataFile)}` : ""}</div></div></section>
        </div></div></div>`;
  }

  // ---------- Staff: time clock, timesheets, shift notes, cash drawer, employees ----------
  const staffById = (id) => S.staff.find((x) => x.id === id);
  const activeStaff = () => S.staff.filter((x) => x.active !== false);
  const openPunch = (sid) => S.punches.find((p) => p.staffId === sid && !p.out);
  const onBreak = (p) => !!p && (p.breaks || []).some((b) => !b.end);
  const clockedIn = () => activeStaff().filter((x) => openPunch(x.id));
  const hasManager = () => activeStaff().some((x) => x.role === "manager");
  async function pinHash(sid, pin) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(`bespoke-register|${sid}|${pin}`));
    return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
  }
  async function staffByPin(pin) {
    for (const st of activeStaff()) if (st.pin === (await pinHash(st.id, pin))) return st;
    return null;
  }
  const dayStart = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const dayEnd = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
  function msOn(sid, d) {
    const a = dayStart(d).getTime(), b = dayEnd(d).getTime(), now = Date.now();
    return S.punches.filter((p) => p.staffId === sid).reduce((t, p) => t + L.workedBetween(p, a, b, now), 0);
  }
  const weekDays = (d) => L.weekOf(d, Number(S.settings.weekStart) || 0);
  const msWeek = (sid, d) => weekDays(d).reduce((t, x) => t + msOn(sid, x), 0);
  const tShort = (iso) => new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const longOpen = (p) => !p.out && Date.now() - Date.parse(p.in) > 14 * 3600000;
  function statusOf(st) {
    const p = openPunch(st.id);
    if (!p) return { key: "out", text: "Out", cls: "plain" };
    if (onBreak(p)) return { key: "break", text: "On break", cls: "warn", since: p.breaks.find((b) => !b.end).start };
    return { key: "in", text: longOpen(p) ? "Still in from earlier" : "Clocked in", cls: longOpen(p) ? "bad" : "good", since: p.in };
  }
  // Cash that should be in the drawer from today's sales: cash taken minus change and cash refunds.
  function cashNet(day) {
    const live = S.sales.filter((s) => dayOf(s.date) === day && !s.voided);
    const inCash = live.reduce((a, s) => a + s.payments.filter((p) => p.method === "Cash").reduce((x, p) => x + p.amount, 0), 0);
    const outCash = S.returns.filter((r) => dayOf(r.date) === day && r.type === "refund" && r.method === "Cash").reduce((a, r) => a + r.amount, 0)
      + live.reduce((a, s) => a + s.payments.filter((p) => p.amount < 0 && /Cash/.test(p.method)).reduce((x, p) => x - p.amount, 0), 0);
    return inCash - outCash;
  }
  const managerOk = () => !hasManager() || (UI.mgrUntil && Date.now() < UI.mgrUntil);
  function asManager(then) {
    if (managerOk()) return then();
    UI.dialog = { type: "mgr", pin: "", then };
    renderDialog();
  }

  const STAFF_TABS = [["clock", "Time clock"], ["schedule", "Schedule"], ["sheets", "Timesheets"], ["bysales", "Sales"], ["notes", "Shift notes"], ["drawer", "Cash drawer"], ["people", "Employees"]];
  function staffView() {
    const tab = UI.staffTab || "clock";
    const open = S.notes.filter((n) => !n.done).length;
    const body = tab === "schedule" ? schedulePane() : tab === "bysales" ? bySalesPane() : tab === "sheets" ? sheetsPane() : tab === "notes" ? notesPane() : tab === "drawer" ? drawerPane() : tab === "people" ? peoplePane() : clockPane();
    return `<div class="page"><div class="head"><div><h2>Staff</h2><div class="sub">Clock in and out with your PIN.${open ? ` ${open} shift note${open === 1 ? "" : "s"} waiting.` : ""}</div></div>
        <div class="tools">${isLocked() ? "" : `<span class="pill good">Manager unlocked</span><button class="btn small ghost" data-act="mgr-lock">Lock</button>`}</div></div>
      <div class="seg" role="tablist">${STAFF_TABS.map(([k, t]) => `<button data-act="staff-tab" data-t="${k}" aria-pressed="${tab === k}">${t}${k === "notes" && open ? ` <span class="qbadge">${open}</span>` : ""}</button>`).join("")}</div>
      ${body}</div>`;
  }
  const isLocked = () => !(hasManager() && UI.mgrUntil && Date.now() < UI.mgrUntil);

  function clockPane() {
    if (!activeStaff().length) return `<div class="panel"><div class="in"><h3 class="banner">Set up the time clock</h3><p style="margin:0">Add yourself first as a manager, then each employee with their own PIN.</p><div><button class="btn primary" data-act="staff-tab" data-t="people">Add employees</button></div></div></div>`;
    const pin = UI.pin || "";
    return `<div class="cols" style="grid-template-columns:minmax(0,380px) minmax(0,1fr)">
      <div class="panel"><div class="in"><h3 class="banner">Clock in or out</h3>
        <div class="bigclock" id="bigclock">${new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}</div>
        <div class="pindots" aria-label="PIN entered">${Array.from({ length: Math.max(4, pin.length) }, (_, i) => `<i class="${i < pin.length ? "on" : ""}"></i>`).join("")}</div>
        <div class="pinpad">${["1", "2", "3", "4", "5", "6", "7", "8", "9", "Clear", "0", "Enter"].map((k) => `<button data-act="pin-key" data-k="${k}" class="${k === "Enter" ? "go" : k === "Clear" ? "clr" : ""}">${k}</button>`).join("")}</div>
        <p class="small muted" style="margin:0;text-align:center">Type your PIN on the keypad or keyboard.</p></div></div>
      <div style="display:grid;gap:20px;align-content:start"><div class="tablewrap" id="board">${boardHtml()}</div>
        ${S.notes.filter((n) => !n.done).length ? `<div class="panel"><div class="in"><h3 class="banner">Shift notes</h3>${notesList(S.notes.filter((n) => !n.done).slice(-4).reverse())}<div><button class="btn small" data-act="staff-tab" data-t="notes">All notes</button></div></div></div>` : ""}</div></div>`;
  }
  function boardHtml() {
    const now = new Date();
    return `<table><thead><tr><th>Employee</th><th>Scheduled today</th><th>Status</th><th class="r">Today</th><th class="r">This week</th></tr></thead><tbody>${activeStaff().map((st) => {
      const s = statusOf(st);
      const sh = shiftsOn(st.id, today());
      return `<tr><td><b>${esc(st.name)}</b></td><td class="small">${sh.length ? sh.map((x) => `${t12(x.start)} – ${t12(x.end)}`).join(", ") : '<span class="muted">Off</span>'}</td><td><span class="pill ${s.cls}">${s.text}</span>${s.since ? ` <span class="small muted">since ${tShort(s.since)}</span>` : ""}</td>
        <td class="r num">${L.hm(msOn(st.id, now))}</td><td class="r num">${L.hm(msWeek(st.id, now))}</td></tr>`;
    }).join("")}</tbody></table>`;
  }

  function sheetsPane() {
    if (isLocked() && hasManager()) return `<div class="empty">Timesheets are for managers. <button class="btn small" data-act="mgr-unlock">Unlock with manager PIN</button></div>`;
    const ref = UI.sheetDay ? new Date(UI.sheetDay + "T12:00") : new Date();
    const days = weekDays(ref);
    const fmt = (d) => d.toLocaleDateString([], { weekday: "short", month: "numeric", day: "numeric" });
    const staff = S.staff.filter((st) => st.active !== false || S.punches.some((p) => p.staffId === st.id && Date.parse(p.in) >= days[0].getTime() && Date.parse(p.in) < dayEnd(days[6]).getTime()));
    const sel = UI.sheetStaff && staffById(UI.sheetStaff) ? UI.sheetStaff : null;
    let detail = "";
    if (sel) {
      const a = days[0].getTime(), b = dayEnd(days[6]).getTime();
      const list = S.punches.filter((p) => p.staffId === sel && Date.parse(p.in) < b && (p.out ? Date.parse(p.out) : Date.now()) > a).sort((x, y) => (x.in < y.in ? -1 : 1));
      detail = `<div class="panel"><div class="in"><h3 class="banner">${esc(staffById(sel).name)} · shifts this week</h3>
        ${list.length ? `<div class="tablewrap"><table><thead><tr><th>Day</th><th>In</th><th>Out</th><th class="r">Breaks</th><th class="r">Worked</th><th></th></tr></thead><tbody>${list.map((p) => {
          const br = (p.breaks || []).reduce((t, x) => t + ((x.end ? Date.parse(x.end) : Date.now()) - Date.parse(x.start)), 0);
          return `<tr><td>${new Date(p.in).toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" })}</td><td class="num">${tShort(p.in)}</td>
            <td class="num">${p.out ? tShort(p.out) : `<span class="pill ${longOpen(p) ? "bad" : "good"}">${longOpen(p) ? "Never clocked out" : "Still in"}</span>`}</td>
            <td class="r num">${br ? L.hm(br) : "—"}</td><td class="r num">${L.hm(L.workedMs(p, Date.now()))}</td>
            <td class="r">${(p.edits || []).length ? `<span class="small muted" title="${esc(p.edits.map((e) => e.note).join("; "))}">edited</span> ` : ""}<button class="btn small ghost" data-act="punch-edit" data-id="${p.id}">Fix</button></td></tr>`;
        }).join("")}</tbody></table></div>` : `<div class="empty">No shifts this week.</div>`}
        <div class="row"><button class="btn small" data-act="punch-add" data-id="${sel}">Add a missed shift</button></div></div></div>`;
    }
    return `<div class="row"><button class="btn small" data-act="sheet-week" data-d="-7">← Week before</button>
        <span class="label">${fmt(days[0])} – ${fmt(days[6])}</span>
        <button class="btn small" data-act="sheet-week" data-d="7" ${dayEnd(days[6]) > new Date() ? "disabled" : ""}>Next week →</button>
        <button class="btn small ghost" data-act="sheet-week" data-d="0">This week</button>
        <span style="margin-left:auto"></span><button class="btn" data-act="sheet-export">Export for payroll</button></div>
      <div class="tablewrap"><table><thead><tr><th>Employee</th>${days.map((d) => `<th class="r">${fmt(d)}</th>`).join("")}<th class="r">Total</th><th class="r">Hours</th></tr></thead>
        <tbody>${staff.length ? staff.map((st) => {
          const per = days.map((d) => msOn(st.id, d)); const tot = per.reduce((a, b) => a + b, 0);
          const flag = S.punches.some((p) => p.staffId === st.id && longOpen(p));
          return `<tr class="click ${sel === st.id ? "sel" : ""}" data-act="sheet-staff" data-id="${st.id}"><td><b>${esc(st.name)}</b>${flag ? ' <span class="pill bad">Missing clock-out</span>' : ""}</td>${per.map((ms) => `<td class="r num">${ms ? L.hm(ms) : "—"}</td>`).join("")}
            <td class="r num"><b>${L.hm(tot)}</b></td><td class="r num">${L.hoursDec(tot)}</td></tr>`;
        }).join("") : `<tr><td colspan="10" class="muted">No employees yet.</td></tr>`}</tbody></table></div>
      <p class="small muted" style="margin:0">Click an employee to see their shifts and fix a missed punch. Hours are worked time with breaks taken out. A shift that runs past midnight is split between the two days.</p>
      ${detail}`;
  }

  function notesList(list) {
    return list.length ? `<div class="notes">${list.map((n) => `<label class="note ${n.done ? "done" : ""}"><input type="checkbox" data-in="note-done" data-id="${n.id}" ${n.done ? "checked" : ""}>
      <span><span class="txt">${esc(n.text)}</span><span class="small muted">${esc(n.by ? (staffById(n.by) || {}).name || "" : "")}${n.by ? " · " : ""}${new Date(n.at).toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })}</span></span></label>`).join("")}</div>` : `<div class="empty">No notes.</div>`;
  }
  function notesPane() {

        <label class="f"><span>From</span><select id="note-by" data-in="note-by"><option value="">—</option>${activeStaff().map((st) => `<option value="${st.id}" ${UI.noteBy === st.id ? "selected" : ""}>${esc(st.name)}</option>`).join("")}</select></label>
        <div><button class="btn primary" data-act="note-add">Add note</button></div></div></div>

  function drawerPane() {

    const todays = S.drawers.filter((x) => x.day === day);
    const opening = todays.filter((x) => x.kind === "open").slice(-1)[0];
    const kind = UI.drawerKind || (opening ? "close" : "open");
    const counts = UI.drawerCounts || {};
    const total = L.drawerTotal(counts);

    const diff = expected == null ? null : total - expected;
    const hist = S.drawers.slice(-14).reverse();
    return `<div class="cols"><div class="panel"><div class="in"><h3 class="banner">Count the drawer</h3>
        <div class="seg"><button data-act="drawer-kind" data-k="open" aria-pressed="${kind === "open"}">Opening count</button><button data-act="drawer-kind" data-k="close" aria-pressed="${kind === "close"}">Closing count</button></div>
        <div class="denoms">${L.DENOMS.map(([k, v]) => `<label class="f"><span>${k}</span><input type="number" min="0" id="dn-${k.replace(/\W/g, "")}" class="num" value="${esc(counts[k] || "")}" data-in="denom" data-k="${k}" placeholder="0"></label>`).join("")}</div>
        <div class="due"><span>Counted</span><span class="money" id="dn-total">${m(total)}</span></div>
        ${kind === "close" ? (opening ? `<div class="pays"><div class="pay"><span>Opening count</span><span>${m(opening.counted)}</span></div><div class="pay"><span>Cash from today's sales, after change and refunds</span><span>${m(cashNet(day))}</span></div>
            <div class="pay"><b>Should be in the drawer</b><b>${m(expected)}</b></div><div class="pay" id="dn-diff">${diffHtml(diff)}</div></div>` : `<p class="small muted" style="margin:0">There's no opening count for today, so the app can't say what the drawer should hold.</p>`) : ""}
        <div class="grid2"><label class="f"><span>Counted by</span><select id="dn-by" data-in="drawer-by"><option value="">—</option>${activeStaff().map((st) => `<option value="${st.id}" ${UI.drawerBy === st.id ? "selected" : ""}>${esc(st.name)}</option>`).join("")}</select></label>

      <div class="panel"><div class="in"><h3 class="banner">Recent counts</h3>${hist.length ? `<div class="tablewrap"><table><thead><tr><th>Day</th><th>Count</th><th>By</th><th class="r">Counted</th><th class="r">Over / short</th></tr></thead><tbody>${hist.map((x) => `<tr><td>${new Date(x.at).toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" })} <span class="small muted">${tShort(x.at)}</span></td><td>${x.kind === "open" ? "Opening" : "Closing"}</td><td>${esc(x.by ? (staffById(x.by) || {}).name || "" : "")}</td><td class="r num">${m(x.counted)}</td>

  const diffHtml = (diff) => (diff == null ? "" : `<b>${diff === 0 ? "Even" : diff > 0 ? "Over" : "Short"}</b><b style="color:${diff === 0 ? "var(--good)" : "var(--red)"}">${diff === 0 ? m(0) : m(Math.abs(diff))}</b>`);

      ${S.staff.length ? `<div class="tablewrap"><table><thead><tr><th>Name</th><th>Role</th><th>Status</th><th class="r">This week</th><th></th></tr></thead><tbody>${S.staff.map((st) => `<tr ${st.active === false ? 'class="void"' : ""}><td><b>${esc(st.name)}</b></td><td>${st.role === "manager" ? "Manager" : "Employee"}</td>

        <div class="grid2"><label class="f"><span>Starts</span><input type="time" id="sh-start" value="${esc(d.start)}" data-in="dlg" data-k="start" autofocus></label>

    if (d.type === "punchfix") {

        <div class="grid2"><label class="f"><span>Break minutes</span><input type="number" min="0" id="pf-br" value="${esc(d.brk)}" data-in="dlg" data-k="brk"></label>
          <label class="f"><span>Reason for the change</span><input type="text" id="pf-note" value="${esc(d.note)}" data-in="dlg" data-k="note" placeholder="e.g. forgot to clock out"></label></div>
        <p class="small muted" style="margin:0">If the clock-out time is earlier than clock-in, it's counted as the next morning.</p>
        ${d.err ? `<p style="margin:0;color:var(--red)">${esc(d.err)}</p>` : ""}
        <div class="foot">${d.id ? `<button class="btn ghost danger left" data-act="pf-delete">Delete shift</button>` : ""}<button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="pf-save">Save</button></div>`;

    return null;

  // ---------- Schedule ----------
  const t12 = (hhmm) => { const [h, mi] = String(hhmm || "0:0").split(":").map(Number); const ap = h >= 12 ? "PM" : "AM"; const hh = h % 12 || 12; return mi ? `${hh}:${String(mi).padStart(2, "0")} ${ap}` : `${hh} ${ap}`; };
  const shopHours = (d) => { const v = (S.settings.hours || [])[d.getDay()] || ""; const m2 = /^(\d{1,2}:\d{2})-(\d{1,2}:\d{2})$/.exec(v); return m2 ? [m2[1], m2[2]] : null; };
  const shiftsOn = (sid, day) => S.shifts.filter((x) => x.staffId === sid && x.day === day).sort((a, b) => (a.start < b.start ? -1 : 1));
  const shiftMins = (x) => { const [a, b] = [x.start, x.end].map((t) => { const [h, mi] = t.split(":").map(Number); return h * 60 + mi; }); return b > a ? b - a : b + 1440 - a; };
  function schedulePane() {
    const ref = UI.schedDay ? new Date(UI.schedDay + "T12:00") : new Date();
    const days = weekDays(ref);
    const td = today();
    const staff = activeStaff();
    if (!staff.length) return `<div class="empty">Add employees first, on the Employees tab.</div>`;
    const fmt = (d) => d.toLocaleDateString([], { weekday: "short", month: "numeric", day: "numeric" });
    return `<div class="row"><button class="btn small" data-act="sched-week" data-d="-7">← Week before</button>
        <span class="label">${fmt(days[0])} – ${fmt(days[6])}</span>
        <button class="btn small" data-act="sched-week" data-d="7">Next week →</button>
        <button class="btn small ghost" data-act="sched-week" data-d="0">This week</button>
        <span style="margin-left:auto"></span>
        <button class="btn small" data-act="sched-copy">Copy last week</button><button class="btn small" data-act="sched-print">Print schedule</button></div>
      <div class="tablewrap"><table class="sched"><thead><tr><th>Employee</th>${days.map((d) => { const h = shopHours(d); return `<th class="${dayOf(d.toISOString()) === td ? "today" : ""}">${fmt(d)}<div class="hrs">${h ? `${t12(h[0])} – ${t12(h[1])}` : "Closed"}</div></th>`; }).join("")}<th class="r">Hours</th></tr></thead>
        <tbody>${staff.map((st) => {
          let mins = 0;
          return `<tr><td><b>${esc(st.name)}</b></td>${days.map((d) => {
            const day = dayOf(d.toISOString()); const list = shiftsOn(st.id, day); mins += list.reduce((a, x) => a + shiftMins(x), 0);
            return `<td class="cell ${day === td ? "today" : ""} ${shopHours(d) ? "" : "closed"}">${list.map((x) => `<button class="shift" data-act="shift-edit" data-id="${x.id}">${t12(x.start)} – ${t12(x.end)}${x.note ? `<small>${esc(x.note)}</small>` : ""}</button>`).join("")}
              <button class="addshift" data-act="shift-add" data-s="${st.id}" data-day="${day}" aria-label="Add a shift for ${esc(st.name)} on ${fmt(d)}">+</button></td>`;
          }).join("")}<td class="r num"><b>${L.hm(mins * 60000)}</b></td></tr>`;
        }).join("")}</tbody></table></div>
      <p class="small muted" style="margin:0">Anyone can see the schedule; adding or changing shifts needs a manager. Shop hours come from Settings. Today's shift shows on the Time clock board.</p>`;
  }
  function scheduleDoc(days) {
    const fmt = (d) => d.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
    const rows = activeStaff().map((st) => `<tr><td><b>${esc(st.name)}</b></td>${days.map((d) => `<td>${shiftsOn(st.id, dayOf(d.toISOString())).map((x) => `${t12(x.start)}–${t12(x.end)}${x.note ? `<br><i>${esc(x.note)}</i>` : ""}`).join("<br>") || "—"}</td>`).join("")}</tr>`).join("");
    return `<!doctype html><html><head><meta charset="utf-8"><title>Schedule</title><style>@page{size:letter landscape;margin:0.5in}body{font-family:Georgia,serif;color:#3a1d1d}
      h1{font-family:Gloock,Georgia,serif;font-weight:400;color:#b92f37;margin:0 0 4px}p{margin:0 0 14px;font-family:"Courier New",monospace;font-size:12px}
      table{width:100%;border-collapse:collapse}th,td{border:1px solid #b92f37;padding:8px;text-align:left;vertical-align:top;font-size:12px}th{background:#b92f37;color:#f7eeda;font-family:"Courier New",monospace;text-transform:uppercase;letter-spacing:.08em;font-size:11px}</style></head>
      <body><h1>${esc(S.settings.shopName)} · Schedule</h1><p>${fmt(days[0])} – ${fmt(days[6])}</p><table><thead><tr><th>Employee</th>${days.map((d) => `<th>${fmt(d)}<br>${shopHours(d) ? `${t12(shopHours(d)[0])}–${t12(shopHours(d)[1])}` : "Closed"}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></body></html>`;
  }

  // ---------- Sales by employee ----------
  function periodRange(key) {
    const now = new Date();
    if (key === "lastweek" || key === "week") { const ref = new Date(now); if (key === "lastweek") ref.setDate(ref.getDate() - 7); const w = weekDays(ref); return [w[0], dayEnd(w[6]), `${w[0].toLocaleDateString()} – ${w[6].toLocaleDateString()}`]; }
    const y = now.getFullYear(), mo = now.getMonth() - (key === "lastmonth" ? 1 : 0);
    const a = new Date(y, mo, 1), b = new Date(y, mo + 1, 1);
    return [a, b, a.toLocaleDateString([], { month: "long", year: "numeric" })];
  }
  function salesByStaff(a, b) {
    const inRange = (iso) => { const t = Date.parse(iso); return t >= a.getTime() && t < b.getTime(); };
    const rows = new Map();
    const row = (id, name) => { if (!rows.has(id)) rows.set(id, { id, name, count: 0, items: 0, gross: 0, returns: 0 }); return rows.get(id); };
    for (const st of S.staff) if (st.active !== false) row(st.id, st.name);
    for (const sale of S.sales) {
      if (sale.voided || !inRange(sale.date)) continue;
      const r = row(sale.staffId || "", sale.staffId ? (staffById(sale.staffId) || {}).name || sale.staffName || "Former employee" : "Not recorded");
      r.count++; r.items += sale.lines.reduce((x, l) => x + l.qty, 0); r.gross += sale.total;
    }
    for (const ret of S.returns) {
      if (!inRange(ret.date)) continue;
      const orig = S.sales.find((x) => x.id === ret.saleId);
      if (!orig) continue;
      row(orig.staffId || "", orig.staffId ? (staffById(orig.staffId) || {}).name || orig.staffName || "Former employee" : "Not recorded").returns += ret.amount;
    }
    const now = Date.now();
    return [...rows.values()].map((r) => {
      const ms = r.id ? S.punches.filter((p) => p.staffId === r.id).reduce((t, p) => t + L.workedBetween(p, a.getTime(), b.getTime(), now), 0) : 0;
      return { ...r, net: r.gross - r.returns, avg: r.count ? Math.round(r.gross / r.count) : 0, ms, perHour: ms > 0 ? Math.round((r.gross - r.returns) / (ms / 3600000)) : null };
    }).filter((r) => r.id || r.count || r.returns).sort((x, y) => y.net - x.net);
  }
  function bySalesPane() {
    if (isLocked() && hasManager()) return `<div class="empty">Sales by employee is for managers. <button class="btn small" data-act="mgr-unlock">Unlock with manager PIN</button></div>`;
    const key = UI.bsPeriod || "week";
    const [a, b, label] = periodRange(key);
    const rows = salesByStaff(a, b);
    const top = Math.max(1, ...rows.map((r) => r.net));
    const sum = (k) => rows.reduce((t, r) => t + (r[k] || 0), 0);
    const P = [["week", "This week"], ["lastweek", "Last week"], ["month", "This month"], ["lastmonth", "Last month"]];
    return `<div class="row"><div class="seg">${P.map(([k, t]) => `<button data-act="bs-period" data-k="${k}" aria-pressed="${key === k}">${t}</button>`).join("")}</div>
        <span class="label">${esc(label)}</span><span style="margin-left:auto"></span><button class="btn" data-act="bs-export">Export</button></div>
      <div class="tablewrap"><table><thead><tr><th>Employee</th><th class="r">Sales</th><th class="r">Pieces</th><th class="r">Sold</th><th class="r">Returns</th><th class="r">Net</th><th style="width:22%"></th><th class="r">Avg sale</th><th class="r">Hours</th><th class="r">Per hour</th></tr></thead>
        <tbody>${rows.map((r) => `<tr><td><b>${esc(r.name)}</b></td><td class="r num">${r.count}</td><td class="r num">${r.items}</td><td class="r num">${m(r.gross)}</td><td class="r num">${r.returns ? m(-r.returns) : "—"}</td>
          <td class="r num"><b>${m(r.net)}</b></td><td><div class="meter"><i style="width:${Math.max(0, (r.net / top) * 100).toFixed(1)}%"></i></div></td>
          <td class="r num">${r.count ? m(r.avg) : "—"}</td><td class="r num">${r.id ? L.hm(r.ms) : "—"}</td><td class="r num">${r.perHour == null ? "—" : m(r.perHour)}</td></tr>`).join("")}
          <tr class="totals"><td><b>All</b></td><td class="r num">${sum("count")}</td><td class="r num">${sum("items")}</td><td class="r num">${m(sum("gross"))}</td><td class="r num">${sum("returns") ? m(-sum("returns")) : "—"}</td><td class="r num"><b>${m(sum("net"))}</b></td><td></td><td class="r num">${sum("count") ? m(Math.round(sum("gross") / sum("count"))) : "—"}</td><td class="r num">${L.hm(sum("ms"))}</td><td></td></tr></tbody></table></div>
      <p class="small muted" style="margin:0">Sales count toward whoever was picked under "Sold by" on the Register. Returns count against the person who made the original sale, in the period the return happened. Voided sales are left out. "Not recorded" is sales rung up without a name.</p>`;
  }

  async function punchByPin(pin) {
    const st = await staffByPin(pin);
    UI.pin = "";
    if (!st) { render(); return toast("That PIN doesn't match anyone. Try again.", true); }
    UI.dialog = { type: "punch", staffId: st.id };
    render();
  }

  const SA = {
    "sched-week": (el) => { const n = Number(el.dataset.d); if (!n) UI.schedDay = null; else { const d = UI.schedDay ? new Date(UI.schedDay + "T12:00") : new Date(); d.setDate(d.getDate() + n); UI.schedDay = dayOf(d.toISOString()); } render(); },
    "shift-add": (el) => asManager(() => {

    "pf-save": async () => {
      const d = UI.dialog;
      if (!d.day || !d.tin) { d.err = "Enter the day and the clock-in time."; return renderDialog(); }
      const start = new Date(`${d.day}T${d.tin}`);
      let end = d.tout ? new Date(`${d.day}T${d.tout}`) : null;
      if (end && end <= start) end = new Date(end.getTime() + 86400000);
      if (end && end - start > 20 * 3600000) { d.err = "That shift is longer than 20 hours. Check the times."; return renderDialog(); }
      const brk = Math.max(0, parseInt(d.brk, 10) || 0);
      const breaks = brk ? [{ start: new Date(start.getTime() + 60000).toISOString(), end: new Date(start.getTime() + 60000 + brk * 60000).toISOString() }] : [];
      const edit = { at: new Date().toISOString(), note: String(d.note || "").trim() || (d.id ? "Changed by a manager" : "Added by a manager") };
      let p = d.id && S.punches.find((x) => x.id === d.id);
      if (!p) { p = { id: uid(), staffId: d.staffId, edits: [] }; S.punches.push(p); }
      Object.assign(p, { in: start.toISOString(), out: end ? end.toISOString() : null, breaks });
      p.edits = [...(p.edits || []), edit];
      UI.dialog = null; await persist(); render(); toast("Shift saved.");

      const day = today(); const kind = UI.drawerKind || (S.drawers.some((x) => x.day === day && x.kind === "open") ? "close" : "open");
      const opening = S.drawers.filter((x) => x.day === day && x.kind === "open").slice(-1)[0];
