# Builds both apps and publishes them as one GitHub release.
# To publish a new version, change the number in the VERSION file on main (e.g. 1.0.1).
# It can also be run by hand from the Actions tab. The POS and the tablet check this repo's
# latest release for updates.
name: Build and release
# Pushing to the test-build branch builds both apps to check them, without publishing anything.
on:
  push:
    branches: [main, test-build]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.v.outputs.v }}
      go: ${{ steps.v.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          V="$(tr -d ' \r\n' < VERSION)"
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "VERSION must look like 1.2.3, got '$V'"; exit 1; }
          echo "v=$V" >> "$GITHUB_OUTPUT"
          # On main, build only when VERSION holds a number that isn't published yet.
          if [ "$GITHUB_REF_NAME" = "main" ] && git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
            echo "Version $V is already published; nothing to build. Raise the number in VERSION to publish."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  pos:
    name: POS (Windows installer)
    needs: version
    if: needs.version.outputs.go == 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.v }}
    defaults:
      run:
        working-directory: pos
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set version
        run: npm version "${VERSION#v}" --no-git-tag-version --allow-same-version
      - run: npm install --no-audit --no-fund
      - name: Bundle the shop fonts
        run: node ../scripts/copy-fonts.js app/fonts
      - name: Add the customer list sync
        run: cp ../shared/customer-sync.js ../shared/tag-sync.js ../shared/card-pay.js app/
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: pos
          path: |
            pos/dist/*.exe
            pos/dist/*.blockmap
            pos/dist/latest.yml

  tablet:
    name: Tablet (Android APK)
    needs: version
    if: needs.version.outputs.go == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.v }}
    defaults:
      run:
        working-directory: tablet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android tools (already on GitHub's Linux machines)
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" | sort -V | tail -3
      - name: Set version
        run: |
          V="${VERSION#v}"
          echo "window.APP_VERSION = \"$V\";" > www/version.js
          IFS=. read -r MA MI PA <<< "$V"
          echo "APK_CODE=$((MA*10000 + MI*100 + PA))" >> "$GITHUB_ENV"
          echo "APK_NAME=$V" >> "$GITHUB_ENV"
      - run: npm install --no-audit --no-fund
      - name: Bundle the shop fonts
        run: node ../scripts/copy-fonts.js www/fonts
      - name: Add the customer list sync
        run: cp ../shared/customer-sync.js ../shared/tag-sync.js ../shared/card-pay.js www/
      - name: Add the Capacitor runtime (for the full-screen button)
        run: |
          test -f node_modules/@capacitor/core/dist/capacitor.js || { echo "capacitor.js not found in @capacitor/core"; exit 1; }
          cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js
      - run: npx cap add android
      - name: Full-screen support (hides the Android bars)
        run: |
          D=android/app/src/main/java/com/bespoketailoring/tablet
          test -d "$D" || { echo "Android source folder not where expected"; ls -R android/app/src/main/java; exit 1; }
          cp android-extra/ImmersivePlugin.java android-extra/MainActivity.java "$D/"
      - name: App icon and splash
        run: npx capacitor-assets generate --android --iconBackgroundColor '#b92f37' --splashBackgroundColor '#f7eeda'
        continue-on-error: true
      - name: Stamp version into the Android project
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${APK_CODE}/; s/versionName \"[^\"]*\"/versionName \"${APK_NAME}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
      - run: npx cap sync android
      - name: Build
        working-directory: tablet/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "The ANDROID_KEYSTORE_B64 secret is missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -f -p 4 "$IN" aligned.apk
          OUT="Bespoke-Register-Tablet-${APK_NAME}.apk"
          "$BT/apksigner" sign --ks release.jks --ks-key-alias bespoke --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out "$OUT" aligned.apk
          "$BT/apksigner" verify "$OUT"
          rm -f release.jks
      - uses: actions/upload-artifact@v4
        with:
          name: tablet
          path: tablet/Bespoke-Register-Tablet-*.apk

  release:
    name: Publish release
    needs: [version, pos, tablet]
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.v }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Bespoke Register ${{ env.VERSION }}
          make_latest: true
          body: |
            **Shop computer (POS):** Bespoke-Register-Setup .exe — install once; later versions update themselves.
            **Tablet:** Bespoke-Register-Tablet .apk — the app shows a notice when a new one is out.
          files: out/*
