# Builds both apps and publishes them as one GitHub release.
# Start it by pushing a version tag, e.g.  git tag v1.0.1 && git push origin v1.0.1
# The POS checks this repo's latest release for updates; so does the tablet.
name: Build and release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, like 1.0.1 (makes the tag)"
        required: true

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  pos:
    name: POS (Windows installer)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pos
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set version
        run: npm version "${VERSION#v}" --no-git-tag-version --allow-same-version
      - run: npm install --no-audit --no-fund
      - name: Bundle the shop fonts
        run: node ../scripts/copy-fonts.js app/fonts
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: pos
          path: |
            pos/dist/*.exe
            pos/dist/*.blockmap
            pos/dist/latest.yml

  tablet:
    name: Tablet (Android APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tablet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Set version
        run: |
          V="${VERSION#v}"
          echo "window.APP_VERSION = \"$V\";" > www/version.js
          IFS=. read -r MA MI PA <<< "$V"
          echo "APK_CODE=$((MA*10000 + MI*100 + PA))" >> "$GITHUB_ENV"
          echo "APK_NAME=$V" >> "$GITHUB_ENV"
      - run: npm install --no-audit --no-fund
      - name: Bundle the shop fonts
        run: node ../scripts/copy-fonts.js www/fonts
      - run: npx cap add android
      - name: App icon and splash
        run: npx capacitor-assets generate --android --iconBackgroundColor '#b92f37' --splashBackgroundColor '#f7eeda'
        continue-on-error: true
      - name: Stamp version into the Android project
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${APK_CODE}/; s/versionName \"[^\"]*\"/versionName \"${APK_NAME}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
      - run: npx cap sync android
      - name: Build
        working-directory: tablet/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "The ANDROID_KEYSTORE_B64 secret is missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -f -p 4 "$IN" aligned.apk
          OUT="Bespoke-Register-Tablet-${APK_NAME}.apk"
          "$BT/apksigner" sign --ks release.jks --ks-key-alias bespoke --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out "$OUT" aligned.apk
          "$BT/apksigner" verify "$OUT"
          rm -f release.jks
      - uses: actions/upload-artifact@v4
        with:
          name: tablet
          path: tablet/Bespoke-Register-Tablet-*.apk

  release:
    name: Publish release
    needs: [pos, tablet]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(env.VERSION, 'v') && env.VERSION || format('v{0}', env.VERSION) }}
          name: Bespoke Register ${{ env.VERSION }}
          make_latest: true
          body: |
            **Shop computer (POS):** Bespoke-Register-Setup .exe — install once; later versions update themselves.
            **Tablet:** Bespoke-Register-Tablet .apk — the app shows a notice when a new one is out.
          files: out/*
